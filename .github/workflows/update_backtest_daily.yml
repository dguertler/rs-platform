name: Backtest täglich aktualisieren

permissions:
  contents: write

on:
  schedule:
    - cron: '45 1 * * 2-6'   # Di-Sa 03:45 MESZ (01:45 UTC) – nach allen RS-Updates
  workflow_dispatch:

jobs:
  update-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: pip install yfinance pandas

      # Dauerwache gegen unbereinigte Splits. update_backtest_daily.py erkennt einen
      # Split nur am Ende der Reihe; liegt der Bruch weiter hinten (weil die neuen
      # Kerzen schon bereinigt ankamen), findet ihn erst dieser Abgleich gegen die
      # täglich frisch geladenen rs_*.json. Läuft VOR dem Update, damit derselbe
      # Lauf die dabei geleerte 4H-Reihe gleich wieder aufbaut. Ohne Fund passiert nichts.
      - name: Unbereinigte Splits prüfen und betroffene Ticker neu laden
        run: python repair_backtest_splits.py --refetch

      - name: Backtest inkrementell aktualisieren
        run: python update_backtest_daily.py

      - name: Geänderte JSONs committen und pushen
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/backtest_*.json
          git diff --staged --quiet || git commit -m "Backtest-Daten täglich aktualisiert"
          git pull --rebase origin master
          git push origin master

      - name: Fehler-Mail senden
        if: failure()
        env:
          SMTP_HOST:      ${{ secrets.SMTP_HOST }}
          SMTP_PORT:      ${{ secrets.SMTP_PORT }}
          SMTP_USER:      ${{ secrets.SMTP_USER }}
          SMTP_PASS:      ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          JOB_NAME:       "Backtest-Update (update_backtest_daily.yml)"
          RUN_URL:        "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: python notify_failure.py
