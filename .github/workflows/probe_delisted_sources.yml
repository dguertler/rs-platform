name: Datenquellen für delistete NASDAQ-100-Titel prüfen

permissions:
  contents: write

# Nur manuell: prüft Tiingo, FMP und Stooq auf Kurse der Titel, die Yahoo
# für den historischen Backtest nicht mehr liefert.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Quellen prüfen
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python backtest_history/probe_delisted_sources.py

      - name: Ergebnis committen und pushen
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/backtest_history/delisted_sources_probe.json
          git diff --staged --quiet || git commit -m "Datenquellen-Check delistete NASDAQ-100-Titel"
          git pull --rebase origin master
          git push origin master
