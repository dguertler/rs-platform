name: Breakout-Alarm (2→3 Punkte)

permissions:
  contents: write

on:
  schedule:
    - cron: '0 2 * * 2-6'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test-Mail senden (ja/nein)'
        required: false
        default: 'nein'
        type: choice
        options: ['nein', 'ja']

jobs:
  check-alerts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: pip install yfinance pandas matplotlib deep-translator requests

      - name: RS-Datendateien für Script bereitstellen
        run: |
          cp data/rs_full.json  . 2>/dev/null || true
          cp data/rs_dax.json   . 2>/dev/null || true
          cp data/rs_sp500.json . 2>/dev/null || true
          cp data/signals.json  . 2>/dev/null || true

      - name: Alert-Skript ausführen
        env:
          SMTP_HOST:         ${{ secrets.SMTP_HOST }}
          SMTP_PORT:         ${{ secrets.SMTP_PORT }}
          SMTP_USER:         ${{ secrets.SMTP_USER }}
          SMTP_PASS:         ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO:    ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_TEST_MODE:   ${{ github.event.inputs.test_mode == 'ja' && 'true' || 'false' }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          FRONTEND_URL:      ${{ secrets.FRONTEND_URL }}
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_alerts.py

      - name: Zustandsdatei, signals.json und Ratings committen
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add alerts_state.json
          [ -f signals.json ] && mv signals.json data/signals.json && git add data/signals.json || true
          [ -d data/ratings ] && git add data/ratings/ || true
          git diff --staged --quiet || git commit -m "Alert-Zustand + KI-Ratings aktualisiert"
          git push origin master

      - name: Fehler-Mail senden
        if: failure()
        env:
          SMTP_HOST:      ${{ secrets.SMTP_HOST }}
          SMTP_PORT:      ${{ secrets.SMTP_PORT }}
          SMTP_USER:      ${{ secrets.SMTP_USER }}
          SMTP_PASS:      ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          JOB_NAME:       "Breakout-Alert (stock_alerts.yml)"
          RUN_URL:        "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: python notify_failure.py
