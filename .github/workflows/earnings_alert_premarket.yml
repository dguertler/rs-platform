name: Earnings-Live-Alert (Vorbörse/Intraday, ≥5% Sprung + ≥10% EPS-Beat)

# Sendet Mail/Telegram und committet den Alert-Log (data/earnings_alerts_log.json)
# → Schreibrechte nötig.
permissions:
  contents: write

on:
  schedule:
    # Alle 15 Min. 07:00–23:45 UTC (09:00–01:45 MESZ), Mo–Fr — deckt den
    # europäischen Handelsstart (DAX ab 07:00 UTC) bis weit in die
    # US-Nachbörse hinein ab (08.08.2026 erweitert: die alte 08–20-UTC-Grenze
    # ließ sowohl die erste DAX-Handelsstunde als auch die unmittelbare
    # Kursreaktion auf AMC-Meldungen direkt nach US-Handelsschluss unentdeckt
    # bis zum nächsten globalen Digest am Folgetag). Ergänzt
    # earnings_alert_global.yml (Schlusskurs, Folgetag) um eine schnelle
    # Live-Meldung direkt am Earnings-Tag: AMC-Meldungen vom Vorabend zeigen
    # sich oft schon Stunden vor dem regulären Handelsstart deutlich in der
    # Vorbörse (siehe PLTR 04.08.2026: +16–17% vorbörslich, lange bevor der
    # Tagesschluss verfügbar war). Keine Wochenend-/Nacht-Läufe (00:00–07:00
    # UTC): in dem Fenster ist weder in den USA noch in Europa ein
    # getrackter Markt geöffnet, ein Live-Check liefe ins Leere.
    - cron: '*/15 7-23 * * 1-5'
  workflow_dispatch:
    inputs:
      test_tickers:
        description: 'Test: kommagetrennte Ticker (leer = Kalender-Kandidaten)'
        required: false
        default: ''

jobs:
  check-earnings-premarket:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kandidaten ermitteln (billiges Gate, keine Abhängigkeiten)
        id: gate
        run: |
          python3 check_earnings_premarket_gate.py >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          if [ -n "${{ github.event.inputs.test_tickers }}" ]; then
            {
              echo "has_candidates=true"
              echo "tickers=${{ github.event.inputs.test_tickers }}"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Tages-State laden (rollierender Cache)
        id: state_cache
        if: steps.gate.outputs.has_candidates == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .earnings_premarket_state
          key: earnings-premarket-state-${{ steps.gate.outputs.date }}-${{ github.run_id }}
          restore-keys: |
            earnings-premarket-state-${{ steps.gate.outputs.date }}-

      - name: Abhängigkeiten installieren
        if: steps.gate.outputs.has_candidates == 'true'
        run: pip install yfinance pandas requests

      - name: Live-Check ausführen
        if: steps.gate.outputs.has_candidates == 'true'
        env:
          SMTP_HOST:        ${{ secrets.SMTP_HOST }}
          SMTP_PORT:        ${{ secrets.SMTP_PORT }}
          SMTP_USER:        ${{ secrets.SMTP_USER }}
          SMTP_PASS:        ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO:   ${{ secrets.ALERT_EMAIL_TO }}
          FRONTEND_URL:     ${{ secrets.FRONTEND_URL }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RS_API_URL:       ${{ secrets.RS_API_URL }}
          ALERT_API_KEY:    ${{ secrets.ALERT_API_KEY }}
        run: python check_earnings_premarket.py --tickers "${{ steps.gate.outputs.tickers }}"

      - name: Alert-Log committen
        if: steps.gate.outputs.has_candidates == 'true'
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add data/earnings_alerts_log.json
          git diff --staged --quiet && exit 0
          git commit -m "Earnings-Alert-Log aktualisiert (Live)"
          for i in 1 2 3; do
            if git pull --rebase origin master && git push origin master; then
              exit 0
            fi
            echo "Push-Versuch $i fehlgeschlagen, retry…"
            sleep 5
          done
          echo "Alle Push-Versuche fehlgeschlagen." >&2
          exit 1

      - name: Tages-State speichern (rollierender Cache)
        if: steps.gate.outputs.has_candidates == 'true'
        uses: actions/cache/save@v4
        with:
          path: .earnings_premarket_state
          key: earnings-premarket-state-${{ steps.gate.outputs.date }}-${{ github.run_id }}

      - name: Fehler-Mail senden
        if: failure()
        env:
          SMTP_HOST:      ${{ secrets.SMTP_HOST }}
          SMTP_PORT:      ${{ secrets.SMTP_PORT }}
          SMTP_USER:      ${{ secrets.SMTP_USER }}
          SMTP_PASS:      ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          JOB_NAME:       "Earnings-Live-Alert (earnings_alert_premarket.yml)"
          RUN_URL:        "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: python notify_failure.py
