name: NASDAQ100 Daten aktualisieren

permissions:
  contents: write

on:
  schedule:
    # Stündlicher Retry 03:00–11:00 MESZ (01:00–09:00 UTC), da Yahoo Finance
    # den Vortags-Close nicht garantiert sofort nach Handelsschluss liefert
    # (siehe PLTR-Vorfall 04.08.2026). Der Freshness-Check unten sorgt dafür,
    # dass nach dem ersten erfolgreichen Lauf des Tages alle weiteren
    # Versuche sofort überspringen.
    - cron: '0 1-9 * * 2-6'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Datenfrische prüfen
        id: freshness
        run: python3 check_data_freshness.py --files data/rs_full.json >> "$GITHUB_OUTPUT"

      - name: Abhängigkeiten installieren
        if: steps.freshness.outputs.fresh != 'true'
        run: pip install yfinance pandas lxml

      - name: Skript ausführen
        if: steps.freshness.outputs.fresh != 'true'
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python rs_colab.py

      - name: JSON nach data/ verschieben und committen
        if: steps.freshness.outputs.fresh != 'true'
        run: |
          mv rs_full.json data/rs_full.json
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/rs_full.json
          git diff --staged --quiet || git commit -m "RS Daten aktualisiert"
          git pull --rebase origin master
          git push origin master

      - name: Fehler-Mail senden
        if: failure()
        env:
          SMTP_HOST:      ${{ secrets.SMTP_HOST }}
          SMTP_PORT:      ${{ secrets.SMTP_PORT }}
          SMTP_USER:      ${{ secrets.SMTP_USER }}
          SMTP_PASS:      ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          JOB_NAME:       "NASDAQ-Update (update_rs.yml)"
          RUN_URL:        "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: python notify_failure.py
