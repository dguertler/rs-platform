name: Earnings-Überraschung (≥5% Kurssprung + ≥10% EPS-Beat)

# Sendet nur Mail/Telegram, committet nichts → Lese-Rechte genügen.
permissions:
  contents: read

on:
  schedule:
    - cron: '30 2 * * 2-6'
  workflow_dispatch:
    inputs:
      test_date:
        description: 'Test-Datum (YYYY-MM-DD) – leer = gestern'
        required: false
        default: ''

jobs:
  check-earnings:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: pip install yfinance pandas matplotlib lxml deep-translator requests

      - name: RS-Datendateien für Script bereitstellen
        run: |
          cp data/rs_full.json  . 2>/dev/null || true
          cp data/rs_dax.json   . 2>/dev/null || true
          cp data/rs_sp500.json . 2>/dev/null || true

      - name: Earnings-Skript ausführen
        env:
          SMTP_HOST:        ${{ secrets.SMTP_HOST }}
          SMTP_PORT:        ${{ secrets.SMTP_PORT }}
          SMTP_USER:        ${{ secrets.SMTP_USER }}
          SMTP_PASS:        ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO:   ${{ secrets.ALERT_EMAIL_TO }}
          TEST_DATE:        ${{ github.event.inputs.test_date }}
          FRONTEND_URL:     ${{ secrets.FRONTEND_URL }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RS_API_URL:       ${{ secrets.RS_API_URL }}
          ALERT_API_KEY:    ${{ secrets.ALERT_API_KEY }}
        run: python check_earnings.py

      - name: Fehler-Mail senden
        if: failure()
        env:
          SMTP_HOST:      ${{ secrets.SMTP_HOST }}
          SMTP_PORT:      ${{ secrets.SMTP_PORT }}
          SMTP_USER:      ${{ secrets.SMTP_USER }}
          SMTP_PASS:      ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          JOB_NAME:       "Earnings-Alert (earnings_alert.yml)"
          RUN_URL:        "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: python notify_failure.py
