name: Earnings-Überraschung (≥10% EPS-Beat oder ≥8% Kursreaktion)

# Sendet nur Mail/Telegram, committet nichts → Lese-Rechte genügen.
permissions:
  contents: read

on:
  # Automatischer Schedule deaktiviert (08.08.2026, auf Nutzerwunsch): dieser
  # Digest prüft exakt dasselbe RS-Universum wie earnings_alert_premarket.yml
  # (Live-Vorbörse/Intraday) — die Live-Mails + Telegram-Nachrichten während
  # des Tages decken das bereits ab, der Morgen-Digest war redundant. Bleibt
  # als workflow_dispatch für manuelle/Test-Läufe erhalten.
  workflow_dispatch:
    inputs:
      test_date:
        description: 'Test-Datum (YYYY-MM-DD) – leer = gestern'
        required: false
        default: ''

jobs:
  check-earnings:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Zieldatum bestimmen
        id: target
        run: |
          if [ -n "${{ github.event.inputs.test_date }}" ]; then
            echo "date=${{ github.event.inputs.test_date }}" >> "$GITHUB_OUTPUT"
          else
            Y=$(date -u -d "yesterday" +%Y-%m-%d)
            WD=$(date -u -d "$Y" +%u)
            if [ "$WD" = "7" ]; then Y=$(date -u -d "$Y -2 days" +%Y-%m-%d); fi
            if [ "$WD" = "6" ]; then Y=$(date -u -d "$Y -1 days" +%Y-%m-%d); fi
            echo "date=$Y" >> "$GITHUB_OUTPUT"
          fi

      - name: Bereits geprüft? (Dedupe-Cache)
        id: done_cache
        uses: actions/cache/restore@v4
        with:
          path: .earnings_state
          key: earnings-alert-done-${{ steps.target.outputs.date }}

      - name: Datenfrische prüfen
        id: freshness
        if: steps.done_cache.outputs.cache-hit != 'true'
        run: |
          python3 check_data_freshness.py --target "${{ steps.target.outputs.date }}" \
            --files data/rs_full.json data/rs_dax.json data/rs_sp500.json data/rs_smallcap.json \
            >> "$GITHUB_OUTPUT"

      - name: Abhängigkeiten installieren
        if: steps.done_cache.outputs.cache-hit != 'true' && steps.freshness.outputs.fresh == 'true'
        run: pip install yfinance pandas matplotlib lxml deep-translator requests

      - name: RS-Datendateien für Script bereitstellen
        if: steps.done_cache.outputs.cache-hit != 'true' && steps.freshness.outputs.fresh == 'true'
        run: |
          cp data/rs_full.json     . 2>/dev/null || true
          cp data/rs_dax.json      . 2>/dev/null || true
          cp data/rs_sp500.json    . 2>/dev/null || true
          cp data/rs_smallcap.json . 2>/dev/null || true

      - name: Earnings-Skript ausführen
        if: steps.done_cache.outputs.cache-hit != 'true' && steps.freshness.outputs.fresh == 'true'
        env:
          SMTP_HOST:        ${{ secrets.SMTP_HOST }}
          SMTP_PORT:        ${{ secrets.SMTP_PORT }}
          SMTP_USER:        ${{ secrets.SMTP_USER }}
          SMTP_PASS:        ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO:   ${{ secrets.ALERT_EMAIL_TO }}
          TEST_DATE:        ${{ github.event.inputs.test_date }}
          FRONTEND_URL:     ${{ secrets.FRONTEND_URL }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RS_API_URL:       ${{ secrets.RS_API_URL }}
          ALERT_API_KEY:    ${{ secrets.ALERT_API_KEY }}
        run: python check_earnings.py

      - name: Als geprüft markieren
        if: steps.done_cache.outputs.cache-hit != 'true' && steps.freshness.outputs.fresh == 'true'
        run: |
          mkdir -p .earnings_state
          echo "${{ steps.target.outputs.date }}" > .earnings_state/done

      - name: Dedupe-Cache speichern
        if: steps.done_cache.outputs.cache-hit != 'true' && steps.freshness.outputs.fresh == 'true'
        uses: actions/cache/save@v4
        with:
          path: .earnings_state
          key: earnings-alert-done-${{ steps.target.outputs.date }}

      - name: Fehler-Mail senden
        if: failure()
        env:
          SMTP_HOST:      ${{ secrets.SMTP_HOST }}
          SMTP_PORT:      ${{ secrets.SMTP_PORT }}
          SMTP_USER:      ${{ secrets.SMTP_USER }}
          SMTP_PASS:      ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          JOB_NAME:       "Earnings-Alert (earnings_alert.yml)"
          RUN_URL:        "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: python notify_failure.py
