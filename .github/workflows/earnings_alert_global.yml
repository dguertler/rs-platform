name: Earnings-Überraschung Global (US + Europa, ≥5% Sprung + ≥10% EPS-Beat)

# Sendet Mail/Telegram und committet den Alert-Log (data/earnings_alerts_log.json)
# → Schreibrechte nötig.
permissions:
  contents: write

on:
  schedule:
    # Stündlicher Retry 04:50–12:50 MESZ (02:50–10:50 UTC), 30 Min nach dem
    # RS-getrackten Earnings-Alert. Vor dem teuren Voll-Scan (mehrere tausend
    # Ticker) prüft ein Live-Sample (siehe check_data_freshness.py --live),
    # ob Yahoo den Vortags-Close überhaupt schon liefert – sonst macht der
    # Scan nur einen leeren Lauf. Dedupe-Cache verhindert Mehrfach-Mails,
    # sobald für das Zieldatum einmal erfolgreich geprüft wurde.
    - cron: '50 2-10 * * 2-6'
  workflow_dispatch:
    inputs:
      test_date:
        description: 'Test-Datum (YYYY-MM-DD) – leer = gestern'
        required: false
        default: ''
      universe_limit:
        description: 'Nur die ersten N Ticker je Quelle scannen (Testmodus, leer = voller Scan)'
        required: false
        default: ''

jobs:
  check-earnings-global:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Zieldatum bestimmen
        id: target
        run: |
          if [ -n "${{ github.event.inputs.test_date }}" ]; then
            echo "date=${{ github.event.inputs.test_date }}" >> "$GITHUB_OUTPUT"
          else
            Y=$(date -u -d "yesterday" +%Y-%m-%d)
            WD=$(date -u -d "$Y" +%u)
            if [ "$WD" = "7" ]; then Y=$(date -u -d "$Y -2 days" +%Y-%m-%d); fi
            if [ "$WD" = "6" ]; then Y=$(date -u -d "$Y -1 days" +%Y-%m-%d); fi
            echo "date=$Y" >> "$GITHUB_OUTPUT"
          fi

      - name: Bereits geprüft? (Dedupe-Cache)
        id: done_cache
        uses: actions/cache/restore@v4
        with:
          path: .earnings_state
          key: earnings-alert-global-done-${{ steps.target.outputs.date }}

      - name: Abhängigkeiten installieren
        if: steps.done_cache.outputs.cache-hit != 'true'
        run: pip install yfinance pandas matplotlib lxml deep-translator requests

      - name: Datenfrische prüfen (Live-Sample)
        id: freshness
        if: steps.done_cache.outputs.cache-hit != 'true'
        run: |
          python3 check_data_freshness.py --target "${{ steps.target.outputs.date }}" \
            --live "SPY,QQQ,^GDAXI" >> "$GITHUB_OUTPUT"

      - name: RS-Datendateien bereitstellen (Dedupe gegen check_earnings.py)
        if: steps.done_cache.outputs.cache-hit != 'true' && steps.freshness.outputs.fresh == 'true'
        run: |
          cp data/rs_full.json     . 2>/dev/null || true
          cp data/rs_dax.json      . 2>/dev/null || true
          cp data/rs_sp500.json    . 2>/dev/null || true
          cp data/rs_smallcap.json . 2>/dev/null || true

      - name: Globales Earnings-Skript ausführen
        if: steps.done_cache.outputs.cache-hit != 'true' && steps.freshness.outputs.fresh == 'true'
        env:
          SMTP_HOST:        ${{ secrets.SMTP_HOST }}
          SMTP_PORT:        ${{ secrets.SMTP_PORT }}
          SMTP_USER:        ${{ secrets.SMTP_USER }}
          SMTP_PASS:        ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO:   ${{ secrets.ALERT_EMAIL_TO }}
          TEST_DATE:        ${{ github.event.inputs.test_date }}
          UNIVERSE_LIMIT:   ${{ github.event.inputs.universe_limit }}
          FRONTEND_URL:     ${{ secrets.FRONTEND_URL }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RS_API_URL:       ${{ secrets.RS_API_URL }}
          ALERT_API_KEY:    ${{ secrets.ALERT_API_KEY }}
        run: python check_earnings_global.py

      - name: Alert-Log committen
        if: steps.done_cache.outputs.cache-hit != 'true' && steps.freshness.outputs.fresh == 'true'
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add data/earnings_alerts_log.json
          git diff --staged --quiet && exit 0
          git commit -m "Earnings-Alert-Log aktualisiert (Global)"
          for i in 1 2 3; do
            if git pull --rebase origin master && git push origin master; then
              exit 0
            fi
            echo "Push-Versuch $i fehlgeschlagen, retry…"
            sleep 5
          done
          echo "Alle Push-Versuche fehlgeschlagen." >&2
          exit 1

      - name: Als geprüft markieren
        if: steps.done_cache.outputs.cache-hit != 'true' && steps.freshness.outputs.fresh == 'true'
        run: |
          mkdir -p .earnings_state
          echo "${{ steps.target.outputs.date }}" > .earnings_state/done

      - name: Dedupe-Cache speichern
        if: steps.done_cache.outputs.cache-hit != 'true' && steps.freshness.outputs.fresh == 'true'
        uses: actions/cache/save@v4
        with:
          path: .earnings_state
          key: earnings-alert-global-done-${{ steps.target.outputs.date }}

      - name: Fehler-Mail senden
        if: failure()
        env:
          SMTP_HOST:      ${{ secrets.SMTP_HOST }}
          SMTP_PORT:      ${{ secrets.SMTP_PORT }}
          SMTP_USER:      ${{ secrets.SMTP_USER }}
          SMTP_PASS:      ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          JOB_NAME:       "Earnings-Alert Global (earnings_alert_global.yml)"
          RUN_URL:        "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: python notify_failure.py
