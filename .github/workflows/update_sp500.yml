name: S&P 500 Daten aktualisieren

permissions:
  contents: write

on:
  schedule:
    # Stündlicher Retry 03:15–11:15 MESZ (01:15–09:15 UTC) – siehe update_rs.yml
    # für den Hintergrund. Freshness-Check unten überspringt alle Läufe nach
    # dem ersten erfolgreichen des Tages.
    - cron: '15 1-9 * * 2-6'
  workflow_dispatch:
    inputs:
      force:
        description: 'Auch laufen, wenn die Daten schon aktuell sind'
        type: boolean
        default: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Datenfrische prüfen
        id: freshness
        run: python3 check_data_freshness.py --files data/rs_sp500.json >> "$GITHUB_OUTPUT"

      - name: Abhängigkeiten installieren
        if: steps.freshness.outputs.fresh != 'true' || inputs.force
        run: pip install yfinance pandas lxml

      # Point-in-time-Zusammensetzung (fja05680/sp500, MIT) für das rückwirkende
      # Top-20-Ranking. Schlägt der Abruf fehl, bleibt die gespeicherte Datei.
      - name: S&P-500-Zusammensetzung aktualisieren
        if: steps.freshness.outputs.fresh != 'true' || inputs.force
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/fja05680/sp500.git /tmp/sp500
          python backtest_history/build_sp500_membership.py /tmp/sp500

      - name: Teil 1 laden (Financials, Healthcare, Consumer, Energy, Industrials)
        if: steps.freshness.outputs.fresh != 'true' || inputs.force
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ALPACA_API_KEY:    ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: python sp500_colab_1.py

      - name: Teil 2 laden (Tech, Comm, Utilities, Real Estate, Materials)
        if: steps.freshness.outputs.fresh != 'true' || inputs.force
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ALPACA_API_KEY:    ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: python sp500_colab_2.py

      - name: Daten zusammenführen
        if: steps.freshness.outputs.fresh != 'true' || inputs.force
        run: python sp500_merge.py

      - name: JSON nach data/ verschieben und committen
        if: steps.freshness.outputs.fresh != 'true' || inputs.force
        run: |
          mv rs_sp500.json data/rs_sp500.json
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/rs_sp500.json data/backtest_history/sp500_membership.json
          git diff --staged --quiet || git commit -m "S&P 500 Daten aktualisiert"
          git pull --rebase origin master
          git push origin master

      - name: Fehler-Mail senden
        if: failure()
        env:
          SMTP_HOST:      ${{ secrets.SMTP_HOST }}
          SMTP_PORT:      ${{ secrets.SMTP_PORT }}
          SMTP_USER:      ${{ secrets.SMTP_USER }}
          SMTP_PASS:      ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          JOB_NAME:       "S&P-500-Update (update_sp500.yml)"
          RUN_URL:        "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: python notify_failure.py
