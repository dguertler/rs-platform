name: Historischer NASDAQ-100-Backtest (4H ab 2016)

permissions:
  contents: write

# Nur manuell: lädt die Kurse aller ehemaligen und aktuellen NASDAQ-100-
# Mitglieder (Tag/Woche ab 2005 für Ranking und Struktur, 4H über Alpaca ab
# 2016) und simuliert die Live-Logik ab 2016.
on:
  workflow_dispatch:

jobs:
  backtest-history:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Abhängigkeiten installieren
        run: pip install yfinance pandas pyyaml

      # Point-in-time-Zusammensetzung (MIT, github.com/jmccarrell/n100tickers)
      - name: Historische Indexzusammensetzung aktualisieren
        run: |
          git clone --depth 1 https://github.com/jmccarrell/n100tickers.git /tmp/n100tickers
          python backtest_history/build_membership.py /tmp/n100tickers

      - name: Kurse laden und Top 20 historisch ranken
        run: python backtest_history/prepare_data.py

      # 4H-Kerzen ab 2016 für die Live-Logik (Pflicht — ohne 4H kein Backtest)
      - name: 4H-Kerzen über Alpaca laden
        env:
          ALPACA_API_KEY:    ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: python backtest_history/fetch_alpaca_4h.py

      - name: Trades simulieren und je Jahr auswerten
        run: node backtest_history/run_backtest.js

      - name: Ergebnisse committen und pushen
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/backtest_history/
          git diff --staged --quiet || git commit -m "Historischer NASDAQ-100-Backtest aktualisiert"
          git pull --rebase origin master
          git push origin master

      - name: Fehler-Mail senden
        if: failure()
        env:
          SMTP_HOST:      ${{ secrets.SMTP_HOST }}
          SMTP_PORT:      ${{ secrets.SMTP_PORT }}
          SMTP_USER:      ${{ secrets.SMTP_USER }}
          SMTP_PASS:      ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          JOB_NAME:       "Historischer Backtest (backtest_history.yml)"
          RUN_URL:        "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: python notify_failure.py
