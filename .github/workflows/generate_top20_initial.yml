name: Top-20 Analysen (DAX + S&P 500)

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      markets:
        description: 'Märkte (kommagetrennt)'
        required: false
        default: 'DAX_TOP20,SP500_TOP20'
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: pip install yfinance pandas matplotlib anthropic

      - name: RS-Datendateien bereitstellen
        run: |
          cp data/rs_dax.json   . 2>/dev/null || true
          cp data/rs_sp500.json . 2>/dev/null || true
          cp data/rs_full.json  . 2>/dev/null || true

      - name: Analysen generieren
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          KEYWORDS=$(echo "${{ github.event.inputs.markets }}" | tr ',' ' ')
          python generate_rating.py $KEYWORDS

      - name: Ratings committen und pushen
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add data/ratings/
          git diff --staged --quiet || git commit -m "Top-20 Analysen generiert: ${{ github.event.inputs.markets }}"
          git pull --rebase origin master
          git push origin master
