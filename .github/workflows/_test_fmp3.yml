name: TEMP - FMP EU Coverage Test 3

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test ausführen
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python _test_fmp3.py
