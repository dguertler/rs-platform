name: 4H Wiederkehr-Check

# Prüft alle 4h ob Ticker, die zuvor 3 Punkte hatten (W+D aktiv),
# dann den 4H-Punkt verloren haben, diesen wieder zurückgewonnen haben.
# Alle anderen Breakout-Fälle bleiben dem nächtlichen stock_alerts.yml (02:00 UTC) überlassen.

permissions:
  contents: write

on:
  schedule:
    # Mo-Fr jeweils 5 Min nach der vollen Stunde → 4H-Kerze sicher abgeschlossen
    # 10:05 UTC (12:05 MESZ) – nach DAX-Mittag-4H-Schluss
    # 14:05 UTC (16:05 MESZ) – nach DAX-Börsenschluss (~15:30 UTC)
    # 18:05 UTC (20:05 MESZ) – nach erstem US-4H-Schluss (~17:30 UTC = 13:30 ET)
    # 22:05 UTC (00:05 MESZ) – nach US-Börsenschluss (~21:30 UTC = 17:30 ET)
    - cron: '5 10,14,18,22 * * 1-5'
  workflow_dispatch:
    inputs:
      test_ticker:
        description: 'Testmodus: Ticker erzwingen (z.B. ARM) – kein State-Update'
        required: false
        default: ''
        type: string

jobs:
  check-4h-reentry:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: pip install yfinance pandas matplotlib deep-translator requests

      - name: RS-Datendateien und signals.json bereitstellen
        run: |
          cp data/rs_full.json  . 2>/dev/null || true
          cp data/rs_dax.json   . 2>/dev/null || true
          cp data/rs_sp500.json . 2>/dev/null || true
          cp data/signals.json  . 2>/dev/null || true

      - name: 4H-Wiederkehr prüfen
        env:
          SMTP_HOST:         ${{ secrets.SMTP_HOST }}
          SMTP_PORT:         ${{ secrets.SMTP_PORT }}
          SMTP_USER:         ${{ secrets.SMTP_USER }}
          SMTP_PASS:         ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO:    ${{ secrets.ALERT_EMAIL_TO }}
          TEST_TICKER:       ${{ github.event.inputs.test_ticker }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          FRONTEND_URL:      ${{ secrets.FRONTEND_URL }}
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
          RS_API_URL:        ${{ secrets.RS_API_URL }}
          ALERT_API_KEY:     ${{ secrets.ALERT_API_KEY }}
        run: python check_4h_reentry.py

      - name: Zustandsdatei, signals.json und Ratings committen
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add alerts_state.json
          [ -f signals.json ] && mv signals.json data/signals.json && git add data/signals.json || true
          [ -d data/ratings ] && git add data/ratings/ || true
          git diff --staged --quiet || git commit -m "4H-Wiederkehr-Zustand + KI-Ratings aktualisiert"
          git pull --rebase --autostash origin master
          git push origin master

      - name: Fehler-Mail senden
        if: failure()
        env:
          SMTP_HOST:      ${{ secrets.SMTP_HOST }}
          SMTP_PORT:      ${{ secrets.SMTP_PORT }}
          SMTP_USER:      ${{ secrets.SMTP_USER }}
          SMTP_PASS:      ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          JOB_NAME:       "4H-Wiederkehr-Check (check_4h_reentry.yml)"
          RUN_URL:        "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: python notify_failure.py
