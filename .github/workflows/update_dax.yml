name: DAX Daten aktualisieren

permissions:
  contents: write

on:
  schedule:
    # Stündlicher Retry 03:30–11:30 MESZ (01:30–09:30 UTC) – siehe update_rs.yml
    # für den Hintergrund (Yahoo liefert den Vortags-Close nicht garantiert
    # sofort). Freshness-Check unten überspringt alle Läufe nach dem ersten
    # erfolgreichen des Tages.
    - cron: '30 1-9 * * 2-6'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Datenfrische prüfen
        id: freshness
        run: python3 check_data_freshness.py --files data/rs_dax.json >> "$GITHUB_OUTPUT"

      - name: Abhängigkeiten installieren
        if: steps.freshness.outputs.fresh != 'true'
        run: pip install yfinance pandas lxml

      - name: DAX Skript ausführen
        if: steps.freshness.outputs.fresh != 'true'
        run: python dax_colab.py

      - name: JSON nach data/ verschieben und committen
        if: steps.freshness.outputs.fresh != 'true'
        run: |
          mv rs_dax.json data/rs_dax.json
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/rs_dax.json
          git diff --staged --quiet || git commit -m "DAX Daten aktualisiert"
          git pull --rebase origin master
          git push origin master

      - name: Fehler-Mail senden
        if: failure()
        env:
          SMTP_HOST:      ${{ secrets.SMTP_HOST }}
          SMTP_PORT:      ${{ secrets.SMTP_PORT }}
          SMTP_USER:      ${{ secrets.SMTP_USER }}
          SMTP_PASS:      ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          JOB_NAME:       "DAX-Update (update_dax.yml)"
          RUN_URL:        "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: python notify_failure.py
