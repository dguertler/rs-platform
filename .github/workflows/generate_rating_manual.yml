name: KI-Analyse manuell generieren

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Ticker (kommagetrennt, z.B. SNDK,NVDA,ARM)'
        required: true
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: pip install yfinance pandas matplotlib

      - name: RS-Datendateien bereitstellen
        run: |
          cp data/rs_full.json . 2>/dev/null || true
          cp data/signals.json . 2>/dev/null || true

      - name: Analysen generieren
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          TICKERS=$(echo "${{ github.event.inputs.tickers }}" | tr ',' ' ')
          python generate_rating.py $TICKERS

      - name: Ratings committen und pushen
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add data/ratings/
          git diff --staged --quiet || git commit -m "KI-Ratings manuell generiert: ${{ github.event.inputs.tickers }}"
          git pull --rebase origin master
          git push origin master
