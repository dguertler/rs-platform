name: Alpha-Screening (Early Tech · Hidden Champions · Post-Earnings)

permissions:
  contents: read

on:
  schedule:
    - cron: '0 3 * * 2-6'   # Di-Sa 03:00 UTC – nach RS-Updates (01:00-02:00 UTC)
  workflow_dispatch:

jobs:
  screen:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: pip install yfinance pandas requests

      - name: RS-Datendateien bereitstellen
        run: |
          cp data/rs_full.json     . 2>/dev/null || true
          cp data/rs_dax.json      . 2>/dev/null || true
          cp data/rs_sp500.json    . 2>/dev/null || true
          cp data/rs_smallcap.json . 2>/dev/null || true

      - name: Alpha-Screening ausführen
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_hidden_alpha.py

      - name: Kandidaten in data/ ablegen
        run: |
          mkdir -p data
          cp alpha_candidates.json data/alpha_candidates.json 2>/dev/null || true

      - name: Fehler-Mail senden
        if: failure()
        env:
          SMTP_HOST:      ${{ secrets.SMTP_HOST }}
          SMTP_PORT:      ${{ secrets.SMTP_PORT }}
          SMTP_USER:      ${{ secrets.SMTP_USER }}
          SMTP_PASS:      ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          JOB_NAME:       "Alpha-Screening (check_alpha.yml)"
          RUN_URL:        "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: python notify_failure.py
