    .nav-switch:hover { border-color:#3b82f6; color:#e2e8f0; }
    .nav-switch.active { border-color:#7c3aed; color:#a78bfa; background:#130a2a; }

    #app { max-width:1240px; margin:0 auto; padding:20px 12px 80px; }

    .page-header { display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:8px; }
    .page-title { font-size:20px; font-weight:700; color:#e2e8f0; }
    .page-sub { font-size:12px; color:#475569; margin-top:3px; }
    .reset-btn { background:transparent; border:1px solid #334155; color:#64748b; padding:5px 14px; border-radius:6px; font-size:11px; cursor:pointer; font-family:monospace; transition:border-color .15s,color .15s; flex-shrink:0; }

    .global-bar-wrap { background:#1e293b; border-radius:8px; height:10px; overflow:hidden; margin-bottom:6px; }
    .global-bar-fill { height:100%; background:linear-gradient(90deg,#5b21b6,#7c3aed,#a78bfa); border-radius:8px; transition:width .5s ease; }
    .progress-meta { font-size:12px; color:#64748b; display:flex; justify-content:space-between; margin-bottom:28px; }

    .phases-grid { display:grid; grid-template-columns:1fr; gap:14px; }
    @media (min-width:860px) { .phases-grid { grid-template-columns:1fr 1fr; } }

    .phase-card { background:#08111f; border:1px solid #1e293b; border-radius:12px; overflow:hidden; transition:border-color .2s; }
    .phase-card:hover { border-color:#2d3f5e; }
    .phase-header { padding:13px 16px 9px; border-bottom:1px solid #0f172a; display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
    .phase-title { font-size:12.5px; font-weight:700; font-family:monospace; }
    .phase-sub { font-size:10.5px; color:#475569; margin-top:2px; }
    .phase-count { font-size:11px; font-family:monospace; flex-shrink:0; margin-top:2px; }
    .phase-progress-bar { height:3px; }
    .phase-bar-bg { background:#0f172a; }
    .phase-bar-fill { height:3px; transition:width .4s ease; }

    .section-label { font-size:10px; font-weight:700; color:#334155; text-transform:uppercase; letter-spacing:.09em; padding:10px 16px 3px; }

    .task-row { display:flex; align-items:flex-start; gap:9px; padding:5px 16px 5px; cursor:pointer; transition:background .1s; }
    .task-row:hover { background:#0d1526; }
    .task-row:last-child { padding-bottom:10px; }
    .task-cb { margin-top:2px; cursor:pointer; accent-color:#7c3aed; flex-shrink:0; width:13px; height:13px; }
    .task-badge { font-size:9px; font-weight:700; font-family:monospace; padding:1px 5px; border-radius:3px; flex-shrink:0; margin-top:2px; letter-spacing:.02em; }
    .b-DEV   { background:#0f2340; color:#60a5fa; }
    .b-MKT   { background:#092318; color:#4ade80; }
    .b-ZIEL  { background:#251800; color:#fbbf24; }
    .b-RECHT { background:#220808; color:#f87171; }
    .b-LEGAL { background:#200a1a; color:#f472b6; }
    .task-text { font-size:12.5px; color:#94a3b8; line-height:1.5; flex:1; transition:color .15s; }
    .task-text.done { text-decoration:line-through; color:#334155; }

    .ref-wrap { margin-top:36px; display:grid; grid-template-columns:1fr; gap:20px; }
    @media (min-width:900px) { .ref-wrap { grid-template-columns:1fr 1fr; } }
    .ref-card { background:#08111f; border:1px solid #1e293b; border-radius:10px; overflow:hidden; }
    .ref-card-title { font-size:11px; font-weight:700; color:#64748b; text-transform:uppercase; letter-spacing:.08em; padding:12px 16px 8px; border-bottom:1px solid #0f172a; }
    .ref-table { width:100%; border-collapse:collapse; font-size:11.5px; }
    .ref-table th { background:#0d1526; color:#475569; font-weight:600; padding:7px 14px; text-align:left; }
    .ref-table td { padding:7px 14px; border-top:1px solid #0d1526; color:#64748b; }
    .ref-table tr:hover td { background:#0a111e; }
    .val-hi { color:#a78bfa; font-weight:600; }
    .sav-hi { color:#4ade80; font-weight:600; }

function loadState(){ try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}'); }catch(e){ return {}; } }
function saveState(s){ localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }

function allTasks(){
  var all=[];
  PHASES.forEach(function(p){ p.sections.forEach(function(s){ s.tasks.forEach(function(t){ all.push(t); }); }); });
  return all;
}
function phaseTasks(phase){
  var all=[];
  phase.sections.forEach(function(s){ s.tasks.forEach(function(t){ all.push(t); }); });
  return all;
}

function render(){
  var state = loadState();
  var all = allTasks();
  var doneCount = all.filter(function(t){ return state[t.id]; }).length;
  var totalCount = all.length;
  var pct = totalCount ? Math.round(doneCount/totalCount*100) : 0;

  var app = document.getElementById('app');
  app.innerHTML = '';

  // Header
  var hdr = document.createElement('div');
  hdr.className = 'page-header';
  hdr.innerHTML = '<div><div class="page-title">Projektplan Dashboard</div>'
    + '<div class="page-sub">RS Platform &nbsp;·&nbsp; Admin-only &nbsp;·&nbsp; Fortschritt wird lokal gespeichert</div></div>'
    + '<button class="reset-btn" onclick="resetAll()">Zurücksetzen</button>';
  app.appendChild(hdr);

  // Global progress bar
  var gp = document.createElement('div');
  gp.innerHTML = '<div class="global-bar-wrap"><div class="global-bar-fill" style="width:'+pct+'%"></div></div>'
    + '<div class="progress-meta"><span>Gesamtfortschritt</span><span>'+doneCount+' / '+totalCount+' Aufgaben &nbsp;·&nbsp; '+pct+'%</span></div>';
  app.appendChild(gp);

  // Phases grid
  var grid = document.createElement('div');
  grid.className = 'phases-grid';

  PHASES.forEach(function(phase){
    var ptasks = phaseTasks(phase);
    var pdone = ptasks.filter(function(t){ return state[t.id]; }).length;
    var ppct = ptasks.length ? Math.round(pdone/ptasks.length*100) : 0;

    var card = document.createElement('div');
    card.className = 'phase-card';

    // Header
    var ph = document.createElement('div');
    ph.className = 'phase-header';
    ph.innerHTML = '<div><div class="phase-title" style="color:'+phase.color+'">'+phase.title+'</div>'
      + '<div class="phase-sub">'+phase.subtitle+'</div></div>'
      + '<div class="phase-count" style="color:'+phase.color+'">'+pdone+' / '+ptasks.length+'</div>';
    card.appendChild(ph);

    // Progress bar
    var pbWrap = document.createElement('div');
    pbWrap.className = 'phase-bar-bg';
    var pbFill = document.createElement('div');
    pbFill.className = 'phase-bar-fill';
    pbFill.style.cssText = 'width:'+ppct+'%;background:'+phase.color+';height:3px;';
    pbWrap.appendChild(pbFill);
    card.appendChild(pbWrap);

    // Sections + tasks
    phase.sections.forEach(function(sec){
      var sl = document.createElement('div');
      sl.className = 'section-label';
      sl.textContent = sec.name;
      card.appendChild(sl);

      sec.tasks.forEach(function(task){
        var row = document.createElement('label');
        row.className = 'task-row';

        var cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.className = 'task-cb';
        cb.checked = !!state[task.id];
        cb.addEventListener('change', function(){
          var s = loadState();
          s[task.id] = cb.checked;
          saveState(s);
          render();
        });

        var badge = document.createElement('span');
        badge.className = 'task-badge b-'+task.type;
        badge.textContent = task.type;

        var txt = document.createElement('span');
        txt.className = 'task-text' + (state[task.id] ? ' done' : '');
        txt.textContent = task.text;

        row.appendChild(cb);
        row.appendChild(badge);
        row.appendChild(txt);
        card.appendChild(row);
      });
    });

    grid.appendChild(card);
  });

  app.appendChild(grid);

  // Reference tables
  var ref = document.createElement('div');
  ref.className = 'ref-wrap';

  // KPI table
  var kpiCard = document.createElement('div');
  kpiCard.className = 'ref-card';
  kpiCard.innerHTML = '<div class="ref-card-title">KPI-Ziele nach Phase</div>'
    + '<table class="ref-table"><thead><tr><th>Kennzahl</th><th>Phase 1</th><th>Phase 2</th><th>Phase 3</th></tr></thead><tbody>'
    + '<tr><td>Zahlende Nutzer</td><td>50</td><td>300</td><td>1.000</td></tr>'
    + '<tr><td>MRR</td><td>€2k</td><td>€13k</td><td>€45k</td></tr>'
    + '<tr><td>Monatl. Churn</td><td>&lt; 10%</td><td>&lt; 6%</td><td>&lt; 3%</td></tr>'
    + '<tr><td>Free-to-Paid</td><td>5%</td><td>8%</td><td>12%</td></tr>'
    + '<tr><td>NPS</td><td>&gt; 30</td><td>&gt; 45</td><td>&gt; 60</td></tr>'
    + '<tr><td>Signal-Accuracy</td><td>Messen</td><td>&gt; 55%</td><td>&gt; 60%</td></tr>'
    + '</tbody></table>';
  ref.appendChild(kpiCard);

  // Holding tax savings
  var holdCard = document.createElement('div');
  holdCard.className = 'ref-card';
  holdCard.innerHTML = '<div class="ref-card-title">Steuerersparnis Holding bei Exit (§ 8b KStG)</div>'
    + '<table class="ref-table"><thead><tr><th>Verkaufspreis</th><th>Privat ~26,4%</th><th>Holding ~1,5%</th><th>Ersparnis</th></tr></thead><tbody>'
    + '<tr><td>€500k</td><td>~€132k</td><td>~€7,5k</td><td class="sav-hi">~€124k</td></tr>'
    + '<tr><td>€2M</td><td>~€528k</td><td>~€30k</td><td class="sav-hi">~€498k</td></tr>'
    + '<tr><td>€10M</td><td>~€2,64M</td><td>~€150k</td><td class="sav-hi">~€2,49M</td></tr>'
    + '</tbody></table>';
  ref.appendChild(holdCard);

  // Valuation table (full width)
  var valOuter = document.createElement('div');
  valOuter.style.cssText = 'grid-column:1/-1;';
  var valCard = document.createElement('div');
  valCard.className = 'ref-card';
  valCard.innerHTML = '<div class="ref-card-title">Plattformbewertung nach Ausbaustufe &nbsp;·&nbsp; Ø €45/Mo je Nutzer</div>'
    + '<table class="ref-table"><thead><tr><th>Stufe</th><th>Nutzer</th><th>ARR</th><th>Multiple</th><th>Bewertung</th></tr></thead><tbody>'
    + '<tr><td>MVP / Launch (M 0–6)</td><td>0–100</td><td>€0–54k</td><td>—</td><td class="val-hi">€100k–250k</td></tr>'
    + '<tr><td>Early Traction (M 6–18)</td><td>100–500</td><td>€54k–270k</td><td>3–5x</td><td class="val-hi">€200k–1,3M</td></tr>'
    + '<tr><td>Product-Market Fit (J 2–3)</td><td>500–2.000</td><td>€270k–1,1M</td><td>5–8x</td><td class="val-hi">€1,3M–8,8M</td></tr>'
    + '<tr><td>Scaling (J 3–5)</td><td>2.000–10.000</td><td>€1,1M–5,4M</td><td>6–10x</td><td class="val-hi">€6,6M–54M</td></tr>'
    + '<tr><td>Strategischer Exit (J 5+)</td><td>10.000+</td><td>€5,4M+</td><td>+ Aufschlag</td><td class="val-hi">€30M–100M+</td></tr>'
    + '</tbody></table>';
  valOuter.appendChild(valCard);
  ref.appendChild(valOuter);

  app.appendChild(ref);
}

function resetAll(){
  if(!confirm('Alle Aufgaben als unerledigt markieren?')) return;
  localStorage.removeItem(STORAGE_KEY);
  render();
}

document.getElementById('app').style.display = 'block';
render();
</script>
</body>
</html>
