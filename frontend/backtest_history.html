<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RS · Backtest Historie</title>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #060b14; color: #e2e8f0; font-family: 'Inter', system-ui, sans-serif; min-height: 100vh; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0a0f1e; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
    .nav-bar { display:inline-flex; flex-wrap:wrap; align-items:center; gap:5px; padding:12px 12px 0; }
    .nav-switch { display:inline-flex; align-items:center; gap:6px; background:#1e293b; border:1px solid #334155; border-radius:8px; padding:6px 13px; font-size:12px; font-weight:700; color:#94a3b8; text-decoration:none; font-family:monospace; white-space:nowrap; box-shadow:0 2px 8px #00000066; transition:border-color .15s,color .15s; }

    .nav-switch.active { border-color:#f59e0b; color:#fbbf24; background:#1a1a0a; }

    tr.data-row.selected { background: #172033 !important; }

  <a href="index.html"            class="nav-switch">Nasdaq</a>

  <a href="smallcap.html"        class="nav-switch">SC600</a>

  <a href="backtest.html"         class="nav-switch">B-DETAILS</a>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

const green = '#4ade80', red = '#f87171', amber = '#fbbf24', neutral = '#64748b';
const pnlColor = v => v > 0 ? green : v < 0 ? red : neutral;
const pfColor  = v => v == null ? neutral : v >= 1.5 ? green : v >= 1 ? amber : red;
const num = (v, d = 1) => v == null ? '–' : v.toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (v, d = 1) => v == null ? '–' : (v >= 0 ? '+' : '') + num(v, d) + ' %';
const eur = v => v == null ? '–' : (v >= 0 ? '+' : '−') + Math.round(Math.abs(v)).toLocaleString('de-DE') + ' €';
const eurAbs = v => v == null ? '–' : Math.round(v).toLocaleString('de-DE') + ' €';
const VARIANTS = { live4h: 'Live-Logik mit 4H ab 2016' };

function Tile({ label, value, color, sub }) {
  return (
    <div className="card" style={{ flex: '1 1 150px', minWidth: 140 }}>
      <div style={{ fontSize: 10, color: '#64748b', fontFamily: 'monospace', marginBottom: 4 }}>{label}</div>
      <div style={{ fontSize: 20, fontWeight: 700, color: color || '#e2e8f0', fontFamily: 'monospace' }}>{value}</div>
      {sub && <div style={{ fontSize: 10, color: '#64748b', fontFamily: 'monospace', marginTop: 4 }}>{sub}</div>}
    </div>
  );
}

const LIVE_GROUPS = {
  QQQ: 'NASDAQ-100', SPX: 'S&P 500', alle: 'Beide Indizes', nur4H: 'nur 4H-Auslöser (Backtest-Regel)',
  ohneNaeherung: 'nur exakt belegte Alerts (ab Mitte Mai)',
};

function PfStages({ stages, live }) {
  if (!stages) return null;
  const rows = [...stages.stages, { label: `jetzt · echte verschickte Alerts (${live.generated})`, now: true, ...live.groups }];
  const cell = (g) => (
    <>
      <td>{g ? `${g.nTrades} (${g.nOpen})` : '–'}</td>
      <td style={{ color: pfColor(g?.profitFactor), fontWeight: 700 }}>{num(g?.profitFactor, 2)}</td>
      <td style={{ color: pfColor(g?.profitFactorClosed) }}>{num(g?.profitFactorClosed, 2)}</td>
      <td style={{ color: pnlColor(g?.totalPnl) }}>{eur(g?.totalPnl)}</td>
    </>
  );
  return (
    <div style={{ marginTop: 16 }}>
      <div style={{ fontSize: 12, fontWeight: 700, marginBottom: 6 }}>Vorher / Nachher: PF seit Live-Start je Korrekturstand</div>
      <div className="note" style={{ marginBottom: 8 }}>
        Die früheren Stände simulierten die Einstiege selbst (Wochenlauf, nur 4H, Kauf am Folgetag) und lagen
        deshalb neben den echten Alerts. Maßgeblich ist die letzte Zeile.
      </div>
      <div style={{ overflowX: 'auto' }}>
        <table>
          <thead>
            <tr><th>Stand</th>{['NASDAQ-100', 'S&P 500', 'Beide'].map(h => <th key={h} colSpan="4" style={{ textAlign: 'center' }}>{h}</th>)}</tr>
            <tr><th></th>{[0, 1, 2].map(i => <React.Fragment key={i}><th>Trades (offen)</th><th>PF</th><th>PF abgeschl.</th><th>Σ P&L</th></React.Fragment>)}</tr>
          </thead>
          <tbody>
            {rows.map((r, i) => (
              <tr key={i} className="data-row" style={r.now ? { fontWeight: 700 } : undefined}>
                <td style={{ whiteSpace: 'nowrap' }}>{r.label}</td>{cell(r.QQQ)}{cell(r.SPX)}{cell(r.alle)}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function LiveAlerts({ live, stages }) {
  const [show, setShow] = useState(false);
  if (!live) return null;
  const row = (k) => {
    const g = live.groups[k];
    if (!g) return null;
    return (
      <tr key={k} className="data-row">
        <td style={{ fontWeight: k === 'QQQ' || k === 'SPX' ? 700 : 400 }}>{LIVE_GROUPS[k]}</td>
        <td>{g.nTrades} ({g.nOpen})</td>
        <td>{num(g.winrate)} %</td>
        <td style={{ color: pfColor(g.profitFactor), fontWeight: 700 }}>{num(g.profitFactor, 2)}</td>
        <td style={{ color: pfColor(g.profitFactorClosed) }}>{num(g.profitFactorClosed, 2)}</td>
        <td style={{ color: pnlColor(g.avgReturnPerTrade) }}>{pct(g.avgReturnPerTrade)}</td>
        <td style={{ color: pnlColor(g.returnOnInvested) }}>{pct(g.returnOnInvested)}</td>
        <td style={{ color: pnlColor(g.totalPnl) }}>{eur(g.totalPnl)}</td>
      </tr>
    );
  };
  return (
    <div className="card" style={{ marginBottom: 20, borderColor: '#1d4ed8' }}>
      <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 6 }}>Echte Live-Alerts seit {live.firstAlert}</div>
      <div className="note" style={{ marginBottom: 10 }}>
        Jeder tatsächlich per Mail/Telegram verschickte Breakout-Alert ({live.alertsSent} Alerts) als Trade: Kauf zur
        Eröffnung am Alert-Tag, Stopp und Ausstieg wie in der Backtest-Engine, 10.000 € je Signal, max. 1.000 € Risiko,
        eine Position je Titel ({live.skipped.position_offen} Alerts fielen in eine laufende Position). Welche Alerts
        verschickt wurden, stammt aus der Git-Historie (Top 20 zum Versandzeitpunkt); vor Mitte Mai 2026 angenähert.
        PF inkl. offener Positionen, daneben nur abgeschlossene.
      </div>
      <div style={{ overflowX: 'auto' }}>
        <table>
          <thead><tr><th>Gruppe</th><th>Trades (offen)</th><th>Treffer</th><th>PF</th><th>PF abgeschl.</th>
            <th>Ø/Trade</th><th>Rendite auf Einsatz</th><th>Σ P&L</th></tr></thead>
          <tbody>{Object.keys(LIVE_GROUPS).map(row)}</tbody>
        </table>
      </div>
      <PfStages stages={stages} live={live} />
      <button onClick={() => setShow(!show)}
        style={{ marginTop: 10, background: 'transparent', border: '1px solid #334155', borderRadius: 6,
          padding: '4px 12px', color: '#94a3b8', fontFamily: 'monospace', fontSize: 12, cursor: 'pointer' }}>
        {show ? 'Trades ausblenden' : `Alle ${live.trades.length} Trades zeigen`}
      </button>
      {show && (
        <div style={{ overflow: 'auto', maxHeight: 420, marginTop: 10 }}>
          <table>
            <thead><tr><th>Ticker</th><th>Index</th><th>Auslöser</th><th>Alert</th><th>Ausstieg</th><th>Rendite</th><th>P&L</th></tr></thead>
            <tbody>
              {[...live.trades].reverse().map((t, i) => (
                <tr key={i} className="data-row">
                  <td style={{ fontWeight: 700 }}>{t.ticker}</td>
                  <td style={{ color: '#94a3b8' }}>{t.source === 'QQQ' ? 'NDX' : 'SPX'}</td>
                  <td style={{ color: '#94a3b8' }}>{t.trigger}</td>
                  <td>{t.alertDate}{t.basis === 'naeherung' ? '*' : ''}</td>
                  <td style={{ color: t.isOpen ? amber : '#e2e8f0' }}>{t.isOpen ? 'offen' : t.exitDate}</td>
                  <td style={{ color: pnlColor(t.pnlPct) }}>{pct(t.pnlPct)}</td>
                  <td style={{ color: pnlColor(t.pnl) }}>{eur(t.pnl)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function BeforeAfter({ ba }) {
  const first = ba.steps[0], last = ba.steps[ba.steps.length - 1];
  const years = [...new Set([...Object.keys(first.years), ...Object.keys(last.years)])].sort();
  const row = (k, key) => (
    <>
      <td>{k?.nTrades ?? 0}</td>
      <td style={{ color: pfColor(k?.profitFactor), fontWeight: 700 }}>{num(k?.profitFactor, 2)}</td>
      <td>{k ? num(k.winrate) + ' %' : '–'}</td>
      <td style={{ color: pnlColor(k?.avgReturnPerTrade) }}>{pct(k?.avgReturnPerTrade)}</td>
      <td style={{ color: pnlColor(k?.returnOnInvested) }}>{pct(k?.returnOnInvested)}</td>
      <td style={{ color: pnlColor(k?.totalPnl) }}>{eur(k?.totalPnl)}</td>
    </>
  );
  return (
    <div className="card" style={{ marginBottom: 20 }}>
      <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 6 }}>
        Vorher / Nachher: bisheriger Backtest gegen neue Rechnung ({ba.start} – {ba.end})
      </div>
      <div className="note" style={{ marginBottom: 10 }}>
        Gleiche Engine und Live-Logik mit 4H, 10.000 € je Signal, alle Signale (ohne Depot-Grenze). „Vorher" = die Trades
        aus B-Übersicht/B-Details, „Nachher" = die neue historische Rechnung. Die Schritte darunter schalten die
        Unterschiede einzeln zu, damit sichtbar wird, was welche Änderung bewirkt.
        Ø gemeinsame Titel in den beiden Top-20-Listen: <b>{num(ba.top20Overlap)} von 20</b> je Tag.
      </div>
      <div style={{ overflowX: 'auto', marginBottom: 14 }}>
        <table>
          <thead><tr><th>Jahr</th><th colSpan="6" style={{ textAlign: 'center' }}>Vorher</th><th colSpan="6" style={{ textAlign: 'center' }}>Nachher</th></tr>
            <tr><th></th>{[0, 1].map(i => <React.Fragment key={i}><th>Trades</th><th>PF</th><th>Treffer</th><th>Ø/Trade</th><th>Rendite auf Einsatz</th><th>Σ P&L</th></React.Fragment>)}</tr></thead>
          <tbody>
            {years.map(y => (
              <tr key={y} className="data-row"><td style={{ fontWeight: 700 }}>{y}</td>{row(first.years[y])}{row(last.years[y])}</tr>
            ))}
          </tbody>
          <tfoot><tr className="sum-row"><td>Gesamt</td>{row(first.total)}{row(last.total)}</tr></tfoot>
        </table>
      </div>
      <div style={{ overflowX: 'auto' }}>
        <table>
          <thead><tr><th>Schritt</th><th>Trades</th><th>PF</th><th>Treffer</th><th>Ø/Trade</th><th>Rendite auf Einsatz</th><th>Σ P&L</th><th>gleich wie vorher</th></tr></thead>
          <tbody>
            {ba.steps.map((st, i) => (
              <tr key={st.id} className="data-row">
                <td style={{ whiteSpace: 'normal', minWidth: 260, color: i === 0 || i === ba.steps.length - 1 ? '#e2e8f0' : '#94a3b8' }}>{st.label}</td>
                {row(st.total)}
                <td style={{ color: '#94a3b8' }}>{st.sameAsBefore} / {st.total?.nTrades ?? 0}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

const detailsUrl = (ticker, variant) => `backtest_history_details.html?t=${encodeURIComponent(ticker)}&v=${variant}`;

/** Kennzahlen je Aktie über alle Signale einer Variante. */
function stockStats(trades) {
  const by = {};
  for (const t of trades) (by[t.ticker] ||= []).push(t);
  return Object.entries(by).map(([ticker, ts]) => {
    const closed = ts.filter(t => !t.isOpen);
    const gain = ts.filter(t => t.pnl > 0).reduce((s, t) => s + t.pnl, 0);
    const loss = -ts.filter(t => t.pnl < 0).reduce((s, t) => s + t.pnl, 0);
    const taken = ts.filter(t => t.taken);
    return {
      ticker,
      nTrades: ts.length,
      nOpen: ts.length - closed.length,
      winrate: closed.length ? closed.filter(t => t.pnl > 0).length / closed.length * 100 : null,
      profitFactor: loss > 0 ? gain / loss : gain > 0 ? Infinity : null,
      avgPct: ts.reduce((s, t) => s + t.pnlPct, 0) / ts.length,
      sumPct: ts.reduce((s, t) => s + t.pnlPct, 0),
      pnl: ts.reduce((s, t) => s + t.pnl, 0),
      best: Math.max(...ts.map(t => t.pnlPct)),
      worst: Math.min(...ts.map(t => t.pnlPct)),
      avgWeeks: ts.reduce((s, t) => s + (t.holdingWeeks || 0), 0) / ts.length,
      taken: taken.length,
      depotPnl: taken.reduce((s, t) => s + (t.depotPnl || 0), 0),
    };
  });
}

const STOCK_COLS = [
  ['ticker', 'Aktie'], ['nTrades', 'Trades'], ['nOpen', 'offen'], ['winrate', 'Treffer'], ['profitFactor', 'PF'],
  ['avgPct', 'Ø Rendite'], ['sumPct', 'Σ Rendite'], ['pnl', 'Σ P&L'], ['best', 'Bester'], ['worst', 'Schlechtester'],
  ['avgWeeks', 'Ø Wochen'], ['taken', 'im Depot'], ['depotPnl', 'P&L Depot'],
];

function StockTable({ trades, variant }) {
  const [sort, setSort] = useState({ key: 'sumPct', dir: -1 });
  const rows = useMemo(() => {
    const list = stockStats(trades);
    const val = r => (r[sort.key] == null ? -Infinity : r[sort.key]);
    return list.sort((a, b) => sort.key === 'ticker'
      ? sort.dir * a.ticker.localeCompare(b.ticker)
      : sort.dir * (val(a) - val(b)) || a.ticker.localeCompare(b.ticker));
  }, [trades, sort]);
  const total = useMemo(() => stockStats(trades.map(t => ({ ...t, ticker: 'Σ' })))[0], [trades]);
  const click = key => setSort(s => ({ key, dir: s.key === key ? -s.dir : key === 'ticker' ? 1 : -1 }));
  const pf = v => (v === Infinity ? '∞' : num(v, 2));
  const cells = (r) => (<>
    <td>{r.nTrades}</td>
    <td style={{ color: r.nOpen ? amber : '#64748b' }}>{r.nOpen}</td>
    <td>{r.winrate != null ? num(r.winrate) + ' %' : '–'}</td>
    <td style={{ color: pfColor(r.profitFactor), fontWeight: 700 }}>{pf(r.profitFactor)}</td>
    <td style={{ color: pnlColor(r.avgPct) }}>{pct(r.avgPct)}</td>
    <td style={{ color: pnlColor(r.sumPct), fontWeight: 700 }}>{pct(r.sumPct)}</td>
    <td style={{ color: pnlColor(r.pnl) }}>{eur(r.pnl)}</td>
    <td style={{ color: pnlColor(r.best) }}>{pct(r.best)}</td>
    <td style={{ color: pnlColor(r.worst) }}>{pct(r.worst)}</td>
    <td>{num(r.avgWeeks)}</td>
    <td>{r.taken} / {r.nTrades}</td>
    <td style={{ color: pnlColor(r.depotPnl) }}>{eur(r.depotPnl)}</td>
  </>);
  if (!trades.length) return null;
  return (
    <div style={{ marginTop: 24 }}>
      <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 6 }}>Trades je Aktie · {VARIANTS[variant]}</div>
      <div className="note" style={{ marginBottom: 8 }}>
        Alle Signale der Variante je Aktie ({rows.length} Aktien, {trades.length} Trades), 10.000 € je Signal.
        Spaltenkopf anklicken zum Sortieren, Aktie anklicken für alle Trades mit Chart auf <b>B-DETAILS 2</b>.
        „im Depot" = davon in der Depot-Simulation genommen, „P&L Depot" = deren Ergebnis im Depot.
      </div>
      <div style={{ background: '#0a101e', border: '1px solid #1e293b', borderRadius: 10, overflow: 'auto', maxHeight: 640, marginBottom: 20 }}>
        <table>
          <thead><tr>
            {STOCK_COLS.map(([k, label]) => (
              <th key={k} onClick={() => click(k)} style={{ cursor: 'pointer', color: sort.key === k ? amber : undefined }}>
                {label}{sort.key === k ? (sort.dir < 0 ? ' ▼' : ' ▲') : ''}
              </th>
            ))}
          </tr></thead>
          <tbody>
            {rows.map(r => (
              <tr key={r.ticker} className="data-row" onClick={() => { window.location.href = detailsUrl(r.ticker, variant); }}>
                <td style={{ fontWeight: 700 }}>
                  <a href={detailsUrl(r.ticker, variant)} style={{ color: '#93c5fd', textDecoration: 'none' }}>{r.ticker}</a>
                </td>
                {cells(r)}
              </tr>
            ))}
          </tbody>
          <tfoot><tr className="sum-row"><td>Gesamt</td>{cells(total)}</tr></tfoot>
        </table>
      </div>
    </div>
  );
}

function TradeList({ trades, variant }) {
  return (
    <div style={{ background: '#0a101e', border: '1px solid #1e293b', borderRadius: 10, overflow: 'auto', maxHeight: 420, marginBottom: 20 }}>
      <table>
        <thead><tr><th>Ticker</th><th>RS-Rang</th><th>Einstieg</th><th>Ausstieg</th><th>Wochen</th><th>Rendite</th><th>Im Depot</th><th>Einsatz Depot</th><th>P&L Depot</th></tr></thead>
        <tbody>
          {trades.map((t, i) => (
            <tr key={i} className="data-row">
              <td style={{ fontWeight: 700 }}>
                <a href={detailsUrl(t.ticker, variant)} style={{ color: '#93c5fd', textDecoration: 'none' }}>{t.ticker}</a>
              </td>
              <td style={{ color: '#94a3b8' }}>{t.rank <= 20 ? t.rank : '–'}</td>
              <td>{t.entryDate}</td>
              <td style={{ color: t.isOpen ? amber : '#e2e8f0' }}>
                {t.isOpen ? 'offen' : t.exitDate}{t.dataEnded ? ' · Datenende' : ''}
              </td>
              <td>{t.holdingWeeks}</td>
              <td style={{ color: pnlColor(t.pnlPct) }}>{pct(t.pnlPct)}</td>
              <td style={{ color: t.taken ? green : '#64748b' }}>{t.taken ? 'ja' : 'ausgelassen'}</td>
              <td>{t.taken ? eurAbs(t.depotInvested) : '–'}</td>
              <td style={{ color: pnlColor(t.depotPnl) }}>{t.taken ? eur(t.depotPnl) : '–'}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function App() {
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);
  const variant = 'live4h';
  const [year, setYear] = useState(null);

  const [live, setLive] = useState(null);
  const [stages, setStages] = useState(null);
  useEffect(() => {
    fetch('data/live_alerts_performance.json', { cache: 'no-store' })
      .then(r => (r.ok ? r.json() : null)).then(setLive).catch(() => setLive(null));
    fetch('data/live_pf_stages.json', { cache: 'no-store' })
      .then(r => (r.ok ? r.json() : null)).then(setStages).catch(() => setStages(null));
  }, []);

  useEffect(() => {
    fetch('data/backtest_history/ndx_results.json', { cache: 'no-store' })
      .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
      .then(setData)
      .catch(e => setError(e.message));
  }, []);

  const v = data?.variants?.[variant];
  const yearTrades = useMemo(
    () => (v && year ? v.trades.filter(t => (t.exitDate || t.entryDate).startsWith(year)) : []),
    [v, year]
  );

  if (error) return <div style={{ padding: 60, color: red, fontFamily: 'monospace' }}>Fehler beim Laden: {error}</div>;
  if (!data) return <div style={{ padding: 60, color: '#475569', fontFamily: 'monospace' }}>Lade Ergebnisse…</div>;

  const startYear = v?.start ? v.start.slice(0, 4) : '0000';
  const years = data.ndx ? Object.keys(data.ndx).sort().filter(y => y >= startYear) : [];
  const ndxTotal = years.length
    ? (years.reduce((f, y) => f * (1 + data.ndx[y].pct / 100), 1) - 1) * 100 : null;
  const pf = v?.portfolio;
  const spanYears = v?.start && data.period ? (new Date(data.period.end) - new Date(v.start)) / (365.25 * 864e5) : 0;
  const ndxCagr = ndxTotal != null && spanYears > 0 ? ((1 + ndxTotal / 100) ** (1 / spanYears) - 1) * 100 : null;

  return (
    <div style={{ maxWidth: 1100, margin: '0 auto', padding: '40px 16px' }}>
      <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 6 }}>Historischer Backtest · NASDAQ-100</div>
      <div className="note" style={{ marginBottom: 20 }}>
        Live-Logik ab 2016 (4H-Kerzen über Alpaca): Einstieg, sobald Weekly, Daily und 4H GWS gebrochen sind (3 von 3
        Punkten, ausgelöst über 4H) und die Aktie am Einstiegstag in den <b>Top 20</b> des Index steht. Das Ranking wird für jeden Handelstag nur unter
        den <b>damaligen Indexmitgliedern</b> berechnet, mit derselben Formel wie live. Stopp, täglicher Ausstieg,
        10.000 € je Signal und 1.000 € Risiko wie in der Live-Engine. Trades werden dem Jahr ihres Verkaufs zugeordnet (noch offene dem laufenden Jahr).
      </div>

      <LiveAlerts live={live} stages={stages} />

      {!data.variants && (
        <div className="card note" style={{ borderColor: '#92400e', marginBottom: 20 }}>
          Die historischen Jahre sind noch nicht berechnet. In GitHub Actions den Workflow
          <b> „Historischer NASDAQ-100-Backtest (4H ab 2016)"</b> starten — er lädt die Kurse, rankt die
          Top 20 und schreibt die Ergebnisse hierher.
        </div>
      )}

      {data.beforeAfter && <BeforeAfter ba={data.beforeAfter} />}

      {data.variants && (<>
        {pf && (
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 10, marginBottom: 20 }}>
            <Tile label="Depotwert heute" value={eurAbs(pf.endEquity)} color={pnlColor(pf.returnPct)}
              sub={`Start ${eurAbs(pf.startCapital)} am ${v.start}`} />
            <Tile label="Depot p. a." value={pct(pf.cagr)} color={pnlColor(pf.cagr)} sub={`gesamt ${pct(pf.returnPct, 0)}`} />
            <Tile label="NASDAQ-100 p. a." value={pct(ndxCagr)} color={pnlColor(ndxCagr)} sub={`gesamt ${pct(ndxTotal, 0)}`} />
            <Tile label="Depot max. Rückgang" value={num(pf.maxDD) + ' %'} color={red} />
            <Tile label="Profit-Faktor (genommene Trades)" value={num(pf.profitFactor, 2)} color={pfColor(pf.profitFactor)}
              sub={`${pf.taken} Trades · ${pf.skipped} ausgelassen`} />
            <Tile label="PF NDX-Minus- / Plusjahre" value={`${num(v.ndxDown?.profitFactor, 2)} / ${num(v.ndxUp?.profitFactor, 2)}`}
              sub="alle Signale" />
          </div>
        )}

        <div style={{ background: '#0a101e', border: '1px solid #1e293b', borderRadius: 10, overflow: 'auto', marginBottom: 12 }}>
          <table>
            <thead>
              <tr>
                <th>Jahr</th><th>NASDAQ-100</th><th>Depot</th><th>Depotwert Jahresende</th>
                <th title="Größter Rückgang des Depots vom Höchststand innerhalb des Jahres">Depot max. Rückgang</th>
                <th title="Größter Rückgang des NASDAQ-100 vom Höchststand innerhalb des Jahres">NDX max. Rückgang</th>
                <th>Trades</th><th>ausgelassen</th><th>Trefferquote</th><th>Profit-Faktor</th><th>Mitglieder mit Kursdaten</th>
              </tr>
            </thead>
            <tbody>
              {years.map(y => {
                const n = data.ndx[y], k = pf?.years?.[y], cov = data.coverage?.[y];
                return (
                  <tr key={y} className={`data-row${n.pct < 0 ? ' bear' : ''}${year === y ? ' selected' : ''}`}
                    onClick={() => setYear(year === y ? null : y)}>
                    <td style={{ fontWeight: 700 }}>{y}{n.partial ? '*' : ''}</td>
                    <td style={{ color: pnlColor(n.pct) }}>{pct(n.pct)}</td>
                    <td style={{ color: pnlColor(k?.returnPct), fontWeight: 700 }}>{pct(k?.returnPct)}</td>
                    <td>{eurAbs(k?.endEquity)}</td>
                    <td style={{ color: red }}>{k ? num(k.maxDD) + ' %' : '–'}</td>
                    <td style={{ color: red }}>{num(n.max_dd)} %</td>
                    <td>{k?.taken ?? 0}</td>
                    <td style={{ color: '#64748b' }}>{k?.skipped ?? 0}</td>
                    <td>{k?.winrate != null ? num(k.winrate) + ' %' : '–'}</td>
                    <td style={{ color: pfColor(k?.profitFactor), fontWeight: 700 }}>{num(k?.profitFactor, 2)}</td>
                    <td style={{ color: cov && cov.missing.length / cov.members > 0.1 ? amber : '#94a3b8' }}
                      title={cov?.missing.join(', ')}>
                      {cov ? `${cov.members - cov.missing.length} / ${cov.members}` : '–'}
                    </td>
                  </tr>
                );
              })}
            </tbody>
            {pf && (
              <tfoot>
                <tr className="sum-row">
                  <td>Gesamt</td>
                  <td style={{ color: pnlColor(ndxTotal) }}>{pct(ndxTotal)}</td>
                  <td style={{ color: pnlColor(pf.returnPct) }}>{pct(pf.returnPct)}</td>
                  <td>{eurAbs(pf.endEquity)}</td>
                  <td style={{ color: red }}>{num(pf.maxDD)} %</td>
                  <td>–</td>
                  <td>{pf.taken}</td>
                  <td style={{ color: '#64748b' }}>{pf.skipped}</td>
                  <td>{num(pf.winrate)} %</td>
                  <td style={{ color: pfColor(pf.profitFactor) }}>{num(pf.profitFactor, 2)}</td>
                  <td>–</td>
                </tr>
              </tfoot>
            )}
          </table>
        </div>
        <div className="note" style={{ marginBottom: 20 }}>
          <b>Depot</b>: Start mit {eurAbs(pf?.startCapital)}, {eurAbs(pf?.baseSlot)} je Trade. Mit wachsendem Depot kommen
          zuerst weitere Plätze dazu (Depotwert ÷ {eurAbs(pf?.baseSlot)}, also 10 Plätze bei 100.000 €, 15 bei 150.000 €),
          bis {pf?.maxPositions} Trades gleichzeitig möglich sind. Erst ab {eurAbs((pf?.baseSlot ?? 0) * (pf?.maxPositions ?? 0))}
          {pf?.fullFrom ? ` (erreicht am ${pf.fullFrom})` : ''} wächst der Einsatz je Trade mit dem Depot (Depotwert ÷
          {' '}{pf?.maxPositions}, Zinseszins). Fällt das Depot unter 100.000 €, stehen entsprechend weniger Plätze zur
          Verfügung. Wie live wird je Trade höchstens 10 % des Einsatzes riskiert; bei weitem Stopp wird entsprechend weniger
          gekauft. Sind alle Plätze belegt, wird das Signal <b>ausgelassen</b>; bei mehreren Signalen am selben Tag gewinnt
          der bessere RS-Rang. Ohne Kosten und Steuern, Depotwert zum Jahresende inkl. offener Positionen.
          Rot markiert: Jahre, in denen der NASDAQ-100 gefallen ist. * = Teiljahr. <b>max. Rückgang</b> = größter Rückgang
          vom zwischenzeitlichen Höchststand innerhalb des Jahres. Trades, Trefferquote und Profit-Faktor beziehen sich auf die
          im Jahr verkauften (bzw. noch offenen), tatsächlich genommenen Trades. Zeile anklicken für die Trades des Jahres. Gelb bei „Mitglieder
          mit Kursdaten": mehr als 10 % der damaligen Mitglieder ohne Kurse bei Yahoo.
        </div>

        {year && (<>
          <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 8 }}>Trades {year} · {VARIANTS[variant]}</div>
          <TradeList trades={yearTrades} variant={variant} />
        </>)}

        <div className="card note">
          <div style={{ fontWeight: 700, color: '#e2e8f0', marginBottom: 6 }}>Datengrundlage</div>
          Indexzusammensetzung: <a href={data.membershipSource} style={{ color: '#93c5fd' }}>n100tickers</a> (tagesgenau ab {data.period.start}).
          Kurse: Yahoo Finance, split- und dividendenbereinigt, Stand {data.period.end}.
          {' '}{data.symbols.total} Symbole waren im Zeitraum im Index: {data.symbols.aktiv} heute noch gehandelt,
          {' '}{data.symbols.delistedMitDaten} nicht mehr gehandelt mit Kursdaten, {data.symbols.keineDaten} ohne Kursdaten.
          {data.symbols.alpaca?.length > 0 && <>{' '}Tageskurse von Alpaca (ab 2016) für {data.symbols.alpaca.length} Mitglieder,
            die Yahoo nicht mehr führt: {data.symbols.alpaca.map(a => a.ticker).join(', ')}.</>}
          {' '}4H-Kerzen ab {data.h4?.start}: Alpaca ({data.h4?.feed}), {data.h4?.symbols} Symbole. Gerankt werden alle
          damaligen Mitglieder mit Kursdaten, auch heute nicht mehr gehandelte.
          {data.symbols.withJumps.length > 0 && (
            <div style={{ marginTop: 6 }}>
              Kurssprünge über Faktor 1,8 bzw. unter 0,55 (mögliche Split-Fehler, zur Prüfung):{' '}
              {data.symbols.withJumps.map(j => `${j.ticker} (${j.dates.join(', ')})`).join(' · ')}
            </div>
          )}
        </div>

        <StockTable trades={v?.trades || []} variant={variant} />
      </>)}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
