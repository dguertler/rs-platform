<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RS Platform - Neues Passwort</title>
  <script src="/api.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0f1e; color: #e2e8f0; font-family: 'Inter', system-ui, sans-serif;
           min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 40px; width: 100%; max-width: 380px; }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 6px; color: #f1f5f9; }
    .sub { font-size: 13px; color: #64748b; margin-bottom: 32px; }
    label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.06em; }
    input { width: 100%; background: #1e293b; border: 1px solid #334155; border-radius: 6px; color: #e2e8f0; font-size: 14px; padding: 10px 14px; margin-bottom: 18px; outline: none; transition: border-color 0.15s; }
    input:focus { border-color: #3b82f6; }
    button { width: 100%; background: #2563eb; border: none; border-radius: 6px; color: #fff; font-size: 14px; font-weight: 500; padding: 11px; cursor: pointer; }
    button:hover:not(:disabled) { background: #1d4ed8; }
    button:disabled { background: #1e3a5f; cursor: not-allowed; color: #64748b; }
    .msg { border-radius: 6px; font-size: 13px; padding: 10px 14px; margin-bottom: 16px; display: none; }
    .err { background: #450a0a; border: 1px solid #7f1d1d; color: #fca5a5; }
    .ok  { background: #052e16; border: 1px solid #166534; color: #86efac; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Neues Passwort</h1>
    <p class="sub">Mindestens 8 Zeichen.</p>
    <div class="msg err" id="err"></div>
    <div class="msg ok"  id="ok"></div>
    <form id="form">
      <label>Neues Passwort</label>
      <input type="password" id="pw1" required placeholder="........">
      <label>Wiederholen</label>
      <input type="password" id="pw2" required placeholder="........">
      <button type="submit" id="btn">Passwort speichern</button>
    </form>
  </div>
  <script>
    var token = new URLSearchParams(location.search).get("token");
    if (!token) {
      document.getElementById("err").textContent = "Kein gueltiger Reset-Link.";
      document.getElementById("err").style.display = "block";
      document.getElementById("form").style.display = "none";
    }
    document.getElementById("form").addEventListener("submit", async function(e) {
      e.preventDefault();
      var btn=document.getElementById("btn"), err=document.getElementById("err"), ok=document.getElementById("ok");
      var pw1=document.getElementById("pw1").value, pw2=document.getElementById("pw2").value;
      err.style.display="none"; ok.style.display="none";
      if (pw1!==pw2) { err.textContent="Passwoerter stimmen nicht ueberein."; err.style.display="block"; return; }
      btn.disabled=true; btn.textContent="Speichern...";
      try {
        var r = await fetch("/api/auth/reset", { method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({token: token, password: pw1}) });
        var d = await r.json();
        if (!r.ok) throw new Error(d.detail||"Fehler");
        ok.textContent="Passwort geaendert. Weiterleitung..."; ok.style.display="block";
        document.getElementById("form").style.display="none";
        setTimeout(function(){ window.location.href="/login.html"; }, 2000);
      } catch(ex) {
        err.textContent=ex.message; err.style.display="block";
        btn.disabled=false; btn.textContent="Passwort speichern";
      }
    });
  </script>
</body>
</html>
