<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RS · S&P 500 Dashboard</title>
  <script src="api.js?v=20260922"></script>
  <script src="watchlist.js?v=20260922"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #060b14; color: #e2e8f0; font-family: 'Inter', system-ui, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0a0f1e; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
    select, button { outline: none; }
    .chart-wrap { position: relative; }
    .chart-wrap svg { display: block; }
    @keyframes redGlow { 0%,100%{box-shadow:0 0 6px #ef444455} 50%{box-shadow:0 0 16px #ef4444aa} }
    .red-glow { animation: redGlow 1.3s ease-in-out infinite; }
    @keyframes flamePulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.75;transform:scale(1.2)} }
    .flame-anim { display:inline-block; animation: flamePulse 0.9s ease-in-out infinite; }
    .charts-grid { display:flex; flex-direction:column; gap:10px; }
    @media (min-width:768px) {
      .charts-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
      .chart-full-width { grid-column:1/-1; }
    }
    @media (min-width:1100px) {
      .desktop-layout { display:flex; flex-direction:row; align-items:flex-start; gap:16px; }
      .desktop-left { width:560px; flex-shrink:0; }
      .desktop-right { flex:1; min-width:0; position:sticky; top:16px; align-self:flex-start; }
    }
    .nav-bar { display:inline-flex; align-items:center; gap:5px; padding:12px 12px 0; }
    .nav-switch { display:inline-flex; align-items:center; gap:6px; background:#1e293b; border:1px solid #334155; border-radius:8px; padding:6px 13px; font-size:12px; font-weight:700; color:#94a3b8; text-decoration:none; font-family:monospace; white-space:nowrap; box-shadow:0 2px 8px #00000066; transition:border-color .15s, color .15s; }
    .nav-switch:hover { border-color:#3b82f6; color:#e2e8f0; }
    .nav-switch.active { border-color:#3b82f6; color:#e2e8f0; background:#1a2f4a; }
  </style>
</head>
<body>
<div class="nav-bar">
  <a href="index.html" class="nav-switch">Nasdaq</a>
  <a href="sp500.html" class="nav-switch active">S&amp;P500</a>
  <a href="smallcap.html" class="nav-switch">SC600</a>
  <a href="watchlist.html"            class="nav-switch">Watchlist</a>
  <a href="backtest_overview.html" class="nav-switch">B-ÜBERSICHT</a>
  <a href="backtest.html" class="nav-switch">B-DETAILS</a>
  <a href="v2.html" class="nav-switch" style="border-color:#22c55e;color:#4ade80;">RS-Platform 2.0</a>
</div>
<div id="root"></div>
<script>
  window.apiFetch = function (url, opts) { return fetch(url, opts || {}); };
</script>
<script type="text/babel" src="rs_charts.js?v=20260922"></script>
<script type="text/babel">
const { useState, useMemo, useRef, useCallback, useEffect } = React;

// ── GWS-D Analyse (korrekte Down-Retracement Logik) ──────────────────────────
//
// Ein Down-Retracement entsteht ERST wenn ein vorheriges Swing-Tief unterschritten wird.
// Das GWS-D ist dann das HÖCHSTE Hoch zwischen dem alten Tief und dem neuen tieferen Tief.
//
// Ablauf:
//   1. Sequenz von Swing-Hochs und Swing-Tiefs ermitteln
//   2. Suche tiefere Tiefs (jedes Swing-Tief, das ein vorheriges Swing-Tief unterschreitet)
//   3. Für jedes tiefere Tief: GWS-D = höchstes Hoch zwischen dem alten Tief und dem neuen Tief
//   4. Aktuelles GWS-D = letztes so ermitteltes Hoch
//   5. Bullish = Close über GWS-D Preis
function App() {
  const [data, setData]         = useState(null);
  const [error, setError]       = useState(null);
  const [showAll, setShowAll]   = useState(false);
  const [selected, setSelected] = useState(null);
  const chartRef = useRef(null);
  const handleSelect = useCallback((ticker) => {
    setSelected(ticker);
    setTimeout(() => chartRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
  }, []);
  const [liveBench, setLiveBench] = useState({ w: null, d: null });
  const [signals, setSignals] = useState({});
  const [ratings, setRatings] = useState({});
  const [evScores, setEvScores] = useState({});
  const [ratingModal, setRatingModal] = useState(null);
  const [ratingHtml, setRatingHtml] = useState('');
  const [ratingsLoaded, setRatingsLoaded] = useState(false);
  const [ohlcvCache, setOhlcvCache] = useState({});

  // Live-Fetch Benchmark OHLCV (QQQ) von Yahoo Finance als Fallback
  useEffect(() => {
    Promise.all([
      fetchYFChart("SPY", "1wk", "60wk"),
      fetchYFChart("SPY", "1d",  "3mo"),
    ]).then(([w, d]) => {
      if (w.length > 0 || d.length > 0) setLiveBench({ w, d });
    });
  }, []);

  useEffect(() => {
    apiFetch("data/rs_sp500.json")
      .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
      .then(json => {
        const arr = Array.isArray(json) ? json : json.data;
        const normalized = {
          timestamp: Array.isArray(json) ? "–" : (json.timestamp || "–"),
          benchmark: "SPX",
          top20: arr.slice(0, 20).map(d => d.ticker),
          data: arr,
          benchmark_ohlcv_w: Array.isArray(json) ? [] : (json.benchmark_ohlcv_w || []),
          benchmark_ohlcv:   Array.isArray(json) ? [] : (json.benchmark_ohlcv   || []),
        };
        setData(normalized);
        const first = normalized.data.find(d => d.ohlcv?.length);
        if (first) setSelected(first.ticker);
      })
      .catch(e => setError(e.message));
  }, []);

  useEffect(() => {
    apiFetch("data/signals.json")
      .then(r => r.ok ? r.json() : {})
      .then(json => setSignals(json))
      .catch(() => {});
  }, []);

  useEffect(() => {
    apiFetch("data/ratings/index.json")
      .then(r => r.ok ? r.json() : { ratings: [] })
      .then(json => {
        const map = {};
        (json.ratings || []).forEach(r => {
          const k = r.ticker.toUpperCase();
          map[k] = r;
          const base = k.replace(/\.[^.]+$/, '');
          if (base !== k) map[base] = r;
        });
        setRatings(map);
        setRatingsLoaded(true);
      })
      .catch(() => { setRatingsLoaded(true); });
  }, []);

  // Automatisierter EV-Screening-Score (kein LLM) — nur Orientierung für Ticker ohne
  // manuelle Analyse; überschreibt nie einen vorhandenen `rating`-Wert (siehe evPct unten).
  useEffect(() => {
    apiFetch("data/ev_scores.json")
      .then(r => r.ok ? r.json() : { scores: {} })
      .then(json => {
        const map = {};
        Object.entries(json.scores || {}).forEach(([ticker, s]) => {
          const k = ticker.toUpperCase();
          map[k] = s;
          const base = k.replace(/\.[^.]+$/, '');
          if (base !== k) map[base] = s;
        });
        setEvScores(map);
      })
      .catch(() => {});
  }, []);

  useEffect(() => {
    if (!ratingModal) { setRatingHtml(''); return; }
    const r = ratings[ratingModal.toUpperCase()];
    const ticker = r ? r.ticker.toLowerCase() : ratingModal.toLowerCase();
    const slug = ticker.replace(/[^a-z0-9]/g, '_');
    setRatingHtml('');
    apiFetch(`data/ratings/${slug}.html`)
      .then(res => res.ok ? res.text() : null)
      .then(html => setRatingHtml(html || '<p style="color:#64748b;padding:24px;font-family:monospace">Keine Analyse vorhanden.</p>'))
      .catch(() => setRatingHtml('<p style="color:#f87171;padding:24px;font-family:monospace">Fehler beim Laden.</p>'));
  }, [ratingModal]);

  // OHLCV für ausgewählten Ticker liegt bereits im geladenen Marktdatensatz
  useEffect(() => {
    if (!selected || ohlcvCache[selected]) return;
    const entry = data?.data.find(d => d.ticker === selected);
    if (!entry?.ohlcv?.length) return;
    setOhlcvCache(prev => ({ ...prev, [selected]: {
      ohlcv_w: entry.ohlcv_w || [], ohlcv: entry.ohlcv || [], ohlcv_4h: entry.ohlcv_4h || [],
    }}));
  }, [selected, data]);
  const rsData = useMemo(() => {
    if (!data) return [];
    return data.data.map(d => ({ t: d.ticker, s: d.score, w: d.windows, pr: d.prev_rank ?? null }));
  }, [data]);

  const sorted = useMemo(() =>
    [...rsData].sort((a, b) =>
      b.s - a.s
    ), [rsData]);

  const rows = showAll ? sorted : sorted.slice(0, 20);

  // Ø EV-Upside über alle aktuell angezeigten Ticker (manuelle Analyse geht vor Auto-Score)
  const evAverage = useMemo(() => {
    const values = rows.map(item => {
      const r = ratings[item.t.toUpperCase()] || ratings[item.t.replace(/\.[^.]+$/,'').toUpperCase()];
      if (r) return r.ev_upside_pct;
      const a = evScores[item.t.toUpperCase()] || evScores[item.t.replace(/\.[^.]+$/,'').toUpperCase()];
      return a?.available ? a.upside_pct : null;
    }).filter(v => v != null);
    if (values.length === 0) return null;
    return { avg: values.reduce((a,b) => a+b, 0) / values.length, n: values.length };
  }, [rows, ratings, evScores]);

  // Weekly OHLCV (lazy-loaded)
  const ohlcvW = useMemo(() => {
    if (!selected) return null;
    const c = ohlcvCache[selected];
    return c?.ohlcv_w?.length > 0 ? c.ohlcv_w : null;
  }, [ohlcvCache, selected]);

  // Daily OHLCV (lazy-loaded)
  const ohlcv = useMemo(() => {
    if (!selected) return null;
    const c = ohlcvCache[selected];
    return c?.ohlcv?.length > 0 ? c.ohlcv : null;
  }, [ohlcvCache, selected]);

  // 4H OHLCV (lazy-loaded)
  const ohlcv4h = useMemo(() => {
    if (!selected) return null;
    const c = ohlcvCache[selected];
    return c?.ohlcv_4h?.length > 0 ? c.ohlcv_4h : null;
  }, [ohlcvCache, selected]);

  const structureW  = useMemo(() => analyzeWeeklyStructure(ohlcvW), [ohlcvW]);

  // Slice daily + 4H to match weekly candle count so charts show same time window
  const nCandles = ohlcvW?.length ?? 60;
  const ohlcvDisplay   = useMemo(() => ohlcv?.slice(-nCandles)   ?? null, [ohlcv,   nCandles]);
  const ohlcv4hDisplay = useMemo(() => ohlcv4h?.slice(-nCandles) ?? null, [ohlcv4h, nCandles]);

  const structure   = useMemo(() => analyzeStructure(ohlcvDisplay),   [ohlcvDisplay]);
  const structure4h = useMemo(() => analyze4HStructure(ohlcv4hDisplay), [ohlcv4hDisplay]);

  const tickerSignals = useMemo(() => (selected && signals[selected]) ? signals[selected] : [], [signals, selected]);

  const benchOhlcvW = useMemo(() =>
    data?.benchmark_ohlcv_w?.length > 0 ? data.benchmark_ohlcv_w :
    liveBench.w?.length > 0             ? liveBench.w             : null,
  [data, liveBench]);
  const benchOhlcvD = useMemo(() =>
    data?.benchmark_ohlcv?.length > 0 ? data.benchmark_ohlcv :
    liveBench.d?.length > 0           ? liveBench.d           : null,
  [data, liveBench]);

  // Struktur ALLER Ticker aus vorberechneten Backend-Flags
  const structureMap = useMemo(() => {
    if (!data) return {};
    const map = {};
    data.data.forEach(entry => {
      map[entry.ticker] = {
        weekly: analyzeWeeklyStructure(entry.ohlcv_w) || {},
        daily:  analyzeStructure(entry.ohlcv) || {},
        h4:     analyze4HStructure(entry.ohlcv_4h) || {},
      };
    });
    return map;
  }, [data]);

  // Status-Änderungen tracken (localStorage) → gelber Rand für 7 Tage

  // 4H Chart: immer anzeigen wenn Daten vorhanden
  const show4H = ohlcv4hDisplay && structure4h;

  const selectedRs = rsData.find(d => d.t === selected);
  const top20      = data?.top20 ?? [];

  const sel = {
    background:"#1e293b", border:"1px solid #334155",
    color:"#e2e8f0", borderRadius:6, padding:"4px 8px", fontSize:12, cursor:"pointer"
  };

  if (error) return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#060b14",color:"#f87171",fontFamily:"monospace",flexDirection:"column",gap:8}}>
      <span style={{fontSize:18}}>⚠ Fehler beim Laden</span>
      <span style={{fontSize:12,color:"#475569"}}>{error}</span>
      <span style={{fontSize:11,color:"#334155"}}>Stelle sicher, dass rs_sp500.json im selben Verzeichnis liegt.</span>
    </div>
  );
  if (!data) return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#060b14",color:"#475569",fontFamily:"monospace",flexDirection:"column",gap:8}}>
      <span style={{fontSize:24}}>⟳</span>
      <span style={{fontSize:12}}>Lade rs_sp500.json …</span>
    </div>
  );

  return (
    <div style={{minHeight:"100vh",background:"#060b14",color:"#e2e8f0",fontFamily:"'Inter',system-ui,sans-serif",padding:"16px 12px"}}>



      <div className="desktop-layout">
      <div className="desktop-left">
      {evAverage && (
        <div style={{
          display:"flex", alignItems:"center", gap:6, marginBottom:8,
          padding:"6px 12px", background:"#0f172a", borderRadius:8, border:"1px solid #1e293b",
          fontSize:11, color:"#94a3b8",
        }}>
          <span>Ø EV-Upside ({evAverage.n} Ticker):</span>
          <span style={{fontWeight:700, color: evAverage.avg >= 0 ? "#4ade80" : "#f87171"}}>
            {evAverage.avg>0?"+":""}{Math.round(evAverage.avg)}%
          </span>
        </div>
      )}
      {/* RS-Tabelle */}
      {/* Spalten: # | Ticker | Score | W D 4H (3 Punkte-Spalten eng) | 5T 10T 20T 50T 6M */}
      <div style={{background:"#0f172a",borderRadius:10,border:"1px solid #1e293b",marginBottom:12,overflowX:"auto"}}>
        <div style={{minWidth:480}}>
          {/* Header-Zeile */}
          <div style={{
            display:"grid",
            gridTemplateColumns:"22px 36px 58px 36px 40px 62px 56px 18px 18px 18px repeat(5,1fr) 26px",
            padding:"6px 10px", background:"#1e293b", gap:2,
            fontSize:9, color:"#475569", textTransform:"uppercase", letterSpacing:0.5,
            alignItems:"center"
          }}>
            <span>#</span>
            <span style={{textAlign:"center",color:"#334155"}}>Δ</span>
            <span>Ticker</span>
            <span style={{textAlign:"center"}}>EV</span>
            <span style={{textAlign:"center"}}>Risiko</span>
            <span style={{textAlign:"center"}}>Analyse</span>
            <span>Score</span>
            <span style={{textAlign:"center",color:"#f59e0b"}}>W</span>
            <span style={{textAlign:"center",color:"#ef4444"}}>D</span>
            <span style={{textAlign:"center",color:"#a78bfa"}}>4H</span>
            {WINDOWS.map(w => <span key={w} style={{textAlign:"center"}}>{w}</span>)}
            <span style={{textAlign:"center"}} title="Watchlist">WL</span>
          </div>

          {rows.map(item => {
            const rank       = sorted.indexOf(item);
            const isTop      = rank < 20;
            const _entry     = data.data.find(d=>d.ticker===item.t);
            const hasChart   = !!_entry?.ohlcv?.length;
            const structs    = structureMap[item.t] || {};
            const isBOC      = structs.weekly?.broken && structs.daily?.broken && structs.h4?.broken4h;
            const hasRecent  = structs.weekly?.recentBreakout || structs.daily?.recentBreakout || structs.h4?.recentBreakout;
            const _newSince  = _entry?.new_since;
            const isNew      = !!_newSince && (Date.now() - new Date(_newSince).getTime()) < 7*24*3600*1000;
            const rating     = ratings[item.t.toUpperCase()] || ratings[item.t.replace(/\.[^.]+$/,'').toUpperCase()];
            const showFlame  = isBOC && hasRecent && rating?.verdict === "BUY";
            // Manuelle Analyse überschreibt immer den automatischen Score (nie umgekehrt)
            const evAuto     = evScores[item.t.toUpperCase()] || evScores[item.t.replace(/\.[^.]+$/,'').toUpperCase()];
            const evPct      = rating ? rating.ev_upside_pct : (evAuto?.available ? evAuto.upside_pct : null);
            // Risiko-Staffel (STRATEGIEPLAN Abschnitt 6): max. Verlust je Trade in % des Invests.
            // Manuelle Analyse hat Vorrang; der Auto-EV wirkt nur als Daempfer, nie als Verstaerker.
            const fvDec      = rating?.funnel_veto?.decision;
            const riskPct    = (fvDec === "VETO" || rating?.verdict === "AVOID") ? 0
              : fvDec === "REDUCE" ? 5
              : rating ? ((evPct != null && evPct < -20) ? 5
                : (evPct != null && evPct > 20 && (fvDec === "PASS" || rating.verdict === "BUY")) ? 15 : 10)
              : (evAuto?.available && evAuto.upside_pct < -20) ? 5 : 10;
            const riskTitle  = riskPct === 0 ? "Kein Trade — VETO/AVOID aus der Analyse"
              : riskPct === 5 ? "Halbes Risiko (5% Stop-Budget) — REDUCE bzw. EV < -20%"
              : riskPct === 15 ? "Erhöhtes Risiko-Budget (15%) — PASS/BUY mit asymmetrischem Edge (EV > +20%)"
              : "Normales Risiko — 10% Stop-Budget je Trade";

            return (
              <div key={item.t}
                onClick={() => hasChart && handleSelect(item.t)}
                style={{
                  display:"grid",
                  gridTemplateColumns:"22px 36px 58px 36px 40px 62px 56px 18px 18px 18px repeat(5,1fr) 26px",
                  padding:"6px 10px", gap:2,
                  borderTop:`1px solid ${showFlame?"#ef444422":"#0a0f1e"}`,
                  background: showFlame
                    ? (item.t===selected?"#3a0808":"#160303")
                    : item.t===selected ? "#1a2f4a"
                    : isTop ? (rank%2===0?"#0d1526":"#0a1020") : "#07090f",
                  opacity: 1,
                  alignItems:"center",
                  cursor: hasChart ? "pointer" : "default",
                  borderLeft: showFlame ? "2px solid #ef4444"
                    : item.t===selected ? "2px solid #3b82f6" : "2px solid transparent",
                }}>
                <span style={{fontSize:10,fontWeight:700,color:rank===0?"#ffffff":rank<3?"#94a3b8":"#334155"}}>{rank+1}</span>
                <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",lineHeight:1,gap:1}}>
                  {(() => {
                    const pr = item.pr;
                    const curr = rank + 1;
                    if (pr == null) return null;
                    const delta = pr - curr;
                    if (delta === 0) return <span style={{fontSize:8,color:"#334155"}}>–</span>;
                    const up = delta > 0;
                    const count = Math.min(Math.abs(delta), 3);
                    const color = up ? "#4ade80" : "#f87171";
                    const arrow = up ? "▲" : "▼";
                    return <>
                      <span style={{fontSize:8,color,letterSpacing:-1,lineHeight:1}}>{arrow.repeat(count)}</span>
                      <span style={{fontSize:8,color:"#475569",lineHeight:1}}>{pr}</span>
                    </>;
                  })()}
                </div>
                {/* Ticker-Zelle: Feuer vor dem Namen, kein extra Signal */}
                <span style={{fontWeight:700,fontSize:11,fontFamily:"monospace",
                  color:showFlame?"#fca5a5":rank===0?"#ffffff":isTop?"#f1f5f9":"#475569",
                  display:"flex",alignItems:"center",gap:2}}>
                  {isNew
                    ? <span className={showFlame?"flame-anim":""} style={{fontSize:8,fontWeight:700,color:"#fbbf24",background:"#422006",borderRadius:3,padding:"1px 3px",lineHeight:1.4,letterSpacing:0.5}}>NEU</span>
                    : showFlame && <span className="flame-anim" style={{fontSize:11}}>🔥</span>}
                  {item.t}
                  {hasChart && <span style={{fontSize:8,color:"#334155",marginLeft:2}}>▸</span>}
                </span>
                <span style={{textAlign:"center",fontFamily:"monospace",fontSize:10,fontWeight:700,
                  color: evPct == null ? "#334155" : evPct >= 0 ? "#4ade80" : "#f87171"}}
                  title={evPct == null ? "" : rating
                    ? `EV-Upside (Analyse) ${evPct>0?"+":""}${Math.round(evPct)}%`
                    : `EV-Screening (automatisch, kein LLM) ${evPct>0?"+":""}${Math.round(evPct)}% · nur grobe Orientierung`}>
                  {evPct != null ? `${evPct>0?"+":""}${Math.round(evPct)}%` : "–"}
                </span>
                <span style={{textAlign:"center",fontFamily:"monospace",fontSize:10,fontWeight:700,
                  color: riskPct === 0 ? "#f87171" : riskPct === 5 ? "#f59e0b" : riskPct === 15 ? "#4ade80" : "#94a3b8"}}
                  title={riskTitle}>
                  {riskPct}%
                </span>
                <span style={{display:"flex",alignItems:"center",justifyContent:"center"}}>
                  {rating && (
                    <span onClick={e => { e.stopPropagation(); setRatingModal(item.t); }}
                      title={`Bewertung · ${rating.verdict} · Score ${rating.score}${rating.asymmetric_edge?" · ⚡ Asymm. Edge":""}`}
                      style={{
                        fontSize:11, fontWeight:700, letterSpacing:0.5,
                        padding:"2px 5px", borderRadius:3, cursor:"pointer",
                        userSelect:"none", lineHeight:1.4,
                        color:  rating.verdict==="BUY"  ? "#86c429" : rating.verdict==="HOLD" ? "#f59e0b" : "#f87171",
                        background: rating.verdict==="BUY" ? "#1a2e0a" : rating.verdict==="HOLD" ? "#1a1200" : "#1a0505",
                        border:`1px solid ${rating.verdict==="BUY"?"#639922":rating.verdict==="HOLD"?"#b45309":"#A32D2D"}`,
                      }}>{rating.verdict}</span>
                  )}
                  {rating?.asymmetric_edge && <span style={{color:"#ef4444",fontSize:11,fontWeight:900,marginLeft:2,cursor:"default",lineHeight:1}} title="Kursziel-Luft >20% — Momentum-Einstieg">!</span>}
                </span>
                <span style={{fontFamily:"monospace",fontSize:11,fontWeight:600,color:item.s>0?"#4ade80":"#f87171"}}>
                  {item.s>0?"+":""}{Math.round(item.s)}
                </span>
                {/* W-Breach Punkt */}
                {(() => {
                  const active = structs.weekly?.broken;
                  const changed = structs.weekly?.recentBreakout;
                  return <div style={{display:"flex",justifyContent:"center"}}>
                    <span style={{display:"inline-block",width:7,height:7,borderRadius:"50%",boxSizing:"border-box",
                      background: changed ? "#eab308" : active ? "#4ade80" : "transparent",
                      border: changed ? "1.5px solid #eab308" : active ? "1px solid #22c55e" : "1px solid #1e293b",
                    }}/>
                  </div>;
                })()}
                {/* D-Breach Punkt */}
                {(() => {
                  const active = structs.daily?.broken;
                  const changed = structs.daily?.recentBreakout;
                  return <div style={{display:"flex",justifyContent:"center"}}>
                    <span style={{display:"inline-block",width:7,height:7,borderRadius:"50%",boxSizing:"border-box",
                      background: changed ? "#eab308" : active ? "#4ade80" : "transparent",
                      border: changed ? "1.5px solid #eab308" : active ? "1px solid #22c55e" : "1px solid #1e293b",
                    }}/>
                  </div>;
                })()}
                {/* 4H-Breach Punkt */}
                {(() => {
                  const active = structs.h4?.broken4h;
                  const changed = structs.h4?.recentBreakout;
                  return <div style={{display:"flex",justifyContent:"center"}}>
                    <span style={{display:"inline-block",width:7,height:7,borderRadius:"50%",boxSizing:"border-box",
                      background: changed ? "#eab308" : active ? "#4ade80" : "transparent",
                      border: changed ? "1.5px solid #eab308" : active ? "1px solid #22c55e" : "1px solid #1e293b",
                    }}/>
                  </div>;
                })()}
                {WINDOWS.map(w => (
                  <div key={w} style={{textAlign:"center"}}><Cell v={item.w[w]}/></div>
                ))}
                <WatchButton ticker={item.t}/>
              </div>
            );
          })}

          {/* Toggle Alle / Zurück auf Top 20 */}
          <div style={{textAlign:"center",padding:"8px",borderTop:"1px solid #0a0f1e"}}>
            {showAll ? (
              <button onClick={() => setShowAll(false)}
                style={{background:"none",border:"1px solid #334155",color:"#64748b",borderRadius:6,padding:"4px 14px",fontSize:11,cursor:"pointer"}}>
                ↑ Zurück auf Top 20
              </button>
            ) : sorted.length > 20 ? (
              <button onClick={() => setShowAll(true)}
                style={{background:"none",border:"1px solid #334155",color:"#64748b",borderRadius:6,padding:"4px 14px",fontSize:11,cursor:"pointer"}}>
                Alle {rsData.length} anzeigen ↓
              </button>
            ) : null}
          </div>
        </div>
      </div>

      </div>{/* end desktop-left */}
      <div className="desktop-right" ref={chartRef}>
      {/* Strukturanalyse */}
      <div style={{background:"#0f172a",borderRadius:10,border:"1px solid #1e293b",padding:14,marginBottom:12}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <p style={{margin:0,fontSize:15,fontWeight:800,color:"#f1f5f9",fontFamily:"monospace"}}>{selected ?? "–"}</p>
          {selectedRs && (
            <span style={{fontSize:11,fontFamily:"monospace",color:selectedRs.s>0?"#4ade80":"#f87171"}}>
              RS Score: {selectedRs.s>0?"+":""}{Math.round(selectedRs.s)}
            </span>
          )}
        </div>

        {ohlcv ? (
          <div className="charts-grid">
            {/* Weekly Chart */}
            {ohlcvW && structureW ? (
              <ChartWeekly ohlcvW={ohlcvW} structureW={structureW} chartId={selected+"_w"}
                benchOhlcv={benchOhlcvW} benchLabel={data.benchmark} signals={tickerSignals}/>
            ) : (
              <div style={{background:"#07090f",borderRadius:8,border:"1px solid #1e293b",padding:"12px 16px",color:"#334155",fontSize:11,fontFamily:"monospace"}}>
                Weekly-Daten fehlen – bitte Python-Skript neu ausführen (ohlcv_w)
              </div>
            )}

            {/* Daily Chart */}
            {ohlcvDisplay && structure && (
              <CandleChart ohlcv={ohlcvDisplay} structure={structure} chartId={selected+"_d"}
                benchOhlcv={benchOhlcvD} benchLabel={data.benchmark} signals={tickerSignals}/>
            )}

            {/* 4H Chart – volle Breite */}
            {show4H && (
              <div className="chart-full-width">
                <Chart4H ohlcv4h={ohlcv4hDisplay} structure4h={structure4h} chartId={selected+"_4h"} signals={tickerSignals}/>
              </div>
            )}
          </div>
        ) : (
          <div style={{color:"#475569",fontSize:12,textAlign:"center",padding:"20px 0"}}>
            Klick auf einen Ticker mit ▸ für Strukturanalyse.
          </div>
        )}
      </div>
      </div>{/* end desktop-right */}
      </div>{/* end desktop-layout */}

      <p style={{textAlign:"center",color:"#1e293b",fontSize:9,marginTop:8}}>
        Echte Daten via yfinance · Kein Handelssignal · Stand {data.timestamp}
      </p>

      {ratingModal && (() => {
        const r = ratings[ratingModal.toUpperCase()] || ratings[ratingModal.replace(/\.[^.]+$/,'').toUpperCase()];
        return (
          <div onClick={() => setRatingModal(null)}
            style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.88)",zIndex:1000,display:"flex",alignItems:"flex-start",justifyContent:"center",padding:16,overflowY:"auto"}}>
            <div onClick={e => e.stopPropagation()}
              style={{width:"100%",maxWidth:980,background:"#060b14",borderRadius:10,border:"1px solid #1e2d45",overflow:"hidden",display:"flex",flexDirection:"column",marginTop:8}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 16px",borderBottom:"1px solid #1e2d45",background:"#0d1526"}}>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <span style={{fontSize:13,fontWeight:700,color:"#94a3b8",fontFamily:"monospace"}}>Aktienbewertung · {ratingModal}</span>
                  {r && <span style={{fontSize:11,padding:"2px 8px",borderRadius:4,background: r.verdict==="BUY"?"#1a3a0a":r.verdict==="HOLD"?"#2a1f05":"#3a0a0a",color: r.verdict==="BUY"?"#86c429":r.verdict==="HOLD"?"#f59e0b":"#f87171",border:`1px solid ${r.verdict==="BUY"?"#639922":r.verdict==="HOLD"?"#b45309":"#A32D2D"}`}}>{r.verdict} · Score {r.score}</span>}
                  {r?.created_at && <span style={{fontSize:10,color:"#475569"}}>Erstellt: {new Date(r.created_at).toLocaleDateString('de-DE')}</span>}
                </div>
                <button onClick={() => setRatingModal(null)}
                  style={{background:"transparent",border:"1px solid #1e2d45",color:"#94a3b8",cursor:"pointer",fontSize:13,borderRadius:4,padding:"3px 10px"}}> Schließen</button>
              </div>
              {ratingHtml
                ? <iframe srcdoc={ratingHtml}
                    style={{border:"none",width:"100%",height:"85vh"}} title={`Bewertung ${ratingModal}`}/>
                : <div style={{padding:"32px",textAlign:"center",color:"#64748b",fontFamily:"monospace",fontSize:13}}>
                    Analyse wird geladen…
                  </div>}
            </div>
          </div>
        );
      })()}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
