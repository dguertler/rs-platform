<script>
/* RS Auth */
(function () {
  function getToken() { return localStorage.getItem('rs_token'); }
  function logout() {
    localStorage.removeItem('rs_token');
    localStorage.removeItem('rs_email');
    window.location.href = '/login.html';
  }
  window.rsLogout = logout;
  window.apiFetch = async function (url, opts) {
    opts = opts || {};
    var token = getToken();
    if (!token) { logout(); return new Response('{}', { status: 401 }); }
    var r = await fetch(url, Object.assign({}, opts, {
      headers: Object.assign({}, opts.headers || {}, { 'Authorization': 'Bearer ' + token })
    }));
    if (r.status === 401) { logout(); }
    return r;
  };
  if (!getToken()) { window.location.href = '/login.html'; return; }
  document.addEventListener('DOMContentLoaded', function () {
    var email = localStorage.getItem('rs_email') || '';
    var btn = document.createElement('button');
    btn.textContent = 'Logout' + (email ? ' · ' + email : '');
    btn.style.cssText = 'position:fixed;bottom:10px;right:10px;background:#1e293b;border:1px solid #334155;color:#94a3b8;font-size:11px;padding:4px 10px;border-radius:4px;cursor:pointer;z-index:9999;font-family:monospace';
    btn.onclick = function () { window.rsLogout(); };
    document.body.appendChild(btn);
  });
})()
</script>

<script type="text/babel">
const { useState, useMemo, useRef, useCallback, useEffect } = React;

// ── GWS-D Analyse ─────────────────────────────────────────────────────────────
function analyzeStructure(ohlcv) {
  if (!ohlcv || ohlcv.length < 10) return null;
  const n      = ohlcv.length;
  const highs  = ohlcv.map(d => d.h);
  const lows   = ohlcv.map(d => d.l);
  const closes = ohlcv.map(d => d.c);
  const swingHighs = [];
  for (let i = 2; i < n - 2; i++) {
    if (highs[i] >= highs[i-1] && highs[i] >= highs[i-2] &&
        highs[i] >= highs[i+1] && highs[i] >= highs[i+2])
      swingHighs.push({ idx: i, date: ohlcv[i].d, price: highs[i] });
  }
  const swingLows = [];
  for (let i = 2; i < n - 2; i++) {
    if (lows[i] <= lows[i-1] && lows[i] <= lows[i-2] &&
        lows[i] <= lows[i+1] && lows[i] <= lows[i+2])
      swingLows.push({ idx: i, date: ohlcv[i].d, price: lows[i] });
  }
  const gwsdCandidates = [];
  for (let j = 1; j < swingLows.length; j++) {
    const tiefNeu = swingLows[j];
    const tiefAlt = swingLows[j - 1];
    if (tiefNeu.price < tiefAlt.price) {
      const hochsDazwischen = swingHighs.filter(sh => sh.idx > tiefAlt.idx && sh.idx < tiefNeu.idx);
      if (hochsDazwischen.length > 0) {
        const gwsdHoch = hochsDazwischen.reduce((best, h) => h.price > best.price ? h : best);
        gwsdCandidates.push({ idx: gwsdHoch.idx, date: gwsdHoch.date, price: gwsdHoch.price, tiefAlt, tiefNeu });
      }
    }
  }
  const gwsdHigh     = gwsdCandidates.length > 0 ? gwsdCandidates[gwsdCandidates.length - 1] : null;
  const prevGwsdHigh = gwsdCandidates.length > 1 ? gwsdCandidates[gwsdCandidates.length - 2] : null;
  const breakoutPrice = gwsdHigh ? gwsdHigh.price : null;
  let breakoutIdx = null;
  if (gwsdHigh) { for (let i = gwsdHigh.idx + 1; i < n; i++) { if (closes[i] > gwsdHigh.price) { breakoutIdx = i; break; } } }
  let prevBreakoutIdx = null;
  if (prevGwsdHigh) { for (let i = prevGwsdHigh.idx + 1; i < n; i++) { if (closes[i] > prevGwsdHigh.price) { prevBreakoutIdx = i; break; } } }
  let trend = "neutral";
  if (swingHighs.length >= 2) {
    const last = swingHighs[swingHighs.length - 1];
    const prev = swingHighs[swingHighs.length - 2];
    if (last.price > prev.price) trend = "bullish";
    else if (last.price < prev.price) trend = "bearish";
  }
  const broken = breakoutIdx !== null || (gwsdHigh === null && trend === "bullish");
  const currentClose = closes[n - 1];
  const recentBreakout = broken && (n - 1 - breakoutIdx <= 7);
  return {
    currentClose, gwsdHigh, breakoutIdx, breakoutPrice, broken, trend,
    prevGwsdHigh, prevBreakoutIdx, recentBreakout,
    swingHighs: swingHighs.slice(-6), swingLows: swingLows.slice(-6),
    setup: broken && trend !== "bearish",
  };
}

// ── GWS-W Analyse ─────────────────────────────────────────────────────────────
function analyzeWeeklyStructure(ohlcvW) {
  if (!ohlcvW || ohlcvW.length < 8) return null;
  const n      = ohlcvW.length;
  const highs  = ohlcvW.map(d => d.h);
  const lows   = ohlcvW.map(d => d.l);
  const closes = ohlcvW.map(d => d.c);
  const swingHighs = [];
  for (let i = 1; i < n - 1; i++) {
    if (highs[i] >= highs[i-1] && highs[i] >= highs[i+1])
      swingHighs.push({ idx: i, date: ohlcvW[i].d, price: highs[i] });
  }
  const swingLows = [];
  for (let i = 1; i < n - 1; i++) {
    if (lows[i] <= lows[i-1] && lows[i] <= lows[i+1])
      swingLows.push({ idx: i, date: ohlcvW[i].d, price: lows[i] });
  }
  const gwswCandidates = [];
  for (let j = 1; j < swingLows.length; j++) {
    const tiefNeu = swingLows[j];
    const tiefAlt = swingLows[j - 1];
    if (tiefNeu.price < tiefAlt.price) {
      const hochsDazwischen = swingHighs.filter(sh => sh.idx > tiefAlt.idx && sh.idx < tiefNeu.idx);
      if (hochsDazwischen.length > 0) {
        const gwswHoch = hochsDazwischen.reduce((best, h) => h.price > best.price ? h : best);
        gwswCandidates.push({ idx: gwswHoch.idx, date: gwswHoch.date, price: gwswHoch.price });
      }
    }
  }
  const gwswHigh     = gwswCandidates.length > 0 ? gwswCandidates[gwswCandidates.length - 1] : null;
  const prevGwswHigh = gwswCandidates.length > 1 ? gwswCandidates[gwswCandidates.length - 2] : null;
  let breakoutPrice = gwswHigh ? gwswHigh.price : null;
  let breakoutIdx = null;
  if (gwswHigh) { for (let i = gwswHigh.idx + 1; i < n; i++) { if (closes[i] > gwswHigh.price) { breakoutIdx = i; break; } } }
  let prevBreakoutIdx = null;
  if (prevGwswHigh) { for (let i = prevGwswHigh.idx + 1; i < n; i++) { if (closes[i] > prevGwswHigh.price) { prevBreakoutIdx = i; break; } } }
  let trend = "neutral";
  if (swingHighs.length >= 2) {
    const last = swingHighs[swingHighs.length - 1];
    const prev = swingHighs[swingHighs.length - 2];
    if (last.price > prev.price) trend = "bullish";
    else if (last.price < prev.price) trend = "bearish";
  }
  const broken = breakoutIdx !== null || (gwswHigh === null && trend === "bullish");
  const recentBreakout = breakoutIdx !== null && (n - 1 - breakoutIdx <= 1);
  return {
    gwswHigh, breakoutIdx, breakoutPrice, broken,
    prevGwswHigh, prevBreakoutIdx, recentBreakout,
    swingHighs: swingHighs.slice(-6), swingLows: swingLows.slice(-6),
  };
}

// ── GWS-4H Analyse ────────────────────────────────────────────────────────────
function analyze4HStructure(ohlcv4h) {
  if (!ohlcv4h || ohlcv4h.length < 8) return null;
  const n     = ohlcv4h.length;
  const highs = ohlcv4h.map(d => d.h);
  const lows  = ohlcv4h.map(d => d.l);
  const closes= ohlcv4h.map(d => d.c);
  const swingHighs = [];
  for (let i = 2; i < n - 2; i++) {
    if (highs[i] >= highs[i-1] && highs[i] >= highs[i-2] && highs[i] >= highs[i+1] && highs[i] >= highs[i+2])
      swingHighs.push({ idx: i, date: ohlcv4h[i].d, price: highs[i] });
  }
  const swingLows = [];
  for (let i = 2; i < n - 2; i++) {
    if (lows[i] <= lows[i-1] && lows[i] <= lows[i-2] && lows[i] <= lows[i+1] && lows[i] <= lows[i+2])
      swingLows.push({ idx: i, date: ohlcv4h[i].d, price: lows[i] });
  }
  const gws4hCandidates = [];
  for (let j = 1; j < swingLows.length; j++) {
    const tiefNeu = swingLows[j];
    const tiefAlt = swingLows[j - 1];
    if (tiefNeu.price < tiefAlt.price) {
      const hochsDazwischen = swingHighs.filter(sh => sh.idx > tiefAlt.idx && sh.idx < tiefNeu.idx);
      if (hochsDazwischen.length > 0) {
        const gws4hHoch = hochsDazwischen.reduce((best, h) => h.price > best.price ? h : best);
        gws4hCandidates.push({ idx: gws4hHoch.idx, date: gws4hHoch.date, price: gws4hHoch.price });
      }
    }
  }
  const gws4hHigh     = gws4hCandidates.length > 0 ? gws4hCandidates[gws4hCandidates.length - 1] : null;
  const prevGws4hHigh = gws4hCandidates.length > 1 ? gws4hCandidates[gws4hCandidates.length - 2] : null;
  let breakout4hIdx = null;
  if (gws4hHigh) { for (let i = gws4hHigh.idx + 1; i < n; i++) { if (closes[i] > gws4hHigh.price) { breakout4hIdx = i; break; } } }
  let prevBreakout4hIdx = null;
  if (prevGws4hHigh) { for (let i = prevGws4hHigh.idx + 1; i < n; i++) { if (closes[i] > prevGws4hHigh.price) { prevBreakout4hIdx = i; break; } } }
  let trend4h = "neutral";
  if (swingHighs.length >= 2) {
    const last4h = swingHighs[swingHighs.length - 1];
    const prev4h = swingHighs[swingHighs.length - 2];
    if (last4h.price > prev4h.price) trend4h = "bullish";
    else if (last4h.price < prev4h.price) trend4h = "bearish";
  }
  const recentBreakout = breakout4hIdx !== null && (() => {
    const breakoutDate = new Date(ohlcv4h[breakout4hIdx].d.replace(' ', 'T'));
    const lastDate     = new Date(ohlcv4h[n - 1].d.replace(' ', 'T'));
    return (lastDate - breakoutDate) / (1000 * 60 * 60 * 24) <= 7;
  })();
  return {
    gws4hHigh, breakout4hIdx, broken4h: breakout4hIdx !== null || (gws4hHigh === null && trend4h === "bullish"),
    prevGws4hHigh, prevBreakout4hIdx, recentBreakout,
    swingHighs: swingHighs.slice(-8), swingLows: swingLows.slice(-8),
  };
}

// ── Weekly Chart ──────────────────────────────────────────────────────────────
function ChartWeekly({ ohlcvW, structureW, chartId, benchOhlcv, benchLabel, signals = [] }) {
  const svgRef = useRef(null);
  const [hover, setHover] = useState(null);
  const W = 600, H = 260;
  const PL = 56, PR = 52, PT = 18, PB = 32;
  const cW = W - PL - PR, cH = H - PT - PB;
  const n = ohlcvW.length;
  const allH = ohlcvW.map(d => d.h), allL = ohlcvW.map(d => d.l);
  const rawMax = Math.max(...allH), rawMin = Math.min(...allL);
  const pad = (rawMax - rawMin) * 0.07;
  const maxP = rawMax + pad, minP = rawMin - pad, range = maxP - minP;
  const toY = p => PT + (1 - (p - minP) / range) * cH;
  const toX = i => PL + (i + 0.5) * (cW / n);
  const bW  = Math.max(2, cW / n * 0.65);
  const yTicks = [];
  for (let k = 0; k <= 5; k++) yTicks.push(minP + k * range / 5);
  const monthLabels = [];
  let lastMonth = null;
  ohlcvW.forEach((d, i) => {
    const m = d.d.slice(0, 7);
    if (m !== lastMonth) { monthLabels.push({ i, label: d.d.slice(5,7)+"/"+d.d.slice(2,4) }); lastMonth = m; }
  });
  const { gwswHigh, breakoutIdx, breakoutPrice, broken, prevGwswHigh, prevBreakoutIdx } = structureW || {};
  const benchLine = useMemo(() => {
    if (!benchOhlcv || !ohlcvW.length) return [];
    const benchMap = {};
    benchOhlcv.forEach(d => { benchMap[d.d] = d.c; });
    let stockRef = null, benchRef = null;
    for (const d of ohlcvW) { if (benchMap[d.d] != null) { stockRef = d.c; benchRef = benchMap[d.d]; break; } }
    if (!stockRef || !benchRef) return [];
    return ohlcvW.map((d, i) => { const bc = benchMap[d.d]; return bc != null ? { i, price: stockRef * (bc / benchRef) } : null; }).filter(Boolean);
  }, [benchOhlcv, ohlcvW]);
  const gwswColor  = "#f59e0b";
  const gwswLineEnd = breakoutIdx !== null ? breakoutIdx : n - 1;
  const handleMouseMove = useCallback((e) => {
    const svg = svgRef.current; if (!svg) return;
    const rect = svg.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (W / rect.width);
    const idx = Math.round((mx - PL) / (cW / n) - 0.5);
    setHover(idx >= 0 && idx < n ? idx : null);
  }, [n, cW]);
  const hd = hover !== null ? ohlcvW[hover] : null;
  return (
    <div className="chart-wrap" style={{background:"#07090f",borderRadius:8,border:"1px solid #1e293b",overflow:"hidden"}}>
      <div style={{height:28,padding:"0 12px",display:"flex",alignItems:"center",gap:14,background:"#0a0f1e",borderBottom:"1px solid #1e293b",fontSize:10,fontFamily:"monospace"}}>
        {hd ? <>
          <span style={{color:"#475569"}}>{hd.d}</span>
          <span>O <span style={{color:"#e2e8f0"}}>{hd.o.toFixed(2)}</span></span>
          <span>H <span style={{color:"#4ade80"}}>{hd.h.toFixed(2)}</span></span>
          <span>L <span style={{color:"#f87171"}}>{hd.l.toFixed(2)}</span></span>
          <span>C <span style={{color:hd.c>=hd.o?"#4ade80":"#f87171",fontWeight:700}}>{hd.c.toFixed(2)}</span></span>
          <span style={{color:"#475569",marginLeft:"auto"}}>{hd.c>=hd.o?"▲":"▼"} {((hd.c-hd.o)/hd.o*100).toFixed(2)}%</span>
        </> : <span style={{color:"#334155"}}>Hover für Weekly-Details</span>}
      </div>
      <svg ref={svgRef} width="100%" viewBox={`0 0 ${W} ${H}`} onMouseMove={handleMouseMove} onMouseLeave={()=>setHover(null)} style={{cursor:"crosshair"}}>
        <defs>
          <linearGradient id={`bgW_${chartId}`} x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#22c55e" stopOpacity="0.10"/>
            <stop offset="100%" stopColor="#22c55e" stopOpacity="0.01"/>
          </linearGradient>
          <clipPath id={`clipW_${chartId}`}><rect x={PL} y={PT} width={cW} height={cH}/></clipPath>
        </defs>
        <rect x={PL} y={PT} width={cW} height={cH} fill="#07090f"/>
        {yTicks.map((val, k) => { const y = toY(val); return <g key={k}><line x1={PL} x2={PL+cW} y1={y} y2={y} stroke="#1a2235" strokeWidth="0.8"/><text x={PL-5} y={y+3.5} textAnchor="end" fill="#334155" fontSize="9" fontFamily="monospace">{val.toFixed(0)}</text></g>; })}
        {monthLabels.map(({i, label}) => (<g key={i}><line x1={toX(i)} x2={toX(i)} y1={PT} y2={PT+cH} stroke="#7dd3fc" strokeWidth="0.7" strokeDasharray="2,4" opacity="0.25"/><text x={toX(i)} y={PT+cH+14} textAnchor="middle" fill="#334155" fontSize="8.5" fontFamily="monospace">{label}</text></g>))}
        {breakoutIdx !== null && (<rect x={toX(breakoutIdx)} y={PT} width={PL+cW-toX(breakoutIdx)} height={cH} fill={`url(#bgW_${chartId})`}/>)}
        {benchLine.length > 1 && (<polyline points={benchLine.map(({i, price}) => `${toX(i)},${toY(price)}`).join(' ')} fill="none" stroke="#64748b" strokeWidth="1.2" opacity="0.55" clipPath={`url(#clipW_${chartId})`}/>)}
        {prevGwswHigh && (() => { const prevLineEnd = prevBreakoutIdx !== null ? prevBreakoutIdx : (gwswHigh ? gwswHigh.idx : n - 1); const y=toY(prevGwswHigh.price); const x1=toX(prevGwswHigh.idx); const x2=toX(prevLineEnd); return <line x1={x1} x2={x2} y1={y} y2={y} stroke={gwswColor} strokeWidth="1.2" strokeDasharray="4,4" opacity="0.30"/>; })()}
        {gwswHigh && (() => { const y=toY(breakoutPrice??gwswHigh.price); const x1=toX(gwswHigh.idx); const x2=toX(gwswLineEnd); return <line x1={x1} x2={x2} y1={y} y2={y} stroke={gwswColor} strokeWidth="1.8" strokeDasharray="5,4"/>; })()}
        {broken && !gwswHigh && structureW?.swingHighs?.length >= 2 && (() => { const lastSH=structureW.swingHighs[structureW.swingHighs.length-1]; const y=toY(lastSH.price); return <><line x1={PL} x2={PL+cW} y1={y} y2={y} stroke="#4ade80" strokeWidth="1.2" strokeDasharray="3,6" opacity="0.7"/><text x={PL+6} y={y-4} fill="#4ade80" fontSize="8" fontFamily="monospace" opacity="0.8">Trend ↑</text></>; })()}

// ── Daily Chart ───────────────────────────────────────────────────────────────
function CandleChart({ ohlcv, structure, chartId, benchOhlcv, benchLabel, signals = [] }) {
  const svgRef = useRef(null);
  const [hover, setHover] = useState(null);
  const W = 600, H = 270;

  const rawMax = Math.max(...allH), rawMin = Math.min(...allL);
  const pad = (rawMax - rawMin) * 0.07;
  const maxP = rawMax + pad, minP = rawMin - pad, range = maxP - minP;
  const toY = p => PT + (1 - (p - minP) / range) * cH;
  const toX = i => PL + (i + 0.5) * (cW / n);
  const bW  = Math.max(2, cW / n * 0.65);
  const yTicks = [];
  for (let k = 0; k <= 5; k++) yTicks.push(minP + k * range / 5);
  const monthLabels = [];
  let lastMonthD = null;
  ohlcv.forEach((d, i) => { const m=d.d.slice(0,7); if (m!==lastMonthD) { monthLabels.push({i,label:d.d.slice(5,7)+"/"+d.d.slice(2,4)}); lastMonthD=m; } });
  const { gwsdHigh, breakoutIdx, breakoutPrice, broken, prevGwsdHigh, prevBreakoutIdx } = structure || {};
  const benchLine = useMemo(() => {
    if (!benchOhlcv || !ohlcv.length) return [];
    const benchMap = {};
    benchOhlcv.forEach(d => { benchMap[d.d] = d.c; });
    let stockRef = null, benchRef = null;
    for (const d of ohlcv) { if (benchMap[d.d] != null) { stockRef = d.c; benchRef = benchMap[d.d]; break; } }
    if (!stockRef || !benchRef) return [];
    return ohlcv.map((d, i) => { const bc = benchMap[d.d]; return bc != null ? { i, price: stockRef * (bc / benchRef) } : null; }).filter(Boolean);
  }, [benchOhlcv, ohlcv]);
  const gwsdColor   = "#ef4444";
  const gwsdLineEnd = breakoutIdx !== null ? breakoutIdx : n - 1;
  const handleMouseMove = useCallback((e) => {

          <span>C <span style={{color:hd.c>=hd.o?"#4ade80":"#f87171",fontWeight:700}}>{hd.c.toFixed(2)}</span></span>

        </> : <span style={{color:"#334155"}}>Hover für Daily-Details</span>}
      </div>
      <svg ref={svgRef} width="100%" viewBox={`0 0 ${W} ${H}`} onMouseMove={handleMouseMove} onMouseLeave={()=>setHover(null)} style={{cursor:"crosshair"}}>
        <defs>
          <linearGradient id={`bg_${chartId}`} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#22c55e" stopOpacity="0.12"/><stop offset="100%" stopColor="#22c55e" stopOpacity="0.01"/></linearGradient>
          <clipPath id={`clipD_${chartId}`}><rect x={PL} y={PT} width={cW} height={cH}/></clipPath>
        </defs>
        <rect x={PL} y={PT} width={cW} height={cH} fill="#07090f"/>
        {yTicks.map((val, k) => { const y=toY(val); return <g key={k}><line x1={PL} x2={PL+cW} y1={y} y2={y} stroke="#1a2235" strokeWidth="0.8"/><text x={PL-5} y={y+3.5} textAnchor="end" fill="#334155" fontSize="9" fontFamily="monospace">{val.toFixed(0)}</text></g>; })}
        {monthLabels.map(({i, label}) => (<g key={i}><line x1={toX(i)} x2={toX(i)} y1={PT} y2={PT+cH} stroke="#7dd3fc" strokeWidth="0.7" strokeDasharray="2,4" opacity="0.25"/><text x={toX(i)} y={PT+cH+14} textAnchor="middle" fill="#334155" fontSize="8.5" fontFamily="monospace">{label}</text></g>))}
        {breakoutIdx !== null && (<rect x={toX(breakoutIdx)} y={PT} width={PL+cW-toX(breakoutIdx)} height={cH} fill={`url(#bg_${chartId})`}/>)}
        {benchLine.length > 1 && (<polyline points={benchLine.map(({i,price})=>`${toX(i)},${toY(price)}`).join(' ')} fill="none" stroke="#64748b" strokeWidth="1.2" opacity="0.55" clipPath={`url(#clipD_${chartId})`}/>)}
        {prevGwsdHigh && (() => { const prevLineEnd=prevBreakoutIdx!==null?prevBreakoutIdx:(gwsdHigh?gwsdHigh.idx:n-1); const y=toY(prevGwsdHigh.price); const x1=toX(prevGwsdHigh.idx); const x2=toX(prevLineEnd); return <line x1={x1} x2={x2} y1={y} y2={y} stroke="#ef4444" strokeWidth="1.2" strokeDasharray="4,4" opacity="0.35"/>; })()}

        {broken && !gwsdHigh && structure?.swingHighs?.length >= 2 && (() => { const lastSH=structure.swingHighs[structure.swingHighs.length-1]; const y=toY(lastSH.price); return <><line x1={PL} x2={PL+cW} y1={y} y2={y} stroke="#4ade80" strokeWidth="1.2" strokeDasharray="3,6" opacity="0.7"/><text x={PL+6} y={y-4} fill="#4ade80" fontSize="8" fontFamily="monospace" opacity="0.8">Trend ↑</text></>; })()}
        {ohlcv.map((d, i) => { const bull=d.c>=d.o; const isBoc=i===breakoutIdx; const col=bull?"#22c55e":"#ef4444"; const bTop=toY(Math.max(d.o,d.c)); const bH=Math.max(1.5,toY(Math.min(d.o,d.c))-bTop); const isHov=hover===i; return <g key={i}><line x1={toX(i)} x2={toX(i)} y1={toY(d.h)} y2={toY(d.l)} stroke={col} strokeWidth={isHov?1.5:1} opacity={0.9}/><rect x={toX(i)-bW/2} y={bTop} width={bW} height={bH} fill={col} opacity={isBoc?1:isHov?0.95:0.8} stroke={isBoc?"#ef4444":"none"} strokeWidth={isBoc?1.2:0}/></g>; })}
        {signals.filter(s => s.daily_bar_date).map((sig, si) => { const idx=ohlcv.findIndex(d => d.d.slice(0,10)===sig.daily_bar_date.slice(0,10)); if (idx<0) return null; const x=toX(idx); const yTip=Math.min(toY(ohlcv[idx].l)+4,PT+cH-28); const lbl=[sig.weekly_bar_date&&'W',sig.daily_bar_date&&'D',sig.h4_bar_date&&'4H'].filter(Boolean).join('/'); return <g key={si}><rect x={x-6} y={yTip-2} width={12} height={22} rx={2} fill="#eab308" opacity={0.2}/><polygon points={`${x-4},${yTip+8} ${x+4},${yTip+8} ${x},${yTip}`} fill="#eab308" opacity="0.95"/><line x1={x} x2={x} y1={yTip+8} y2={yTip+18} stroke="#eab308" strokeWidth="1.5" opacity="0.95"/><text x={x} y={yTip+28} textAnchor="middle" fill="#eab308" fontSize="7" fontFamily="monospace" opacity="0.9">{lbl}</text></g>; })}
        <line x1={PL} x2={PL+cW} y1={toY(ohlcv[n-1].c)} y2={toY(ohlcv[n-1].c)} stroke="#7dd3fc" strokeWidth="0.7" strokeDasharray="2,3" opacity="0.45"/>
        <rect x={PL+cW+2} y={toY(ohlcv[n-1].c)-8} width={46} height={15} rx="3" fill="#1e293b"/>
        <text x={PL+cW+25} y={toY(ohlcv[n-1].c)+3} textAnchor="middle" fill="#94a3b8" fontSize="8.5" fontFamily="monospace">{ohlcv[n-1].c.toFixed(2)}</text>
        {hover !== null && <><line x1={toX(hover)} x2={toX(hover)} y1={PT} y2={PT+cH} stroke="#7dd3fc" strokeWidth="0.7" strokeDasharray="2,3" opacity="0.5"/><line x1={PL} x2={PL+cW} y1={toY(ohlcv[hover].c)} y2={toY(ohlcv[hover].c)} stroke="#7dd3fc" strokeWidth="0.7" strokeDasharray="2,3" opacity="0.5"/><rect x={PL-52} y={toY(ohlcv[hover].c)-8} width={48} height={15} rx="3" fill="#1e293b"/><text x={PL-28} y={toY(ohlcv[hover].c)+3} textAnchor="middle" fill="#94a3b8" fontSize="8.5" fontFamily="monospace">{ohlcv[hover].c.toFixed(2)}</text></>}
        <rect x={PL} y={PT} width={cW} height={cH} fill="none" stroke="#1e293b" strokeWidth="0.8"/>

        {signals.filter(s => s.h4_bar_date).map((sig, si) => { const idx=display4h.findIndex(d => d.d.slice(0,16)===sig.h4_bar_date.slice(0,16)); if (idx<0) return null; const x=toX(idx); const yTip=Math.min(toY(display4h[idx].l)+4,PT+cH-20); return <g key={si}><rect x={x-6} y={yTip-2} width={12} height={22} rx={2} fill="#eab308" opacity={0.2}/><polygon points={`${x-4},${yTip+8} ${x+4},${yTip+8} ${x},${yTip}`} fill="#eab308" opacity="0.95"/><line x1={x} x2={x} y1={yTip+8} y2={yTip+18} stroke="#eab308" strokeWidth="1.5" opacity="0.95"/></g>; })}
        <line x1={PL} x2={PL+cW} y1={toY(display4h[n-1].c)} y2={toY(display4h[n-1].c)} stroke="#7dd3fc" strokeWidth="0.7" strokeDasharray="2,3" opacity="0.45"/>
        <rect x={PL+cW+2} y={toY(display4h[n-1].c)-8} width={46} height={15} rx="3" fill="#1e293b"/>
        <text x={PL+cW+25} y={toY(display4h[n-1].c)+3} textAnchor="middle" fill="#94a3b8" fontSize="8.5" fontFamily="monospace">{display4h[n-1].c.toFixed(2)}</text>
        {hover !== null && <><line x1={toX(hover)} x2={toX(hover)} y1={PT} y2={PT+cH} stroke="#7dd3fc" strokeWidth="0.7" strokeDasharray="2,3" opacity="0.5"/><line x1={PL} x2={PL+cW} y1={toY(display4h[hover].c)} y2={toY(display4h[hover].c)} stroke="#7dd3fc" strokeWidth="0.7" strokeDasharray="2,3" opacity="0.5"/></>}
        <rect x={PL} y={PT} width={cW} height={cH} fill="none" stroke="#1e293b" strokeWidth="0.8"/>
      </svg>
      <div style={{padding:"5px 12px",display:"flex",gap:14,alignItems:"center",background:"#0a0f1e",borderTop:"1px solid #0f172a",flexWrap:"wrap"}}>
        <div style={{display:"flex",alignItems:"center",gap:4}}><svg width="20" height="8"><line x1="0" y1="4" x2="20" y2="4" stroke="#a78bfa" strokeWidth="1.8" strokeDasharray="4,3"/></svg><span style={{fontSize:9,color:"#64748b"}}>GWS-4H</span></div>
        <div style={{marginLeft:"auto",fontSize:9,color:"#334155",fontFamily:"monospace"}}>{n} Kerzen · 4H</div>
      </div>
    </div>
  );
}

// ── Helpers ───────────────────────────────────────────────────────────────────
async function fetchYFChart(ticker, interval, range) {
  try {
    const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(ticker)}?interval=${interval}&range=${range}&events=history`;
    const r = await fetch(url, { headers: { 'Accept': 'application/json' } });
    if (r.ok) {
      const j = await r.json();
      const res = j?.chart?.result?.[0];
      if (res) {
        const ts = res.timestamp || [];
        const q  = res.indicators?.quote?.[0] || {};
        const { open:o=[], high:h=[], low:l=[], close:c=[] } = q;
        const result = [];
        for (let i = 0; i < ts.length; i++) {
          if (c[i] == null) continue;
          const d = new Date(ts[i]*1000).toISOString().slice(0,10);
          result.push({ d, o:+o[i].toFixed(2), h:+h[i].toFixed(2), l:+l[i].toFixed(2), c:+c[i].toFixed(2) });
        }
        if (result.length > 0) return result;
      }
    }
  } catch {}
  try {
    const stooqSym = ticker === "QQQ" ? "QQQ.US" : encodeURIComponent(ticker);
    const si = interval === "1wk" ? "w" : "d";
    const url2 = `https://stooq.com/q/d/l/?s=${stooqSym}&i=${si}`;
    const r2 = await fetch(url2);
    if (r2.ok) {
      const text = await r2.text();
      const lines = text.trim().split('\n');
      const result = [];
      for (let i = 1; i < lines.length; i++) {
        const [d, o, h, l, c] = lines[i].split(',');
        if (!c || c === 'null' || isNaN(+c)) continue;
        result.push({ d, o:+o, h:+h, l:+l, c:+c });
      }
      result.reverse();
      if (result.length > 0) return result;
    }
  } catch {}
  return [];
}

// ── Watchlist App ─────────────────────────────────────────────────────────────
function WatchlistApp() {
  const [items,       setItems]       = useState(null);
  const [loading,     setLoading]     = useState(true);
  const [error,       setError]       = useState(null);
  const [selected,    setSelected]    = useState(null);
  const [addInput,    setAddInput]    = useState("");
  const [addLoading,  setAddLoading]  = useState(false);
  const [addError,    setAddError]    = useState(null);
  const [expandedNews, setExpandedNews] = useState(new Set());
  const [newsData,    setNewsData]    = useState({});
  const [newsLoading, setNewsLoading] = useState({});
  const [signals,     setSignals]     = useState({});
  const [liveBench,   setLiveBench]   = useState({ w: null, d: null });
  const chartRef = useRef(null);

  const loadWatchlist = useCallback(async () => {
    setLoading(true);
    setError(null);
    try {
      const r = await apiFetch("/api/watchlist");
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const json = await r.json();
      setItems(json.items || []);
      const first = (json.items || []).find(it => it.ohlcv?.length > 0);
      if (first && !selected) setSelected(first.ticker);
    } catch(e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => { loadWatchlist(); }, [loadWatchlist]);

  useEffect(() => {
    apiFetch("/api/signals")
      .then(r => r.ok ? r.json() : {})
      .then(json => setSignals(json))
      .catch(() => {});
  }, []);

  useEffect(() => {
    Promise.all([
      fetchYFChart("QQQ", "1wk", "60wk"),
      fetchYFChart("QQQ", "1d",  "3mo"),
    ]).then(([w, d]) => {
      if (w.length > 0 || d.length > 0) setLiveBench({ w, d });
    });
  }, []);

  const handleSelect = useCallback((ticker) => {
    setSelected(ticker);
    setTimeout(() => chartRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
  }, []);

  const handleAdd = async (e) => {
    e.preventDefault();
    const ticker = addInput.trim().toUpperCase();
    if (!ticker) return;
    setAddLoading(true);
    setAddError(null);
    try {
      const r = await apiFetch("/api/watchlist", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ticker }),
      });
      const json = await r.json();
      if (!r.ok) { setAddError(json.detail || "Fehler"); return; }
      setAddInput("");
      await loadWatchlist();
    } catch(e) {
      setAddError("Netzwerkfehler");
    } finally {
      setAddLoading(false);
    }
  };

  const handleRemove = async (ticker) => {
    try {
      await apiFetch(`/api/watchlist/${encodeURIComponent(ticker)}`, { method: "DELETE" });
      setItems(prev => (prev || []).filter(it => it.ticker !== ticker));
      if (selected === ticker) setSelected(null);
      setExpandedNews(prev => { const n = new Set(prev); n.delete(ticker); return n; });
    } catch {}
  };

  const toggleNews = async (ticker) => {
    const newExpanded = new Set(expandedNews);
    if (newExpanded.has(ticker)) {
      newExpanded.delete(ticker);
      setExpandedNews(newExpanded);
      return;
    }
    newExpanded.add(ticker);
    setExpandedNews(newExpanded);
    if (!newsData[ticker]) {
      setNewsLoading(prev => ({ ...prev, [ticker]: true }));
      try {
        const r = await apiFetch(`/api/watchlist/news/${encodeURIComponent(ticker)}`);
        const json = r.ok ? await r.json() : null;
        setNewsData(prev => ({ ...prev, [ticker]: json }));
      } catch {
        setNewsData(prev => ({ ...prev, [ticker]: null }));
      } finally {
        setNewsLoading(prev => ({ ...prev, [ticker]: false }));
      }
    }
  };

  // Compute structure for selected ticker
  const selectedItem = useMemo(() => (items || []).find(it => it.ticker === selected), [items, selected]);

  const ohlcvW = useMemo(() => selectedItem?.ohlcv_w?.length > 0 ? selectedItem.ohlcv_w : null, [selectedItem]);
  const ohlcv  = useMemo(() => selectedItem?.ohlcv?.length  > 0 ? selectedItem.ohlcv  : null, [selectedItem]);
  const ohlcv4h= useMemo(() => selectedItem?.ohlcv_4h?.length > 0 ? selectedItem.ohlcv_4h : null, [selectedItem]);

  const structureW  = useMemo(() => analyzeWeeklyStructure(ohlcvW), [ohlcvW]);
  const nCandles    = ohlcvW?.length ?? 60;
  const ohlcvDisplay   = useMemo(() => ohlcv?.slice(-nCandles)   ?? null, [ohlcv, nCandles]);
  const ohlcv4hDisplay = useMemo(() => ohlcv4h?.slice(-nCandles) ?? null, [ohlcv4h, nCandles]);
  const structure    = useMemo(() => analyzeStructure(ohlcvDisplay),    [ohlcvDisplay]);
  const structure4h  = useMemo(() => analyze4HStructure(ohlcv4hDisplay), [ohlcv4hDisplay]);
  const show4H       = ohlcv4hDisplay && structure4h;

  const tickerSignals = useMemo(() => (selected && signals[selected]) ? signals[selected] : [], [signals, selected]);

  const benchOhlcvW = useMemo(() =>
    selectedItem?.benchmark_ohlcv_w?.length > 0 ? selectedItem.benchmark_ohlcv_w : liveBench.w ?? null,
  [selectedItem, liveBench]);
  const benchOhlcvD = useMemo(() =>
    selectedItem?.benchmark_ohlcv?.length > 0 ? selectedItem.benchmark_ohlcv : liveBench.d ?? null,
  [selectedItem, liveBench]);
  const benchLabel  = selectedItem?.benchmark ?? "QQQ";

  // Structure for all items (for breach dots in table)
  const structureMap = useMemo(() => {
    if (!items) return {};
    const map = {};
    items.forEach(entry => {
      const d = map[entry.ticker] = {};
      if (entry.ohlcv?.length > 0)    d.daily  = analyzeStructure(entry.ohlcv);
      if (entry.ohlcv_w?.length > 0)  d.weekly = analyzeWeeklyStructure(entry.ohlcv_w);
      if (entry.ohlcv_4h?.length > 0) d.h4     = analyze4HStructure(entry.ohlcv_4h);
    });
    return map;
  }, [items]);

  const GRID = "22px 62px 90px 56px 18px 18px 18px repeat(5,1fr) 46px 28px";

  if (error) return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#060b14",color:"#f87171",fontFamily:"monospace",flexDirection:"column",gap:8}}>
      <span style={{fontSize:18}}>⚠ Fehler beim Laden</span>
      <span style={{fontSize:12,color:"#475569"}}>{error}</span>
    </div>
  );

  return (
    <div style={{minHeight:"100vh",background:"#060b14",color:"#e2e8f0",fontFamily:"'Inter',system-ui,sans-serif",padding:"16px 12px"}}>

      {/* Add-Ticker Form */}
      <div style={{background:"#0f172a",borderRadius:10,border:"1px solid #1e293b",padding:"12px 14px",marginBottom:12,display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
        <span style={{fontSize:13,fontWeight:700,color:"#8b5cf6",fontFamily:"monospace"}}>★ Meine Watchlist</span>
        <form onSubmit={handleAdd} style={{display:"flex",alignItems:"center",gap:6,marginLeft:"auto"}}>
          <input
            value={addInput}
            onChange={e => { setAddInput(e.target.value.toUpperCase()); setAddError(null); }}
            placeholder="TICKER (z.B. AAPL)"
            style={{background:"#07090f",border:"1px solid #334155",color:"#e2e8f0",borderRadius:6,padding:"5px 10px",fontSize:12,fontFamily:"monospace",width:160,outline:"none"}}
          />
          <button type="submit" disabled={addLoading || !addInput.trim()}
            style={{background:"#6d28d9",border:"none",color:"#fff",borderRadius:6,padding:"5px 14px",fontSize:12,cursor:addLoading||!addInput.trim()?"not-allowed":"pointer",fontWeight:600,opacity:addLoading||!addInput.trim()?0.5:1}}>
            {addLoading ? "…" : "+ Hinzufügen"}
          </button>
          {addError && <span style={{fontSize:11,color:"#f87171"}}>{addError}</span>}
        </form>
      </div>

      <div className="desktop-layout">
      <div className="desktop-left">

      {/* Watchlist Table */}
      <div style={{background:"#0f172a",borderRadius:10,border:"1px solid #1e293b",marginBottom:12,overflowX:"auto"}}>
        <div style={{minWidth:520}}>

          {/* Header */}
          <div style={{display:"grid",gridTemplateColumns:GRID,padding:"6px 10px",background:"#1e293b",gap:2,fontSize:9,color:"#475569",textTransform:"uppercase",letterSpacing:0.5,alignItems:"center"}}>
            <span>#</span>
            <span>Ticker</span>
            <span>Index / Rang</span>
            <span>Score</span>
            <span style={{textAlign:"center",color:"#f59e0b"}}>W</span>
            <span style={{textAlign:"center",color:"#ef4444"}}>D</span>
            <span style={{textAlign:"center",color:"#a78bfa"}}>4H</span>
            {WINDOWS.map(w => <span key={w} style={{textAlign:"center"}}>{w}</span>)}
            <span style={{textAlign:"center"}}>News</span>
            <span></span>
          </div>

          {loading && (
            <div style={{padding:"20px",textAlign:"center",color:"#475569",fontSize:12,fontFamily:"monospace"}}>Lade Watchlist…</div>
          )}

          {!loading && (!items || items.length === 0) && (
            <div style={{padding:"24px",textAlign:"center",color:"#334155",fontSize:12}}>

              <span style={{color:"#475569"}}>Ticker oben eingeben oder auf den + Button in den Indexübersichten klicken.</span>

          {(items || []).flatMap((item, idx) => {

            const isBOC   = structs.weekly?.broken && structs.daily?.broken && structs.h4?.broken4h;

                  borderTop:`1px solid ${isBOC?"#ef444422":"#0a0f1e"}`,

                  cursor: hasChart ? "pointer" : "default",

                {/* D dot */}

                    cursor:"pointer",
                    fontFamily:"monospace",

                    whiteSpace:"nowrap",
                    transition:"border-color .15s, color .15s",

                  onClick={e => { e.stopPropagation(); handleRemove(item.ticker); }}

                  style={{background:"none",border:"1px solid #1e293b",color:"#475569",borderRadius:5,padding:"2px 5px",fontSize:11,cursor:"pointer",lineHeight:1,transition:"border-color .15s,color .15s"}}
                  onMouseEnter={e => { e.target.style.borderColor="#ef4444"; e.target.style.color="#ef4444"; }}
                  onMouseLeave={e => { e.target.style.borderColor="#1e293b"; e.target.style.color="#475569"; }}>

                <div key={item.ticker + "_news"} className="news-row news-enter">

              );
            }

            return rows;
          })}

        </div>
      </div>
      </div>{/* end desktop-left */}

      <div className="desktop-right" ref={chartRef}>
      {/* Chart Panel */}
      <div style={{background:"#0f172a",borderRadius:10,border:"1px solid #1e293b",padding:14,marginBottom:12}}>
        {selected && selectedItem ? (
          <>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <p style={{margin:0,fontSize:15,fontWeight:800,color:"#f1f5f9",fontFamily:"monospace"}}>{selected}</p>
              {selectedItem.score != null && (
                <span style={{fontSize:11,fontFamily:"monospace",color:selectedItem.score>0?"#4ade80":"#f87171"}}>
                  RS Score: {selectedItem.score>0?"+":""}{Math.round(selectedItem.score)}
                </span>
              )}
            </div>
            {ohlcv ? (
              <div className="charts-grid">
                {ohlcvW && structureW ? (
                  <ChartWeekly ohlcvW={ohlcvW} structureW={structureW} chartId={selected+"_w"}
                    benchOhlcv={benchOhlcvW} benchLabel={benchLabel} signals={tickerSignals}/>
                ) : (
                  <div style={{background:"#07090f",borderRadius:8,border:"1px solid #1e293b",padding:"12px 16px",color:"#334155",fontSize:11,fontFamily:"monospace"}}>
                    Weekly-Daten fehlen
                  </div>
                )}
                {ohlcvDisplay && structure && (
                  <CandleChart ohlcv={ohlcvDisplay} structure={structure} chartId={selected+"_d"}
                    benchOhlcv={benchOhlcvD} benchLabel={benchLabel} signals={tickerSignals}/>
                )}
                {show4H && (
                  <div className="chart-full-width">
                    <Chart4H ohlcv4h={ohlcv4hDisplay} structure4h={structure4h} chartId={selected+"_4h"} signals={tickerSignals}/>
                  </div>
                )}
              </div>
            ) : (
              <div style={{color:"#475569",fontSize:12,textAlign:"center",padding:"20px 0"}}>
                Klick auf einen Ticker mit ▸ für Chartansicht.
              </div>
            )}
          </>
        ) : (
          <div style={{color:"#475569",fontSize:12,textAlign:"center",padding:"20px 0",fontFamily:"monospace"}}>
            {loading ? "Lade…" : "Ticker auswählen für Chartansicht."}
          </div>
        )}
      </div>
      </div>{/* end desktop-right */}
      </div>{/* end desktop-layout */}

    </div>
  );
}

ReactDOM.render(<WatchlistApp />, document.getElementById('root'));
</script>
</body>
</html>
