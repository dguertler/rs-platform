<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RS · Alpha Screening</title>
  <script src="/api.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #060b14; color: #e2e8f0; font-family: 'Inter', system-ui, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0a0f1e; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
    select, button { outline: none; }
    .nav-bar { display:inline-flex; align-items:center; gap:5px; padding:12px 12px 0; flex-wrap:wrap; }
    .nav-switch { display:inline-flex; align-items:center; gap:6px; background:#1e293b; border:1px solid #334155; border-radius:8px; padding:6px 13px; font-size:12px; font-weight:700; color:#94a3b8; text-decoration:none; font-family:monospace; white-space:nowrap; box-shadow:0 2px 8px #00000066; transition:border-color .15s, color .15s; }
    .nav-switch:hover { border-color:#3b82f6; color:#e2e8f0; }
    .nav-switch.active { border-color:#3b82f6; color:#e2e8f0; background:#1a2f4a; }
    .tab-btn { background:none; border:1px solid #334155; border-radius:8px; padding:7px 18px; font-size:12px; font-weight:700; color:#64748b; cursor:pointer; font-family:monospace; transition:all .15s; }
    .tab-btn.active { border-color:#f59e0b; color:#fbbf24; background:#1a1100; }
    .card { background:#0f172a; border:1px solid #1e293b; border-radius:10px; padding:14px; margin-bottom:10px; }
    .badge { display:inline-block; font-size:9px; font-weight:700; padding:2px 6px; border-radius:4px; font-family:monospace; letter-spacing:0.5px; }
    .kv { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:6px; }
    .kv span { font-size:10px; color:#64748b; }
    .kv b { font-size:10px; color:#94a3b8; font-family:monospace; }
    .gws-g { color:#4ade80; }
    .gws-y { color:#fbbf24; }
    .gws-r { color:#f87171; }
    .mono { font-family:monospace; }
  </style>
</head>
<body>
  <div id="plan-bar" style="position:fixed;top:8px;right:14px;font-size:13px;color:#94a3b8;z-index:9999"></div>

<div class="nav-bar">
  <a href="index.html" class="nav-switch">Nasdaq</a>
  <a href="dax.html" class="nav-switch">DAX</a>
  <a href="sp500.html" class="nav-switch">S&amp;P500</a>
  <a href="smallcap.html" class="nav-switch">SC600</a>
  <a href="backtest_overview.html" class="nav-switch">B-ÜBERSICHT</a>
  <a href="backtest.html" class="nav-switch">B-DETAILS</a>
  <a href="alpha.html" class="nav-switch active" style="border-color:#f59e0b;color:#fbbf24;background:#1a1100;">ALPHA</a>
  <a href="watchlist.html" class="nav-switch" style="border-color:#7c3aed;color:#a78bfa;">★ WATCHLIST</a>
</div>
<div id="root"></div>
<script>
/* RS Auth */
(function () {
  function getToken() { return localStorage.getItem('rs_token'); }
  function logout() {
    localStorage.removeItem('rs_token');
    localStorage.removeItem('rs_email');
    window.location.href = '/login.html';
  }
  window.rsLogout = logout;
  window.apiFetch = async function (url, opts) {
    opts = opts || {};
    var token = getToken();
    if (!token) { logout(); return new Response('{}', { status: 401 }); }
    var r = await fetch(url, Object.assign({}, opts, {
      headers: Object.assign({}, opts.headers || {}, { 'Authorization': 'Bearer ' + token })
    }));
    if (r.status === 401) { logout(); }
    return r;
  };
  if (!getToken()) { window.location.href = '/login.html'; return; }
  document.addEventListener('DOMContentLoaded', function () {
    var email = localStorage.getItem('rs_email') || '';
    var btn = document.createElement('button');
    btn.textContent = 'Logout' + (email ? ' · ' + email : '');
    btn.style.cssText = 'position:fixed;bottom:10px;right:10px;background:#1e293b;border:1px solid #334155;color:#94a3b8;font-size:11px;padding:4px 10px;border-radius:4px;cursor:pointer;z-index:9999;font-family:monospace';
    btn.onclick = function () { window.rsLogout(); };
    document.body.appendChild(btn);
  });
})()
</script>
<script>
  (async function() {
    try {
      var r = await window.apiFetch('/api/user/me');
      if (!r || r.status !== 200) return;
      var u = await r.json();
      var bar = document.getElementById('plan-bar');
      if (!bar) return;
      var planHtml = u.plan === 'pro'
        ? '<span style="color:#22c55e;font-weight:600">&#10003; Pro</span>'
        : 'Free&nbsp;<button onclick="(async function(){var x=await window.apiFetch(\'/api/stripe/checkout\');var d=await x.json();if(d.url)window.location.href=d.url;})()" style="background:#2563eb;color:#fff;border:none;padding:2px 10px;border-radius:4px;font-size:12px;cursor:pointer">Upgrade</button>';
      var adminLink = u.is_admin
        ? '&nbsp;&nbsp;<a href="/admin.html" style="color:#fbbf24;font-size:12px;text-decoration:none">Admin</a>'
        : '';
      bar.innerHTML = planHtml
        + '&nbsp;&nbsp;<a href="/account.html" style="color:#94a3b8;font-size:12px;text-decoration:none">Konto</a>'
        + adminLink;
      if (u.is_admin) {
        var nb = document.querySelector('.nav-bar');
        if (nb) { var ra=document.createElement('a'); ra.href='/roadmap.html'; ra.className='nav-switch'; ra.style.cssText='border-color:#7c3aed;color:#a78bfa;'; ra.textContent='ROADMAP'; nb.appendChild(ra); }
      }
    } catch(e) {}
  })();
</script>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;

const PROFILE_META = {
  early_tech: {
    label: "Early Tech Alpha",
    color: "#3b82f6",
    bg:    "#0c1a2e",
    desc:  "Small/Mid-Cap Tech · RevGrowth >20% · GrossMargin >40% · RS >60",
    icon:  "🚀",
  },
  hidden_champions: {
    label: "Hidden Champions",
    color: "#22c55e",
    bg:    "#0a1f0a",
    desc:  "ROIC >12% · D/E <1 · FCF positiv · wenig Analysten · RS >45",
    icon:  "💎",
  },
  post_earnings: {
    label: "Post-Earnings Breakout",
    color: "#f59e0b",
    bg:    "#1a1100",
    desc:  "EPS-Beat ≥10% in letzten 21 Tagen · inkl. Turnarounds",
    icon:  "⚡",
  },
};

function fmtPct(v, decimals = 1) {
  if (v == null || v === "N/A") return "–";
  const n = parseFloat(v);
  if (isNaN(n)) return "–";
  return (n >= 0 ? "+" : "") + (n * 100).toFixed(decimals) + "%";
}

function fmtNum(v, decimals = 1) {
  if (v == null || v === "N/A") return "–";
  const n = parseFloat(v);
  if (isNaN(n)) return "–";
  return n.toFixed(decimals);
}

function fmtMCap(v) {
  if (!v || v === "N/A") return "–";
  const n = parseFloat(v);
  if (isNaN(n)) return "–";
  if (n >= 1e12) return (n / 1e12).toFixed(1) + "T";
  if (n >= 1e9)  return (n / 1e9).toFixed(1) + "B";
  if (n >= 1e6)  return (n / 1e6).toFixed(1) + "M";
  return n.toFixed(0);
}

function GwsBadge({ gws }) {
  if (!gws) return null;
  const { weekly, daily, h4 } = gws;
  const dot = (active, label, color) => (
    <span style={{fontSize:9, fontFamily:"monospace", color: active ? color : "#334155"}}>
      {label}
    </span>
  );
  return (
    <span style={{display:"inline-flex", gap:3, alignItems:"center", background:"#0a0f1e", borderRadius:4, padding:"2px 5px", border:"1px solid #1e293b"}}>
      {dot(weekly?.broken,  "W", "#f59e0b")}
      <span style={{color:"#1e293b"}}>·</span>
      {dot(daily?.broken,   "D", "#ef4444")}
      <span style={{color:"#1e293b"}}>·</span>
      {dot(h4?.broken4h,    "4H","#a78bfa")}
    </span>
  );
}

function EarlyTechCard({ item }) {
  const meta = item.fundamentals || {};
  return (
    <div className="card" style={{borderLeft:`3px solid #3b82f6`}}>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:8}}>
        <div>
          <span style={{fontWeight:700, fontSize:14, fontFamily:"monospace", color:"#f1f5f9"}}>{item.ticker}</span>
          <span style={{fontSize:11, color:"#64748b", marginLeft:8}}>{meta.shortName || ""}</span>
        </div>
        <div style={{display:"flex", gap:6, alignItems:"center", flexShrink:0}}>
          <span className="badge" style={{background:"#0c1a2e", color:"#3b82f6", border:"1px solid #1d4ed8"}}>
            RS {Math.round(item.score)}
          </span>
          <GwsBadge gws={item.gws}/>
        </div>
      </div>
      <div className="kv">
        <span>Sektor:</span><b>{meta.sector || "–"}</b>
        <span>MCap:</span><b>{fmtMCap(meta.marketCap)}</b>
        <span>RevWachstum:</span><b style={{color: parseFloat(meta.revenueGrowth) > 0.2 ? "#4ade80" : "#94a3b8"}}>{fmtPct(meta.revenueGrowth)}</b>
        <span>Bruttomarge:</span><b>{fmtPct(meta.grossMargins)}</b>
        <span>KGV(fwd):</span><b>{fmtNum(meta.forwardPE)}</b>
        <span>ROE:</span><b>{fmtPct(meta.returnOnEquity)}</b>
      </div>
    </div>
  );
}

function HiddenChampionCard({ item }) {
  const meta = item.fundamentals || {};
  return (
    <div className="card" style={{borderLeft:`3px solid #22c55e`}}>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:8}}>
        <div>
          <span style={{fontWeight:700, fontSize:14, fontFamily:"monospace", color:"#f1f5f9"}}>{item.ticker}</span>
          <span style={{fontSize:11, color:"#64748b", marginLeft:8}}>{meta.shortName || ""}</span>
        </div>
        <div style={{display:"flex", gap:6, alignItems:"center", flexShrink:0}}>
          <span className="badge" style={{background:"#0a1f0a", color:"#22c55e", border:"1px solid #166534"}}>
            RS {Math.round(item.score)}
          </span>
          <GwsBadge gws={item.gws}/>
        </div>
      </div>
      <div className="kv">
        <span>Sektor:</span><b>{meta.sector || "–"}</b>
        <span>ROIC:</span><b style={{color: parseFloat(meta.returnOnInvestedCapital) > 0.12 ? "#4ade80" : "#94a3b8"}}>
          {meta.returnOnInvestedCapital != null && meta.returnOnInvestedCapital !== "N/A"
            ? (parseFloat(meta.returnOnInvestedCapital) * 100).toFixed(1) + "%" : "–"}
        </b>
        <span>D/E:</span><b>{fmtNum(meta.debtToEquity)}</b>
        <span>FCF:</span><b>{meta.freeCashflow != null && meta.freeCashflow !== "N/A"
          ? fmtMCap(meta.freeCashflow) : "–"}</b>
        <span>RevWachstum:</span><b>{fmtPct(meta.revenueGrowth)}</b>
        <span>Analysten:</span><b>{meta.numberOfAnalystOpinions || "–"}</b>
        <span>KGV(fwd):</span><b>{fmtNum(meta.forwardPE)}</b>
      </div>
    </div>
  );
}

function PostEarningsCard({ item }) {
  const meta = item.fundamentals || {};
  const jumpColor = parseFloat(item.jump_pct) >= 5 ? "#4ade80" : "#94a3b8";
  return (
    <div className="card" style={{borderLeft:`3px solid #f59e0b`}}>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:8}}>
        <div>
          <span style={{fontWeight:700, fontSize:14, fontFamily:"monospace", color:"#f1f5f9"}}>{item.ticker}</span>
          <span style={{fontSize:11, color:"#64748b", marginLeft:8}}>{meta.shortName || item.name || ""}</span>
        </div>
        <div style={{display:"flex", gap:6, alignItems:"center", flexShrink:0}}>
          <span className="badge" style={{background:"#1a1100", color:"#f59e0b", border:"1px solid #92400e"}}>
            RS {Math.round(item.score)}
          </span>
          <GwsBadge gws={item.gws}/>
        </div>
      </div>
      <div className="kv">
        {item.earnings_date && <><span>Earnings:</span><b>{item.earnings_date}</b></>}
        {item.eps_surprise_pct != null && (
          <><span>EPS-Beat:</span><b style={{color:"#4ade80"}}>+{parseFloat(item.eps_surprise_pct).toFixed(1)}%</b></>
        )}
        {item.jump_pct != null && (
          <><span>Kurssprung:</span><b style={{color:jumpColor}}>+{parseFloat(item.jump_pct).toFixed(1)}%</b></>
        )}
        {item.revenue_yoy_pct != null && (
          <><span>Umsatz YoY:</span><b>{(parseFloat(item.revenue_yoy_pct) * 100).toFixed(1)}%</b></>
        )}
        {item.persistence_flag && (
          <span className="badge" style={{background:"#0a1f0a", color:"#4ade80", border:"1px solid #166534"}}>
            Hält nach Earnings
          </span>
        )}
        {item.guidance_raise && (
          <span className="badge" style={{background:"#1a1100", color:"#fbbf24", border:"1px solid #92400e"}}>
            Guidance angehoben
          </span>
        )}
      </div>
      {(meta.sector || meta.industry) && (
        <div className="kv" style={{marginTop:4}}>
          <span>Sektor:</span><b>{meta.sector || "–"}</b>
          <span>Marge:</span><b>{fmtPct(meta.profitMargins)}</b>
        </div>
      )}
    </div>
  );
}

function EmptyState({ profile }) {
  const meta = PROFILE_META[profile];
  return (
    <div style={{padding:"40px 20px", textAlign:"center", color:"#334155"}}>
      <div style={{fontSize:32, marginBottom:12}}>{meta.icon}</div>
      <div style={{fontFamily:"monospace", fontSize:13, marginBottom:8}}>Noch keine Kandidaten</div>
      <div style={{fontSize:11, color:"#1e293b"}}>
        Das tägliche Screening läuft Di–Sa morgens um 03:00 UTC.
      </div>
    </div>
  );
}

function App() {
  const [tab, setTab]   = useState("early_tech");
  const [data, setData] = useState(null);
  const [err,  setErr]  = useState(null);

  useEffect(() => {
    apiFetch("/api/alpha/candidates")
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(j => setData(j))
      .catch(e => setErr(String(e)));
  }, []);

  const profiles = data?.profiles || {};
  const updatedAt = data?.updated_at ? new Date(data.updated_at).toLocaleString("de-DE") : null;

  const currentList = profiles[tab] || [];

  return (
    <div style={{minHeight:"100vh", background:"#060b14", padding:"16px 12px", maxWidth:860, margin:"0 auto"}}>

      {/* Header */}
      <div style={{marginBottom:16}}>
        <h1 style={{fontSize:20, fontWeight:800, color:"#fbbf24", fontFamily:"monospace", marginBottom:4}}>
          Alpha Screening
        </h1>
        <p style={{fontSize:11, color:"#334155"}}>
          Tägliches Vorfilter-Ergebnis · {updatedAt ? `Stand: ${updatedAt}` : "Lade …"}
        </p>
      </div>

      {/* Tabs */}
      <div style={{display:"flex", gap:8, marginBottom:16, flexWrap:"wrap"}}>
        {Object.entries(PROFILE_META).map(([key, meta]) => {
          const count = (profiles[key] || []).length;
          return (
            <button key={key} className={`tab-btn${tab === key ? " active" : ""}`}
              onClick={() => setTab(key)}
              style={tab === key ? {borderColor: meta.color, color: meta.color, background: meta.bg} : {}}>
              {meta.icon} {meta.label}
              {count > 0 && (
                <span style={{marginLeft:6, background:"#1e293b", borderRadius:9, padding:"1px 6px", fontSize:10, color:"#94a3b8"}}>
                  {count}
                </span>
              )}
            </button>
          );
        })}
      </div>

      {/* Tab description */}
      <div style={{marginBottom:12, padding:"8px 12px", background:"#0a0f1e", borderRadius:6, border:"1px solid #1e293b"}}>
        <span style={{fontSize:10, color:"#475569", fontFamily:"monospace"}}>
          {PROFILE_META[tab].desc}
        </span>
      </div>

      {/* Content */}
      {err ? (
        <div style={{color:"#f87171", fontFamily:"monospace", fontSize:12, padding:"20px 0"}}>
          Fehler: {err}
        </div>
      ) : !data ? (
        <div style={{color:"#475569", fontFamily:"monospace", fontSize:12, textAlign:"center", padding:"40px 0"}}>
          ⟳ Lade Alpha-Kandidaten …
        </div>
      ) : currentList.length === 0 ? (
        <EmptyState profile={tab}/>
      ) : (
        <div>
          {tab === "early_tech" && currentList.map(item => (
            <EarlyTechCard key={item.ticker} item={item}/>
          ))}
          {tab === "hidden_champions" && currentList.map(item => (
            <HiddenChampionCard key={item.ticker} item={item}/>
          ))}
          {tab === "post_earnings" && currentList.map(item => (
            <PostEarningsCard key={item.ticker} item={item}/>
          ))}
        </div>
      )}

      <p style={{textAlign:"center", color:"#1e293b", fontSize:9, marginTop:16}}>
        Kein Handelssignal · Automatisches Vorfilter via yfinance
      </p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
