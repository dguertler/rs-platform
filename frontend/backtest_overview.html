<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RS · Backtest Übersicht</title>
  <script src="api.js?v=20260922"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="backtest_logic.js?v=20261035"></script>
  <script type="text/babel" src="live_alerts_panel.js?v=20261015"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #060b14; color: #e2e8f0; font-family: 'Inter', system-ui, sans-serif; min-height: 100vh; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0a0f1e; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
    .nav-bar { display:inline-flex; align-items:center; gap:5px; padding:12px 12px 0; }
    .nav-switch { display:inline-flex; align-items:center; gap:6px; background:#1e293b; border:1px solid #334155; border-radius:8px; padding:6px 13px; font-size:12px; font-weight:700; color:#94a3b8; text-decoration:none; font-family:monospace; white-space:nowrap; box-shadow:0 2px 8px #00000066; transition:border-color .15s,color .15s; }
    .nav-switch:hover  { border-color:#3b82f6; color:#e2e8f0; }
    .nav-switch.active { border-color:#f59e0b; color:#fbbf24; background:#1a1a0a; }
    table { border-collapse: collapse; width: 100%; }
    th { position: sticky; top: 0; background: #0d1526; z-index: 10; }
    .card { background: #0d1526; border: 1px solid #1e293b; border-radius: 8px; padding: 12px 18px; }
    .note { font-size: 12px; color: #94a3b8; line-height: 1.6; }
    .note b { color: #e2e8f0; }
    tr.data-row { cursor: pointer; transition: background .1s; }
    tr.data-row:hover { background: #1a2540 !important; }
    tr.data-row:nth-child(even) { background: #080e1c; }
    tr.data-row:nth-child(odd)  { background: #060b14; }
    tr.plain-row:nth-child(even) { background: #080e1c; }
    @media (max-width: 600px) {
      .yt td, .yt th { padding: 6px 5px !important; font-size: 11px !important; }
      .yt .pa, .yt .col-trades { display: none; }
    }
  </style>
</head>
<body>
<div class="nav-bar">
  <a href="index.html"            class="nav-switch">Nasdaq</a>
  <a href="sp500.html"            class="nav-switch">S&amp;P500</a>
  <a href="smallcap.html"        class="nav-switch">SC600</a>
  <a href="backtest_overview.html" class="nav-switch active">B-ÜBERSICHT</a>
  <a href="backtest.html"         class="nav-switch">B-DETAILS</a>
  <a href="v2.html" class="nav-switch" style="border-color:#22c55e;color:#4ade80;">RS-Platform 2.0</a>
</div>
<div id="root"></div>
<div id="live-root"></div>

<script>
  window.apiFetch = function (url, opts) { return fetch(url, opts || {}); };
</script>
<script type="text/babel">
const { useState, useMemo, useEffect } = React;

// ── Farb- und Format-Helfer ──────────────────────────────────────────────────
const green = '#4ade80', red = '#f87171', neutral = '#64748b';
const pnlColor = v => v > 0 ? green : v < 0 ? red : neutral;
const wrColor = v => v >= 60 ? green : v >= 45 ? '#fbbf24' : red;
const num = (v, d = 1) => v.toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (v, d = 1) => v == null ? '–' : (v > 0 ? '+' : '') + num(v, d) + ' %';
const eur = v => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.round(Math.abs(v)).toLocaleString('de-DE') + ' €';
const pfText = v => v == null ? '–' : num(v, 2);
const cell = { padding: '8px 12px', fontFamily: 'monospace', fontSize: 12, borderBottom: '1px solid #0d1526', textAlign: 'right', whiteSpace: 'nowrap' };
const head = { padding: '10px 12px', fontSize: 11, fontFamily: 'monospace', color: '#64748b', borderBottom: '1px solid #1e293b', textAlign: 'right', whiteSpace: 'nowrap' };

// Profitfaktor einer Trade-Liste (inkl. offener Positionen zum aktuellen Stand)
function pfOf(list) {
  const w = list.filter(t => t.pnl > 0).reduce((s, t) => s + t.pnl, 0);
  const l = list.filter(t => t.pnl <= 0).reduce((s, t) => s + t.pnl, 0);
  return l < 0 ? w / -l : null;
}

// Signale ohne Platzlimit: Gewinn der im Jahr verkauften Trades (offene: laufendes Jahr) / 100.000 €
// (10 × 10.000 €), Gesamt verkettet — wie die Logik-Bewertung (compare_backtest.js)
function signalYears(trades) {
  const out = {};
  for (const t of trades) { const y = t.exitDate.slice(0, 4); out[y] = (out[y] || 0) + t.pnl / 1000; }
  return out;
}
const chain = (vals) => (vals.reduce((f, v) => f * (1 + (v || 0) / 100), 1) - 1) * 100;

function YearTable({ res, sig }) {
  const years = Object.entries(res.years);
  const d = res.depot;
  const sigTotal = sig ? chain(years.map(([y]) => sig[y])) : null;
  const better = (v, ndx) => v != null && ndx != null && v > ndx ? '#4ade8012' : undefined;
  return (
    <div style={{ background: '#0a101e', border: '1px solid #1e293b', borderRadius: 10, overflow: 'auto', marginBottom: 20 }}>
      <table className="yt">
        <thead><tr>
          <th style={{ ...head, textAlign: 'left' }}>Jahr</th>
          <th style={head}>NASDAQ-100</th>
          {sig && <th style={head}>Signale ohne Platzlimit</th>}
          <th style={head}>Depot (10 Plätze)</th>
          <th style={head}>Gewinn</th>
          <th style={head}>PF</th>
          <th style={head} className="col-trades">Trades</th>
        </tr></thead>
        <tbody>
          {years.map(([y, v]) => (
            <tr key={y} className="plain-row">
              <td style={{ ...cell, textAlign: 'left', color: '#f1f5f9', fontWeight: 700 }}>{y}{y === res.dataEnd.slice(0, 4) ? ' *' : ''}</td>
              <td style={{ ...cell, color: pnlColor(v.ndxPct) }}>{pct(v.ndxPct)}</td>
              {sig && <td style={{ ...cell, color: pnlColor(sig[y] || 0), background: better(sig[y] || 0, v.ndxPct) }}>{pct(sig[y] || 0)}</td>}
              <td style={{ ...cell, color: pnlColor(v.returnPct), fontWeight: 700, background: better(v.returnPct, v.ndxPct) }}>{pct(v.returnPct)}</td>
              <td style={{ ...cell, color: pnlColor(v.pnl) }}>{eur(v.pnl)}</td>
              <td style={{ ...cell, color: v.profitFactor == null || v.profitFactor >= 1 ? green : red }}>{pfText(v.profitFactor)}</td>
              <td style={{ ...cell, color: '#94a3b8' }} className="col-trades">{v.trades}</td>
            </tr>
          ))}
          <tr style={{ background: '#0d1526' }}>
            <td style={{ ...cell, textAlign: 'left', color: '#fbbf24', fontWeight: 800 }}>Gesamt</td>
            <td style={{ ...cell, color: pnlColor(d.ndxPct), fontWeight: 700 }}>{pct(d.ndxPct)}</td>
            {sig && <td style={{ ...cell, color: pnlColor(sigTotal), fontWeight: 800, background: better(sigTotal, d.ndxPct) }}>{pct(sigTotal)}</td>}
            <td style={{ ...cell, color: pnlColor(d.returnPct), fontWeight: 800 }}>{pct(d.returnPct)} <span className="pa" style={{ color: '#64748b', fontWeight: 400 }}>({pct(d.cagr)} p. a.)</span></td>
            <td style={{ ...cell, color: pnlColor(d.endEquity - d.startCapital), fontWeight: 800 }}>{eur(d.endEquity - d.startCapital)}</td>
            <td style={{ ...cell, color: d.profitFactor >= 1 ? green : red, fontWeight: 800 }}>{pfText(d.profitFactor)}</td>
            <td style={{ ...cell, color: '#94a3b8' }} className="col-trades">{d.taken}</td>
          </tr>
        </tbody>
      </table>
    </div>
  );
}

function OverviewApp() {
  const [res, setRes] = useState(null);
  const [error, setError] = useState(null);
  const [year, setYear] = useState('ALL');
  const [sortKey, setSortKey] = useState('pnl');
  const [sortAsc, setSortAsc] = useState(false);
  const [search, setSearch] = useState('');
  const [top20, setTop20] = useState(() => { try { return localStorage.getItem('btTop20Signal') !== '0'; } catch { return true; } });
  const toggleTop20 = on => { setTop20(on); try { localStorage.setItem('btTop20Signal', on ? '1' : '0'); } catch { /* egal */ } };

  useEffect(() => {
    window.apiFetch('data/backtest_ndx.json')
      .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
      .then(setRes).catch(e => setError(e.message));
  }, []);

  // Schalter: „Top 20 am Tradetag“ (System, Standard) oder „Alle Signale“ ohne Top-20-Filter
  // (Depot dafür eigens gerechnet in backtest_ndx.js → allSignals)
  const view = useMemo(() => {
    if (!res) return null;
    const a = res.allSignals;
    return top20 || !a ? { depot: res.depot, years: res.years, signals: res.signals, trades: res.trades }
      : { depot: a.depot, years: a.years, signals: a.signals, trades: a.trades };
  }, [res, top20]);

  // Trades je Aktie; Jahr = Jahr des Verkaufs (offene: Datenende), wie in der Jahrestabelle
  const stocks = useMemo(() => {
    if (!res) return [];
    const by = {};
    for (const t of view.trades) {
      if (year !== 'ALL' && t.exitDate.slice(0, 4) !== year) continue;
      (by[t.symbol || t.ticker] ||= []).push(t);
    }
    let rows = Object.entries(by).map(([symbol, list]) => {
      const closed = list.filter(t => !t.isOpen);
      const ticker = list[0].ticker;
      return {
        symbol, ticker, label: symbol === ticker ? ticker : `${ticker} (bis ${list[list.length - 1].exitDate.slice(0, 4)})`, trades: list.length, open: list.some(t => t.isOpen),
        pnl: list.reduce((s, t) => s + t.pnl, 0),
        // Trades nacheinander verkettet (Zinseszins), wie die Gesamtrenditen der Jahrestabelle
        ret: (list.reduce((f, t) => f * (1 + t.pnlPct / 100), 1) - 1) * 100,
        winrate: closed.length ? closed.filter(t => t.pnl > 0).length / closed.length * 100 : null,
        wins: closed.filter(t => t.pnl > 0).length, closed: closed.length,
        pf: pfOf(list), depot: list.filter(t => t.depot).length,
      };
    });
    if (search) rows = rows.filter(r => r.ticker.toLowerCase().includes(search.toLowerCase()));
    return rows.sort((a, b) => {
      const av = a[sortKey] ?? -Infinity, bv = b[sortKey] ?? -Infinity;
      return (av < bv ? -1 : av > bv ? 1 : 0) * (sortAsc ? 1 : -1);
    });
  }, [res, view, year, sortKey, sortAsc, search]);

  const sigYears = useMemo(() => view ? signalYears(view.trades) : {}, [view]);
  const sel = useMemo(() => view ? view.trades.filter(t => year === 'ALL' || t.exitDate.slice(0, 4) === year) : [], [view, year]);

  if (error) return <div style={{ padding: 40, color: red, fontFamily: 'monospace' }}>Backtest-Daten fehlen ({error})</div>;
  if (!res) return <div style={{ padding: '100px 24px', textAlign: 'center', color: '#475569', fontFamily: 'monospace' }}>Lade Backtest…</div>;

  const d = view.depot;
  const sigTotal = top20 ? chain(Object.keys(view.years).map(y => sigYears[y])) : null;
  const sortHead = (key, label, left = false) => (
    <th onClick={() => { if (sortKey === key) setSortAsc(p => !p); else { setSortKey(key); setSortAsc(key === 'ticker'); } }}
      style={{ ...head, textAlign: left ? 'left' : 'right', cursor: 'pointer', userSelect: 'none', color: sortKey === key ? '#f1f5f9' : '#64748b' }}>
      {label}{sortKey === key ? (sortAsc ? ' ↑' : ' ↓') : ''}
    </th>
  );
  const chip = (k, label) => (
    <button key={k} onClick={() => setYear(k)}
      style={{ background: year === k ? '#1e293b' : 'transparent', border: `1px solid ${year === k ? '#475569' : '#1e293b'}`,
        borderRadius: 6, padding: '4px 10px', color: year === k ? '#f1f5f9' : '#64748b', fontFamily: 'monospace', fontSize: 12, fontWeight: 700, cursor: 'pointer' }}>
      {label}
    </button>
  );

  return (
    <div style={{ maxWidth: 1100, margin: '0 auto', padding: '24px 16px 8px' }}>
      <div style={{ display: 'flex', flexWrap: 'wrap', alignItems: 'baseline', gap: 10, marginBottom: 6 }}>
        <span style={{ fontSize: 18, fontWeight: 700, color: '#f1f5f9' }}>Backtest NASDAQ-100 seit {res.start.slice(0, 4)}</span>
        <span style={{ fontSize: 11, color: '#475569', fontFamily: 'monospace' }}>Stand {res.dataEnd} · berechnet {res.generated} UTC</span>
      </div>
      <div className="note" style={{ marginBottom: 14 }}>
        <b>Zeitpunktgenau wie live:</b> Signal an jedem 4H-Kerzenschluss (4H-Punkt neu, Wochen- und Tagespunkt zu diesem Zeitpunkt grün,
        Top 20 am Signaltag). Kauf zur nächsten 4H-Kerze bei den Kerzen 10–14 und 14–18 Uhr (4H-Prüfjob), sonst um 10 Uhr am nächsten Handelstag.
        Stopp am letzten Swing-Tief, Ausstieg bei Trendumkehr (Schluss unter dem Tief, aus dem das letzte Hoch entstand) und vor Earnings, kein Zeitstopp.
        Depot: 100.000 € Start, höchstens 10 Positionen, Zinseszins. NASDAQ-100 über QQQ (inkl. Dividenden).
      </div>

      {res.allSignals && (
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, alignItems: 'center', marginBottom: 14 }}>
          {[[true, 'Top 20 am Tradetag'], [false, 'Alle Signale']].map(([on, label]) => (
            <button key={label} onClick={() => toggleTop20(on)}
              style={{ background: top20 === on ? '#1e293b' : 'transparent', border: `1px solid ${top20 === on ? '#475569' : '#1e293b'}`,
                borderRadius: 6, padding: '5px 12px', color: top20 === on ? '#f1f5f9' : '#64748b', fontFamily: 'monospace', fontSize: 12, fontWeight: 700, cursor: 'pointer' }}>
              {label}
            </button>
          ))}
          <span style={{ fontSize: 11, color: '#64748b', fontFamily: 'monospace' }}>
            {top20 ? 'nur Trades von Aktien, die am Signaltag in den Top 20 standen (System)'
              : 'alle Signale derselben Aktien, auch außerhalb der Top 20 — nur zum Vergleich, Depot eigens gerechnet'}
          </span>
        </div>
      )}

      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 10, marginBottom: 16 }}>
        {[
          ['Depot heute', Math.round(d.endEquity).toLocaleString('de-DE') + ' €', d.endEquity - d.startCapital],
          ['Depot gesamt', pct(d.returnPct, 0), d.returnPct],
          ['Rendite p. a.', pct(d.cagr), d.cagr],
          ['NASDAQ-100 gesamt', pct(d.ndxPct, 0), d.ndxPct],
          ...(sigTotal != null ? [['Signale ohne Platzlimit', pct(sigTotal, 0), sigTotal]] : []),
          ['Profitfaktor', pfText(d.profitFactor), d.profitFactor - 1],
          ['Max. Rückgang', pct(d.maxDD), d.maxDD],
          ['Trades im Depot', `${d.taken} von ${view.signals.nTrades}`, null],
        ].map(([label, val, col]) => (
          <div key={label} style={{ background: '#0d1526', border: '1px solid #1e293b', borderRadius: 8, padding: '10px 16px', flex: '1 1 140px', minWidth: 125 }}>
            <div style={{ fontSize: 10, color: '#64748b', fontFamily: 'monospace', marginBottom: 4 }}>{label}</div>
            <div style={{ fontSize: 18, fontWeight: 700, fontFamily: 'monospace', color: col == null ? '#e2e8f0' : pnlColor(col) }}>{val}</div>
          </div>
        ))}
      </div>

      <YearTable res={{ ...res, years: view.years, depot: d }} sig={top20 ? sigYears : null} />
      <div style={{ fontSize: 11, color: '#475569', fontFamily: 'monospace', margin: '-12px 0 22px' }}>
        Depot, Gewinn und PF = Depot mit höchstens 10 Plätzen im Kalenderjahr
        {top20 ? ' · Signale ohne Platzlimit = Gewinn aller Signale (je 10.000 €) mit Verkauf im Jahr / 100.000 € — Maß für die Logik, braucht in starken Phasen mehr als 100.000 €' : ' · bei „Alle Signale“ keine Rechnung ohne Platzlimit (zu viele gleichzeitige Signale für 100.000 €)'}
        {' · '}Gesamt = Jahre verkettet (Zinseszins) · PF = gekaufte Trades mit Verkauf im Jahr (offene zum aktuellen Kurs) · grün hinterlegt = besser als NASDAQ-100
        {' · '}* laufendes Jahr
      </div>

      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, alignItems: 'center', marginBottom: 10 }}>
        <span style={{ fontSize: 14, fontWeight: 700, color: '#f1f5f9', marginRight: 6 }}>Aktien</span>
        {chip('ALL', 'Alle Jahre')}
        {Object.keys(res.years).map(y => chip(y, y))}
        <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Suche Ticker…"
          style={{ marginLeft: 'auto', background: '#1e293b', border: '1px solid #334155', borderRadius: 6,
            color: '#f1f5f9', padding: '5px 10px', fontFamily: 'monospace', fontSize: 12, width: 130 }} />
      </div>
      <div style={{ fontSize: 11, color: '#64748b', fontFamily: 'monospace', marginBottom: 8 }}>
        {sel.length} Signale{year === 'ALL' ? '' : ` mit Verkauf ${year}`} · PF {pfText(pfOf(sel))} · Σ {eur(sel.reduce((s, t) => s + t.pnl, 0))} (je Signal 10.000 €, max. 1.000 € Risiko — ohne Depot-Begrenzung)
      </div>
      <div style={{ background: '#0a101e', border: '1px solid #1e293b', borderRadius: 10, overflow: 'auto' }}>
        <table>
          <thead><tr>
            {sortHead('ticker', 'Ticker', true)}
            {sortHead('trades', 'Trades')}
            {sortHead('depot', 'davon im Depot')}
            {sortHead('pnl', 'P&L €')}
            {sortHead('ret', 'Rendite verkettet')}
            {sortHead('winrate', 'Win Rate')}
            {sortHead('pf', 'PF')}
          </tr></thead>
          <tbody>
            {stocks.map(r => (
              <tr key={r.symbol} className="data-row" onClick={() => { window.location.href = `backtest.html?t=${encodeURIComponent(r.symbol)}${top20 ? '' : '&top20=0'}`; }}
                style={{ borderLeft: `3px solid ${r.open ? '#92400e' : 'transparent'}` }}>
                <td style={{ ...cell, textAlign: 'left', fontWeight: 700, fontSize: 13, color: '#f1f5f9' }}>
                  {r.label}
                  {r.open && <span style={{ marginLeft: 6, fontSize: 9, background: '#78350f', color: '#fbbf24', borderRadius: 3, padding: '1px 5px', fontWeight: 700 }}>OFFEN</span>}
                </td>
                <td style={{ ...cell, color: '#94a3b8' }}>{r.trades}</td>
                <td style={{ ...cell, color: '#64748b' }}>{r.depot}</td>
                <td style={{ ...cell, color: pnlColor(r.pnl), fontWeight: 600 }}>{eur(r.pnl)}</td>
                <td style={{ ...cell, color: pnlColor(r.ret) }}>{pct(r.ret)}</td>
                <td style={{ ...cell, color: r.winrate == null ? neutral : wrColor(r.winrate) }}>
                  {r.winrate == null ? '–' : num(r.winrate, 0) + ' %'}<span style={{ color: '#334155', fontSize: 10, marginLeft: 4 }}>({r.wins}/{r.closed})</span>
                </td>
                <td style={{ ...cell, color: r.pf == null || r.pf >= 1 ? green : red }}>{r.pf == null ? '∞' : num(r.pf, 2)}</td>
              </tr>
            ))}
          </tbody>
        </table>
        {stocks.length === 0 && <div style={{ padding: 32, textAlign: 'center', color: '#334155', fontFamily: 'monospace', fontSize: 13 }}>Keine Trades</div>}
      </div>
      <div style={{ marginTop: 10, color: '#334155', fontSize: 11, fontFamily: 'monospace' }}>
        Klick auf eine Zeile → B-DETAILS mit allen Trades der Aktie seit {res.start.slice(0, 4)} · S&amp;P 500 folgt mit derselben Logik
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<OverviewApp />);
</script>
</body>
</html>
