<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RS · Backtest Historie Details</title>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

  <script src="backtest_logic.js?v=20261009b"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #060b14; color: #e2e8f0; font-family: 'Inter', system-ui, sans-serif; min-height: 100vh; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0a0f1e; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
    .nav-bar { display:inline-flex; flex-wrap:wrap; align-items:center; gap:5px; padding:12px 12px 0; }
    .nav-switch { display:inline-flex; align-items:center; gap:6px; background:#1e293b; border:1px solid #334155; border-radius:8px; padding:6px 13px; font-size:12px; font-weight:700; color:#94a3b8; text-decoration:none; font-family:monospace; white-space:nowrap; box-shadow:0 2px 8px #00000066; transition:border-color .15s,color .15s; }
    .nav-switch:hover  { border-color:#3b82f6; color:#e2e8f0; }
    .nav-switch.active { border-color:#f59e0b; color:#fbbf24; background:#1a1a0a; }
    table { border-collapse: collapse; width: 100%; }
    th { position: sticky; top: 0; background: #0d1526; z-index: 10; padding: 10px 12px; text-align: right; color: #64748b; font-size: 11px; font-family: monospace; border-bottom: 1px solid #1e293b; white-space: nowrap; }
    th:first-child, td:first-child { text-align: left; }
    td { padding: 8px 12px; text-align: right; font-family: monospace; font-size: 12px; white-space: nowrap; }
    tr.data-row { cursor: pointer; transition: background .1s; }
    tr.data-row:hover { background: #1a2540 !important; }
    tr.data-row:nth-child(even) { background: #080e1c; }
    tr.data-row:nth-child(odd)  { background: #060b14; }
    tr.data-row.selected { background: #172033 !important; box-shadow: inset 3px 0 0 #f59e0b; }
    .card { background: #0d1526; border: 1px solid #1e293b; border-radius: 8px; padding: 12px 18px; }
    .note { font-size: 12px; color: #94a3b8; line-height: 1.6; }
    .note b { color: #e2e8f0; }
    .btn { background: transparent; border: 1px solid #1e293b; border-radius: 6px; padding: 5px 12px; color: #64748b; font-family: monospace; font-size: 12px; font-weight: 700; cursor: pointer; }
    .btn.on { background: #1e293b; border-color: #f59e0b; color: #fbbf24; }
    .chart-wrap { position: relative; }
    .chart-wrap svg { display: block; }
    .charts-grid { display:flex; flex-direction:column; gap:10px; }
    @media (min-width:768px) {
      .charts-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
      .chart-full-width { grid-column:1/-1; }
    }
    .desktop-layout { display:flex; flex-direction:column; gap:14px; }
    @media (min-width:1100px) {
      .desktop-layout { flex-direction:row; align-items:flex-start; gap:16px; }
      .desktop-left  { width:520px; flex-shrink:0; }
      .desktop-right { flex:1; min-width:0; position:sticky; top:16px; align-self:flex-start; }
    }
    .tbl-row { cursor:pointer; transition:background .1s; }
    .tbl-row:hover { background:#1e293b !important; }
    .dot { display:inline-block; width:9px; height:9px; border-radius:50%; }
    select { background: #0d1526; color: #e2e8f0; border: 1px solid #334155; border-radius: 6px; padding: 5px 10px; font-family: monospace; font-size: 13px; font-weight: 700; }
  </style>

<body>

</div>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

const green = '#4ade80', red = '#f87171', amber = '#fbbf24', blue = '#60a5fa', neutral = '#64748b';
const pnlColor = v => v > 0 ? green : v < 0 ? red : neutral;
const pfColor  = v => v == null ? neutral : v >= 1.5 ? green : v >= 1 ? amber : red;
const num = (v, d = 1) => v == null ? '–' : v === Infinity ? '∞' : v.toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (v, d = 1) => v == null ? '–' : (v >= 0 ? '+' : '') + num(v, d) + ' %';
const eur = v => v == null ? '–' : (v >= 0 ? '+' : '−') + Math.round(Math.abs(v)).toLocaleString('de-DE') + ' €';
const price = v => v == null ? '–' : num(v, v >= 1 ? 2 : 4);
const VARIANT = 'live4h';                      // Live-Logik mit 4H ab 2016
const WEEKS_BEFORE = 26, WEEKS_AFTER = 6;     // Wochentabelle rund um den gewählten Trade
const toBar = a => ({ d: a[0], o: a[1], h: a[2], l: a[3], c: a[4] });

/** Kurse aus dem historischen Lauf (vollständig, wie die Engine sie sieht), sonst Live-Backtest-Datei ab 2022. */
async function loadPrices(ticker) {
  try {
    const r = await fetch(`data/backtest_history/charts/${ticker}.json`, { cache: 'no-store' });
    if (r.ok) {
      const j = await r.json();
      return { source: 'historie', w: j.w.map(toBar), d: j.d.map(toBar), h: (j.h || []).map(toBar), top20: j.top20 || null };
    }
  } catch (e) { /* weiter mit Fallback */ }
  try {
    const slug = ticker.toLowerCase().replace(/[^a-z0-9]/g, '_');
    const r = await fetch(`data/backtest_${slug}.json`, { cache: 'no-store' });
    if (r.ok) { const j = await r.json(); return { source: 'live', w: j.ohlcv_w || [], d: j.ohlcv_d || [], h: j.ohlcv_4h || [], top20: null }; }
  } catch (e) { /* keine Kurse */ }
  return { source: null, w: [], d: [], h: [], top20: null };
}

function Tile({ label, value, color, sub }) {
  return (
    <div className="card" style={{ flex: '1 1 130px', minWidth: 120 }}>
      <div style={{ fontSize: 10, color: '#64748b', fontFamily: 'monospace', marginBottom: 4 }}>{label}</div>
      <div style={{ fontSize: 18, fontWeight: 700, color: color || '#e2e8f0', fontFamily: 'monospace' }}>{value}</div>
      {sub && <div style={{ fontSize: 10, color: '#64748b', fontFamily: 'monospace', marginTop: 4 }}>{sub}</div>}
    </div>
  );
}

/** Kerzenchart mit Einstieg/Ausstieg-Markern; optional Linien für Einstieg, Stopp und Ausstieg eines Trades. */
function Candles({ bars, trades, selected, onSelect, levels, height = 320, title }) {
  const W = 1000, H = height, PL = 8, PR = 64, PT = 12, PB = 24;
  if (!bars.length) return null;
  const lo = Math.min(...bars.map(b => b.l), ...(levels || []).map(l => l.v).filter(v => v != null));
  const hi = Math.max(...bars.map(b => b.h), ...(levels || []).map(l => l.v).filter(v => v != null));
  const useLog = hi / lo > 4;
  const f = v => (useLog ? Math.log(v) : v);
  const y = v => PT + (f(hi) - f(v)) / ((f(hi) - f(lo)) || 1) * (H - PT - PB);
  const cw = (W - PL - PR) / bars.length;
  const x = i => PL + (i + 0.5) * cw;
  const idxOf = d => (d < bars[0].d ? -1 : bars.findIndex(b => b.d >= d));
  const ticks = Array.from({ length: 5 }, (_, k) => (useLog ? Math.exp(f(lo) + (f(hi) - f(lo)) * k / 4) : lo + (hi - lo) * k / 4));
  const years = [];
  bars.forEach((b, i) => { if (i && b.d.slice(0, 4) !== bars[i - 1].d.slice(0, 4)) years.push([i, b.d.slice(0, 4)]); });
  const months = bars.length < 400 ? bars.map((b, i) => (i && b.d.slice(5, 7) !== bars[i - 1].d.slice(5, 7) ? [i, b.d.slice(0, 7)] : null)).filter(Boolean) : [];
  const gridX = months.length && months.length < 16 ? months : years;
  return (
    <div style={{ background: '#07090f', border: '1px solid #1e293b', borderRadius: 8, overflow: 'hidden', marginBottom: 14 }}>
      {title && <div style={{ fontSize: 11, color: '#94a3b8', fontFamily: 'monospace', padding: '8px 12px 0' }}>{title}{useLog ? ' · log. Skala' : ''}</div>}
      <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{ display: 'block' }}>
        {ticks.map((v, k) => (
          <g key={k}>
            <line x1={PL} x2={W - PR} y1={y(v)} y2={y(v)} stroke="#1e293b" strokeWidth="0.6"/>
            <text x={W - PR + 6} y={y(v) + 4} fill="#475569" fontSize="11" fontFamily="monospace">{price(v)}</text>
          </g>
        ))}
        {gridX.map(([i, label]) => (
          <g key={i}>
            <line x1={x(i)} x2={x(i)} y1={PT} y2={H - PB} stroke="#1e293b" strokeWidth="0.6"/>
            <text x={x(i) + 3} y={H - 8} fill="#475569" fontSize="10" fontFamily="monospace">{label}</text>
          </g>
        ))}
        {(trades || []).map((t, k) => {
          const a = idxOf(t.entryDate), b = t.isOpen ? bars.length - 1 : idxOf(t.exitDate);
          if (a < 0) return null;
          const sel = selected === t;
          return <rect key={'s' + k} x={x(a) - cw / 2} y={PT} width={Math.max(cw, ((b < 0 ? bars.length - 1 : b) - a + 1) * cw)}
            height={H - PT - PB} fill={t.pnl > 0 ? green : red} opacity={sel ? 0.16 : 0.06}
            style={{ cursor: 'pointer' }} onClick={() => onSelect && onSelect(t)}/>;
        })}
        {bars.map((b, i) => {
          const up = b.c >= b.o;
          return (
            <g key={i}>
              <line x1={x(i)} x2={x(i)} y1={y(b.h)} y2={y(b.l)} stroke={up ? '#22c55e' : '#ef4444'} strokeWidth={Math.max(0.6, Math.min(1.2, cw / 3))}/>
              {cw > 2.5 && <rect x={x(i) - cw * 0.35} width={cw * 0.7} y={y(Math.max(b.o, b.c))}
                height={Math.max(0.8, Math.abs(y(b.o) - y(b.c)))} fill={up ? '#22c55e' : '#ef4444'}/>}
            </g>
          );
        })}
        {(levels || []).filter(l => l.v != null).map((l, k) => (
          <g key={'l' + k}>
            <line x1={PL} x2={W - PR} y1={y(l.v)} y2={y(l.v)} stroke={l.color} strokeWidth="1.2" strokeDasharray={l.dash || ''}/>
            <text x={PL + 4} y={y(l.v) - 4} fill={l.color} fontSize="11" fontFamily="monospace">{l.label} {price(l.v)}</text>
          </g>
        ))}
        {(trades || []).map((t, k) => {
          const a = idxOf(t.entryDate), b = t.isOpen ? -1 : idxOf(t.exitDate);
          return (
            <g key={'m' + k} style={{ cursor: 'pointer' }} onClick={() => onSelect && onSelect(t)}>
              {a >= 0 && <polygon points={`${x(a)},${y(bars[a].l) + 4} ${x(a) - 5},${y(bars[a].l) + 13} ${x(a) + 5},${y(bars[a].l) + 13}`} fill={blue}/>}
              {b >= 0 && <polygon points={`${x(b)},${y(bars[b].h) - 4} ${x(b) - 5},${y(bars[b].h) - 13} ${x(b) + 5},${y(bars[b].h) - 13}`} fill={t.pnl > 0 ? green : red}/>}
            </g>
          );
        })}
      </svg>
    </div>
  );
}

/** Montag der Handelswoche einer Wochenzeile (Yahoo stempelt die historischen
    Wochenkerzen teils auf den Samstag davor). */
function mondayOf(row) {
  const d = new Date(row.week.d.slice(0, 10) + 'T12:00:00Z');
  for (let k = 0; k < 7 && d.getUTCDay() !== 1; k++) d.setUTCDate(d.getUTCDate() + 1);
  return d.toISOString().slice(0, 10);
}

/** Woche (Index in w), in der der Trade ausgelöst wurde: Signalwoche der Engine, sonst die Woche vor dem Einstieg. */
function signalWeekIdx(w, t) {
  if (t.weeklyDate) { const i = w.findIndex(b => b.d.slice(0, 10) === t.weeklyDate.slice(0, 10)); if (i >= 0) return i; }
  let i = w.findIndex(b => b.d > t.entryDate);
  i = i < 0 ? w.length - 1 : i - 1;
  return Math.max(0, i);
}

function App() {
  const params = new URLSearchParams(window.location.search);
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);
  const variant = VARIANT;
  const [ticker, setTicker] = useState((params.get('t') || '').toUpperCase());
  const [prices, setPrices] = useState(null);
  const [bench, setBench] = useState(null);
  const [selected, setSelected] = useState(null);
  const [selWeek, setSelWeek] = useState(null);
  const chartRef = useRef(null);
  const weekRowRefs = useRef({});

  useEffect(() => {
    fetch('data/backtest_history/ndx_results.json', { cache: 'no-store' })
      .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
      .then(setData).catch(e => setError(e.message));
    fetch('data/backtest_history/charts/_benchmark.json', { cache: 'no-store' })
      .then(r => (r.ok ? r.json() : null))
      .then(j => j && setBench({ label: j.ticker, w: j.w.map(toBar), d: j.d.map(toBar) })).catch(() => {});
  }, []);

  const v = data?.variants?.[variant];
  const tickers = useMemo(() => (v ? [...new Set(v.trades.map(t => t.ticker))].sort() : []), [v]);
  const active = tickers.includes(ticker) ? ticker : tickers[0];
  const trades = useMemo(() => (v && active ? v.trades.filter(t => t.ticker === active) : []), [v, active]);

  useEffect(() => {
    if (!active) return;
    const url = `?t=${encodeURIComponent(active)}&v=${variant}`;
    if (window.location.search !== url) window.history.replaceState(null, '', url);
    document.title = `RS · Historie ${active}`;
    setPrices(null);
    loadPrices(active).then(setPrices);
  }, [active, variant]);
  useEffect(() => { setSelected(trades.length ? trades[trades.length - 1] : null); }, [trades]);

  // Top-20-Historie dieses Titels (Engine-Format: Tag → [Ticker] oder [])
  const top20Hist = useMemo(() => {
    const ranges = prices?.top20?.inkl;
    if (!ranges || !data) return null;
    const hist = {};
    for (const b of prices.d) if (b.d >= data.period.start) hist[b.d] = ranges.some(([a, z]) => b.d >= a && b.d <= z) ? [active] : [];
    return hist;
  }, [prices, variant, data, active]);

  // Wochen rund um den gewählten Trade, exakt wie in der Engine berechnet
  const weekRows = useMemo(() => {
    if (!prices || !prices.w.length || !selected) return [];
    const a = signalWeekIdx(prices.w, selected);
    let b = selected.isOpen ? prices.w.length - 1 : prices.w.findIndex(x => x.d > selected.exitDate);
    b = b < 0 ? prices.w.length - 1 : b;
    return buildWeekRows(prices.w, prices.d, prices.h, Math.max(0, a - WEEKS_BEFORE), Math.min(prices.w.length - 1, b + WEEKS_AFTER));
  }, [prices, selected, variant]);

  useEffect(() => {
    if (!selected || !prices?.w.length) return;
    const i = signalWeekIdx(prices.w, selected);
    setSelWeek(i);
    setTimeout(() => weekRowRefs.current[i]?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 80);
  }, [selected, prices]);

  const sel = weekRows.find(r => r.i === selWeek) || null;
  const tradeMarkers = useMemo(() => trades.flatMap(t => [
    { date: t.entryDate, weeklyDate: t.weeklyDate, type: 'entry', stopPrice: t.stopPrice },
    ...(!t.isOpen ? [{ date: t.exitDate, type: 'exit', price: t.exitPrice }] : []),
  ]), [trades]);

  if (error) return <div style={{ padding: 60, color: red, fontFamily: 'monospace' }}>Fehler beim Laden: {error}</div>;
  if (!data) return <div style={{ padding: 60, color: '#475569', fontFamily: 'monospace' }}>Lade Ergebnisse…</div>;
  if (!v) return <div style={{ padding: 60, color: '#475569', fontFamily: 'monospace' }}>Variante nicht vorhanden.</div>;

  const pos = tickers.indexOf(active);
  const closed = trades.filter(t => !t.isOpen);
  const gain = trades.filter(t => t.pnl > 0).reduce((s, t) => s + t.pnl, 0);
  const loss = -trades.filter(t => t.pnl < 0).reduce((s, t) => s + t.pnl, 0);
  const pf = loss > 0 ? gain / loss : gain > 0 ? Infinity : null;
  const sumPnl = trades.reduce((s, t) => s + t.pnl, 0);
  const sumPct = trades.reduce((s, t) => s + t.pnlPct, 0);
  const winrate = closed.length ? closed.filter(t => t.pnl > 0).length / closed.length * 100 : null;
  const taken = trades.filter(t => t.taken);
  const isT20 = (row) => {
    if (!top20Hist) return null;
    const fri = new Date(row.weekEnd + 'T12:00:00Z');
    fri.setUTCDate(fri.getUTCDate() - 1);
    for (let k = 0; k < 7; k++) {          // letzter Handelstag der Woche
      const day = new Date(fri - k * 864e5).toISOString().slice(0, 10);
      if (top20Hist[day]) return top20Hist[day].length > 0;
    }
    return null;
  };
  const entryWeek = selected && prices?.w.length ? signalWeekIdx(prices.w, selected) : null;

  return (
    <div style={{ maxWidth: 1500, margin: '0 auto', padding: '28px 12px' }}>
      <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 6 }}>Historischer Backtest · Trades je Aktie prüfen</div>
      <div className="note" style={{ marginBottom: 14 }}>
        Alle Trades einer Aktie aus <a href="backtest_history.html" style={{ color: '#93c5fd' }}>B-HISTORIE</a>. Trade anklicken:
        die Wochentabelle zeigt die Wochen rund um den Trade mit den GWS-Punkten W / D / 4H, so wie die Engine sie zu
        diesem Zeitpunkt sah; Woche anklicken für Weekly-, Daily- und 4H-Chart mit Struktur. Einstieg zur Eröffnung nach
        dem Signal, Stopp am letzten Swing-Tief × 0,99.
        {' '}Live-Logik: Einstieg bei 3 von 3 Punkten (Weekly, Daily, 4H), ausgelöst über 4H.
      </div>

      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, alignItems: 'center', marginBottom: 10 }}>
        <button className="btn" disabled={pos <= 0} onClick={() => setTicker(tickers[pos - 1])}>◀</button>
        <select value={active || ''} onChange={e => setTicker(e.target.value)}>
          {tickers.map(t => <option key={t} value={t}>{t}</option>)}
        </select>
        <button className="btn" disabled={pos >= tickers.length - 1} onClick={() => setTicker(tickers[pos + 1])}>▶</button>
        <span className="note">{pos + 1} von {tickers.length} Aktien</span>
      </div>

      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 10, marginBottom: 14 }}>
        <Tile label="Trades" value={trades.length} sub={`${trades.length - closed.length} offen`} />
        <Tile label="Trefferquote" value={winrate != null ? num(winrate) + ' %' : '–'} sub="abgeschlossene" />
        <Tile label="Profit-Faktor" value={num(pf, 2)} color={pfColor(pf)} sub="inkl. offener" />
        <Tile label="Σ Rendite" value={pct(sumPct)} color={pnlColor(sumPct)} sub={`Ø ${pct(trades.length ? sumPct / trades.length : null)}`} />
        <Tile label="Σ P&L" value={eur(sumPnl)} color={pnlColor(sumPnl)} sub="10.000 € je Signal" />
        <Tile label="im Depot" value={`${taken.length} / ${trades.length}`}
          sub={`P&L Depot ${eur(taken.reduce((s, t) => s + (t.depotPnl || 0), 0))}`} />
      </div>

      {!prices && <div className="note" style={{ marginBottom: 14 }}>Lade Kurse…</div>}
      {prices && !prices.source && (
        <div className="card note" style={{ borderColor: '#92400e', marginBottom: 14 }}>Keine Kursdaten für {active} vorhanden.</div>
      )}
      {prices?.source === 'live' && (
        <div className="card note" style={{ borderColor: '#92400e', marginBottom: 14 }}>
          Die historischen Kurse fehlen noch — angezeigt werden die Live-Backtest-Kurse ab {prices.d[0]?.d ?? '–'}, die
          Punkte älterer Wochen sind daher nicht aussagekräftig. Vollständig nach dem nächsten Lauf des Workflows
          <b> „Historischer NASDAQ-100-Backtest (4H ab 2016)"</b>.
        </div>
      )}
      {prices?.w.length > 0 && (
        <Candles bars={prices.w} trades={trades} selected={selected} onSelect={setSelected} height={260}
          title={`${active} · alle Trades · ▲ Einstieg · ▼ Ausstieg (grün Gewinn, rot Verlust) · Bereich anklicken`} />
      )}

      <div className="desktop-layout">
        <div className="desktop-left">
          <div style={{ background: '#0a101e', border: '1px solid #1e293b', borderRadius: 10, overflow: 'auto', maxHeight: 320, marginBottom: 10 }}>
            <table>
              <thead><tr>
                <th>Einstieg</th><th>TF</th><th>Rang</th><th>Kurs</th><th>Stopp</th><th>Ausstieg</th><th>Kurs</th><th>W</th><th>Rendite</th><th>Depot</th>
              </tr></thead>
              <tbody>
                {[...trades].reverse().map((t, i) => (
                  <tr key={i} className={`data-row${selected === t ? ' selected' : ''}`} onClick={() => setSelected(t)}>
                    <td>{t.entryDate}</td>
                    <td style={{ color: t.trigger === '4H' ? '#a78bfa' : t.trigger === 'D' ? '#38bdf8' : amber, fontWeight: 700 }}>{t.trigger}</td>
                    <td style={{ color: '#94a3b8' }}>{t.rank <= 20 ? t.rank : '–'}</td>
                    <td>{price(t.entryPrice)}</td>
                    <td style={{ color: red }}>{price(t.stopPrice)}</td>
                    <td style={{ color: t.isOpen ? amber : '#e2e8f0' }}>{t.isOpen ? 'offen' : t.exitDate}{t.dataEnded ? ' ·DE' : ''}</td>
                    <td>{price(t.exitPrice)}</td>
                    <td>{t.holdingWeeks}</td>
                    <td style={{ color: pnlColor(t.pnlPct), fontWeight: 700 }}>{pct(t.pnlPct)}</td>
                    <td style={{ color: t.taken ? green : '#64748b' }}>{t.taken ? eur(t.depotPnl) : 'ausgel.'}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          <div style={{ background: '#0a0f1e', border: '1px solid #1e293b', borderRadius: 10, overflow: 'hidden' }}>
            <div style={{ display: 'grid', gridTemplateColumns: '78px 92px 72px 36px 36px 36px 40px 1fr', padding: '7px 12px',
              background: '#0f172a', borderBottom: '1px solid #1e293b', fontSize: 10, fontWeight: 700, color: '#475569', fontFamily: 'monospace' }}>
              <span>KW</span><span>Woche ab</span><span style={{ textAlign: 'right' }}>Close</span>
              <span style={{ textAlign: 'center' }}>W</span><span style={{ textAlign: 'center' }}>D</span>
              <span style={{ textAlign: 'center' }}>4H</span><span style={{ textAlign: 'center' }}>T20</span><span></span>
            </div>
            <div style={{ maxHeight: '62vh', overflowY: 'auto' }}>
              {!weekRows.length && <div className="note" style={{ padding: 14 }}>{prices ? 'Trade wählen.' : 'Lade …'}</div>}
              {[...weekRows].reverse().map(row => {
                const isSel = selWeek === row.i;
                const t20 = isT20(row);
                const entryHere = trades.some(t => signalWeekIdx(prices.w, t) === row.i);
                const exitHere = trades.some(t => !t.isOpen && row.week.d <= t.exitDate && t.exitDate <= row.weekEnd);
                const bg = row.pts >= 3 ? '#0a1a0a' : row.pts >= 2 ? '#1a1200' : row.pts === 1 ? '#0f0f0f' : '#060b14';
                const bl = row.pts >= 3 ? '3px solid #4ade80' : row.pts >= 2 ? '3px solid #fbbf24' : row.pts >= 1 ? '3px solid #334155' : '3px solid transparent';
                return (
                  <div key={row.i} ref={el => (weekRowRefs.current[row.i] = el)} className="tbl-row"
                    onClick={() => { setSelWeek(row.i); setTimeout(() => chartRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50); }}
                    style={{ display: 'grid', gridTemplateColumns: '78px 92px 72px 36px 36px 36px 40px 1fr', padding: '5px 12px',
                      alignItems: 'center', borderBottom: '1px solid #0f172a',
                      background: isSel ? '#1a2f4a' : bg, borderLeft: isSel ? '3px solid #3b82f6' : bl }}>
                    <span style={{ fontFamily: 'monospace', fontSize: 11, color: isSel ? '#93c5fd' : '#64748b' }}>KW {row.kw}/{String(row.year).slice(2)}</span>
                    <span style={{ fontFamily: 'monospace', fontSize: 11, color: '#94a3b8' }}>{mondayOf(row)}</span>
                    <span style={{ fontFamily: 'monospace', fontSize: 11, textAlign: 'right', color: '#cbd5e1', fontWeight: 600 }}>{price(row.week.c)}</span>
                    <span style={{ textAlign: 'center' }}><PktDot val={row.pW} has={true}/></span>
                    <span style={{ textAlign: 'center' }}><PktDot val={row.pD} has={row.dSlice.length >= 10}/></span>
                    <span style={{ textAlign: 'center' }}><PktDot val={row.p4H} has={row.has4h}/></span>
                    <span style={{ textAlign: 'center', fontFamily: 'monospace', fontSize: 9, fontWeight: 700,
                      color: t20 ? green : '#334155' }}>{t20 == null ? '–' : t20 ? 'T20' : '·'}</span>
                    <span style={{ fontFamily: 'monospace', fontSize: 10, textAlign: 'right' }}>
                      {entryHere && <span style={{ color: blue }}>▲ Signal </span>}
                      {exitHere && <span style={{ color: amber }}>▼ Ausstieg</span>}
                    </span>
                  </div>
                );
              })}
            </div>
          </div>
        </div>

        <div className="desktop-right" ref={chartRef}>
          {sel ? (
            <div>
              <div style={{ background: '#0f172a', border: '1px solid #1e293b', borderRadius: 10, padding: '10px 14px', marginBottom: 12,
                display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap' }}>
                <span style={{ fontFamily: 'monospace', fontSize: 14, fontWeight: 800, color: '#f1f5f9' }}>{active} · KW {sel.kw} / {sel.year}</span>
                <span style={{ fontFamily: 'monospace', fontSize: 11, color: '#64748b' }}>{mondayOf(sel)} – {sel.weekEnd}</span>
                {sel.i === entryWeek && <span style={{ fontFamily: 'monospace', fontSize: 11, color: blue }}>Signalwoche · Einstieg {selected.entryDate} zu {price(selected.entryPrice)}</span>}
                <span style={{ fontFamily: 'monospace', fontSize: 12, color: '#cbd5e1', marginLeft: 'auto' }}>Close: <strong>{price(sel.week.c)}</strong></span>
                {[['W', sel.pW, true], ['D', sel.pD, sel.dSlice.length >= 10], ['4H', sel.p4H, sel.has4h]].map(([lbl, val, has]) => (
                  <span key={lbl} style={{ fontFamily: 'monospace', fontSize: 11, color: !has ? '#334155' : val ? '#4ade80' : '#ef4444' }}>
                    {lbl}: {!has ? '–' : val ? '✓' : '✗'}
                  </span>
                ))}
                <PktBadge pts={sel.pts} has4h={sel.has4h}/>
              </div>
              <div className="charts-grid">
                {sel.wSlice.length >= 8 ? (
                  <ChartWeekly ohlcvW={sel.wSlice} structureW={sel.structW} chartId={`h_w_${sel.i}`}
                    benchOhlcv={bench?.w} benchLabel={bench?.label} tradeMarkers={tradeMarkers}/>
                ) : <div className="note card">Zu wenig Weekly-Daten</div>}
                {sel.dSlice.length >= 10 ? (
                  <CandleChart ohlcv={sel.dSlice} structure={sel.structD} chartId={`h_d_${sel.i}`}
                    benchOhlcv={bench?.d} benchLabel={bench?.label} tradeMarkers={tradeMarkers}/>
                ) : <div className="note card">Keine Daily-Daten für diese Woche</div>}
                {sel.has4h && sel.struct4H ? (
                  <div className="chart-full-width">
                    <Chart4H ohlcv4h={sel.h4Slice} structure4h={sel.struct4H} chartId={`h_4h_${sel.i}`}
                      tradeMarkers={tradeMarkers.filter(m => m.type === 'entry')}/>
                  </div>
                ) : (
                  <div className="chart-full-width card note" style={{ textAlign: 'center' }}>
                    Keine 4H-Kerzen für diese Woche (4H über Alpaca erst ab 2016)
                  </div>
                )}
              </div>
              <p style={{ fontSize: 10, color: '#334155', marginTop: 8, fontFamily: 'monospace', textAlign: 'center' }}>
                Daten geschnitten auf KW {sel.kw}/{sel.year} ({sel.weekEnd}) · W: {sel.wSlice.length} · D: {sel.dSlice.length} · 4H: {sel.h4Slice.length} Kerzen
              </p>
            </div>
          ) : (
            <div className="card note" style={{ padding: '40px 24px', textAlign: 'center' }}>← Trade oder Woche anklicken</div>
          )}
        </div>
      </div>

      <div className="note" style={{ marginTop: 16 }}>
        Kurse split- und dividendenbereinigt (Yahoo Finance), 4H über Alpaca. Rang = Platz in den Top 20 des NASDAQ-100
        am Einstiegstag (nur unter den damaligen Mitgliedern gerankt). T20 = am letzten Handelstag der Woche in den Top 20.
        Depot = Ergebnis in der Depot-Simulation, „ausgel." wenn alle Plätze belegt waren. DE = Datenende (Übernahme, Delisting).
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
