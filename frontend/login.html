<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RS Platform · Login</title>
  <script src="/api.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0f1e;
      color: #e2e8f0;
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 380px;
    }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 6px; color: #f1f5f9; }
    .subtitle { font-size: 13px; color: #64748b; margin-bottom: 32px; }
    label {
      display: block;
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    input {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #e2e8f0;
      font-size: 14px;
      padding: 10px 14px;
      margin-bottom: 18px;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: #3b82f6; }
    button {
      width: 100%;
      background: #2563eb;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      padding: 11px;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 4px;
    }
    button:hover:not(:disabled) { background: #1d4ed8; }
    button:disabled { background: #1e3a5f; cursor: not-allowed; color: #64748b; }
    .error {
      background: #450a0a;
      border: 1px solid #7f1d1d;
      border-radius: 6px;
      color: #fca5a5;
      font-size: 13px;
      padding: 10px 14px;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>RS Platform</h1>
    <p class="subtitle">Relative Strength · Trading Signals</p>
    <div class="error" id="err"></div>
    <form id="form">
      <label>E-Mail</label>
      <input type="email" id="email" autocomplete="email" required placeholder="name@example.com">
      <label>Passwort</label>
      <input type="password" id="password" autocomplete="current-password" required placeholder="••••••••">
      <button type="submit" id="btn">Einloggen</button>
      <a href="/forgot.html" style="display:block;text-align:center;margin-top:14px;font-size:13px;color:#64748b;text-decoration:none">Passwort vergessen?</a>
    </form>
  </div>
  <script>
    // Ziel-Pfad nach dem Login (z. B. aus dem Telegram-Deep-Link). Nur
    // app-interne Pfade zulassen — schützt vor Open-Redirect.
    var _params = new URLSearchParams(location.search);
    var _next   = _params.get('next') || '/';
    if (!/^\/(?!\/)/.test(_next)) _next = '/';

    // Auto-Login per Deep-Link (?auth=<token>): Token verifizieren, übernehmen
    // und direkt zum Ziel weiterleiten — kein manuelles Anmelden nötig.
    var _auth = _params.get('auth');
    if (_auth) {
      document.body.style.visibility = 'hidden';
      fetch('/api/user/me', { headers: { 'Authorization': 'Bearer ' + _auth } })
        .then(function(r) { return r.ok ? r.json() : null; })
        .then(function(d) {
          if (d && d.email) {
            localStorage.setItem('rs_token', _auth);
            localStorage.setItem('rs_email', d.email);
            location.replace(_next);
          } else {
            document.body.style.visibility = '';   // Token ungültig → Formular zeigen
          }
        })
        .catch(function() { document.body.style.visibility = ''; });
    } else if (localStorage.getItem('rs_token')) {
      window.location.href = _next;
    }
    document.getElementById('form').addEventListener('submit', async function(e) {
      e.preventDefault();
      var btn = document.getElementById('btn');
      var err = document.getElementById('err');
      btn.disabled = true;
      btn.textContent = 'Einloggen...';
      err.style.display = 'none';
      try {
        var r = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
          })
        });
        var data = await r.json();
        if (!r.ok) throw new Error(data.detail || 'Login fehlgeschlagen');
        localStorage.setItem('rs_token', data.token);
        localStorage.setItem('rs_email', data.email);
        window.location.href = _next;
      } catch(ex) {
        err.textContent = ex.message;
        err.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Einloggen';
      }
    });
  </script>
</body>
</html>
