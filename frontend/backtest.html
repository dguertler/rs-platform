  <script src="api.js?v=20260922"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #060b14; color: #e2e8f0; font-family: 'Inter', system-ui, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0a0f1e; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
    select, button { outline: none; }
    .chart-wrap { position: relative; }
    .chart-wrap svg { display: block; }
    .charts-grid { display:flex; flex-direction:column; gap:10px; }
    @media (min-width:768px) {
      .charts-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
      .chart-full-width { grid-column:1/-1; }
    }
    @media (min-width:1100px) {
      .desktop-layout { display:flex; flex-direction:row; align-items:flex-start; gap:16px; }
      .desktop-left  { width:560px; flex-shrink:0; }
      .desktop-right { flex:1; min-width:0; position:sticky; top:16px; align-self:flex-start; }
    }
    .nav-bar { display:inline-flex; align-items:center; gap:5px; padding:12px 12px 0; }
    .nav-switch { display:inline-flex; align-items:center; gap:6px; background:#1e293b; border:1px solid #334155; border-radius:8px; padding:6px 13px; font-size:12px; font-weight:700; color:#94a3b8; text-decoration:none; font-family:monospace; white-space:nowrap; box-shadow:0 2px 8px #00000066; transition:border-color .15s,color .15s; }
    .nav-switch:hover  { border-color:#3b82f6; color:#e2e8f0; }
    .nav-switch.active { border-color:#f59e0b; color:#fbbf24; background:#1a1a0a; }
    .tbl-row { cursor:pointer; transition:background .1s; }
    .tbl-row:hover { background:#1e293b !important; }
    .dot { display:inline-block; width:9px; height:9px; border-radius:50%; }
  </style>
</head>

<div class="nav-bar">
  <a href="index.html"  class="nav-switch">Nasdaq</a>
  <a href="sp500.html"  class="nav-switch">S&amp;P500</a>
  <a href="smallcap.html" class="nav-switch">SC600</a>
  <a href="backtest_overview.html" class="nav-switch">B-ÜBERSICHT</a>
  <a href="backtest.html" class="nav-switch active">B-DETAILS</a>
  <a href="backtest_history.html" class="nav-switch">B-HISTORIE</a>
  <a href="backtest_history_details.html" class="nav-switch">B-DETAILS 2</a>
  <a href="v2.html" class="nav-switch" style="border-color:#22c55e;color:#4ade80;">RS-Platform 2.0</a>
</div>
<div id="root"></div>
<script>
  window.apiFetch = function (url, opts) { return fetch(url, opts || {}); };
</script>
<script type="text/babel">
const { useState, useMemo, useRef, useCallback, useEffect } = React;

// ── GWS-D Analyse (korrekte Down-Retracement Logik) ──────────────────────────
//
// Ein Down-Retracement entsteht ERST wenn ein vorheriges Swing-Tief unterschritten wird.
// Das GWS-D ist dann das HÖCHSTE Hoch zwischen dem alten Tief und dem neuen tieferen Tief.
//
// Ablauf:
//   1. Sequenz von Swing-Hochs und Swing-Tiefs ermitteln
//   2. Suche tiefere Tiefs (jedes Swing-Tief, das ein vorheriges Swing-Tief unterschreitet)
//   3. Für jedes tiefere Tief: GWS-D = höchstes Hoch zwischen dem alten Tief und dem neuen Tief
//   4. Aktuelles GWS-D = letztes so ermitteltes Hoch
//   5. Bullish = Close über GWS-D Preis
// ── Analyse- und Simulationsfunktionen → backtest_logic.js ───────────────────

// ── Backtest App ────────────────────────────────────────────────────────────
function BacktestApp() {
  const [data,        setData]        = useState(null);
  const [ticker,      setTicker]      = useState('SNDK');
  const [loadError,   setLoadError]   = useState(null);
  const [loading,     setLoading]     = useState(true);
  const [selectedIdx, setSelectedIdx] = useState(null);
  const [top20Hist,   setTop20Hist]   = useState(null);
  const [useTop20,    setUseTop20]    = useState(() => localStorage.getItem('bt_use_top20') !== 'false');
  const [benchData,   setBenchData]   = useState(null);
  const chartRef     = useRef(null);
  const weekTableRef = useRef(null);
  const weekRowRefs  = useRef({});

  useEffect(() => {
    const params      = new URLSearchParams(window.location.search);
    const t           = (params.get('t') || localStorage.getItem('bt_last_ticker') || 'SNDK').toUpperCase();
    localStorage.setItem('bt_last_ticker', t);
    setTicker(t);
    document.title    = `RS · Backtest ${t}`;
    const slug        = t.toLowerCase().replace(/[^a-z0-9]/g, '_');
    const jsonFile    = `data/backtest_${slug}.json`;

    window.apiFetch(jsonFile)
      .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
      .then(d => {
        const ohlcv_w = (d.ohlcv_w || []).slice(-104);
        const cutDate = ohlcv_w[0]?.d ?? '2000-01-01';
        setData({
          ...d,
          ohlcv_w,
          ohlcv_d:  (d.ohlcv_d  || []).filter(x => x.d >= cutDate),
          ohlcv_4h: (d.ohlcv_4h || []).filter(x => x.d.slice(0,10) >= cutDate),
        });
        setLoading(false);
      })
      .catch(() => {
        // Fallback: Daten aus den RS-JSON-Dateien laden
        const sources = ['data/rs_full.json', 'data/rs_sp500.json'];
        Promise.any(
          sources.map(src =>
            window.apiFetch(src)
              .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP error')))
              .then(d => {
                const entry = (d.data || []).find(e => e.ticker === t);
                if (!entry) throw new Error('not found');
                return {
                  ohlcv_w:   entry.ohlcv_w  || [],
                  ohlcv_d:   entry.ohlcv    || [],
                  ohlcv_4h:  entry.ohlcv_4h || [],
                  generated: d.generated    || '–',
                };
              })
          )
        )
        .then(d => { setData(d); setLoading(false); })
        .catch(e => { setLoadError(e.message); setLoading(false); });
    });

    // Benchmark (QQQ) OHLCV für Chart-Hintergrundlinie laden
    window.apiFetch('data/rs_full.json')
      .then(r => r.ok ? r.json() : null)
      .then(d => {
        if (d) setBenchData({
          benchmark:         d.benchmark         || 'QQQ',
          benchmark_ohlcv_w: d.benchmark_ohlcv_w || [],
          benchmark_ohlcv:   d.benchmark_ohlcv   || [],
        });
      })
      .catch(() => {});

    // top20_history immer laden – unabhängig ob backtest-JSON oder rs-JSON
    const rsFiles = ['data/rs_full.json', 'data/rs_sp500.json'];
    Promise.any(rsFiles.map(f =>
      window.apiFetch(f).then(r => r.ok ? r.json() : Promise.reject())
        .then(d => {
          if (!(d.data || []).find(e => e.ticker === t)) throw new Error('not found');
          if (!d.top20_history) throw new Error('no history');
          return d.top20_history;
        })
    )).then(h => setTop20Hist(h)).catch(() => setTop20Hist(null));
  }, []);

  // ── Pre-Compute aller Wochen mit historisch korrekt geschnittenen Daten ──
  const weekRows = useMemo(() => {
    if (!data) return [];
    return buildWeekRows(data.ohlcv_w, data.ohlcv_d, data.ohlcv_4h);
  }, [data]);

  const sel = selectedIdx !== null ? weekRows[selectedIdx] : null;

  // ── Trade-Simulation ──────────────────────────────────────────────────────
  const CAPITAL  = 10000;
  const MAX_RISK = 1000;

  const trades = useMemo(() => {
    if (!data) return [];
    return simulateTrades(weekRows, data.ohlcv_d, ticker, top20Hist, useTop20);
  }, [weekRows, data, top20Hist, useTop20]);

  // Eine einzige KPI-Definition für Detail- und Übersichtsseite (backtest_logic.js),
  // damit insbesondere der Profitfaktor überall gleich gerechnet wird.
  const kpis = useMemo(() => calcKpis(trades), [trades]);

  const tradeMarkers = useMemo(() =>
    trades.flatMap(t => [
      { date: t.entryDate, weeklyDate: t.weeklyDate, type: 'entry', stopPrice: t.stopPrice },
      ...(!t.isOpen ? [{ date: t.exitDate, type: 'exit', price: t.exitPrice }] : []),
    ]),
  [trades]);

  const handleRowClick = (i) => {
    setSelectedIdx(prev => prev === i ? null : i);
    setTimeout(() => chartRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
  };

  const handleTradeClick = (t) => {
    const target = t.weeklyDate?.slice(0,10);
    const row = weekRows.find(r => r.week.d.slice(0,10) === target);
    if (!row) return;
    setSelectedIdx(row.i);
    setTimeout(() => {
      const el = weekRowRefs.current[row.i];
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 50);
  };

  // Neueste zuerst
  const tableRows = [...weekRows].reverse();

  if (loading) return (
    <div style={{padding:'80px 24px',textAlign:'center',color:'#475569',fontFamily:'monospace'}}>
      Lade {ticker} …
    </div>
  );

  if (loadError) return (
    <div style={{padding:'80px 24px',textAlign:'center',fontFamily:'monospace'}}>
      <div style={{color:'#f87171',fontSize:15,marginBottom:16}}>Keine Daten gefunden</div>
      <div style={{color:'#64748b',fontSize:13,marginBottom:8}}>Bitte zuerst ausführen:</div>
      <code style={{background:'#1e293b',color:'#fbbf24',padding:'8px 18px',borderRadius:6,fontSize:13,display:'inline-block'}}>
        python3 load_backtest.py
      </code>
      <div style={{color:'#334155',fontSize:11,marginTop:12}}>({loadError})</div>
    </div>
  );

  return (
    <div style={{padding:'56px 12px 32px'}}>

      {/* ── Header ── */}
      <div style={{marginBottom:14,display:'flex',alignItems:'center',gap:16,flexWrap:'wrap'}}>
        <div>
          <span style={{fontSize:20,fontWeight:800,color:'#f1f5f9',fontFamily:'monospace'}}>{ticker}</span>
          <span style={{fontSize:12,color:'#475569',marginLeft:10,fontFamily:'monospace'}}>Backtest · historische GWS-Punkte</span>
        </div>
        <button onClick={() => { const v = !useTop20; setUseTop20(v); localStorage.setItem('bt_use_top20', v); }}
          style={{ background: useTop20 ? '#14532d' : 'transparent',
            border: `1px solid ${useTop20 ? '#4ade80' : '#334155'}`,
            borderRadius: 6, padding: '5px 14px', color: useTop20 ? '#4ade80' : '#475569',
            fontFamily: 'monospace', fontSize: 12, fontWeight: 700, cursor: 'pointer' }}>
          TOP 20 {useTop20 ? 'AN' : 'AUS'}
        </button>
        <div style={{marginLeft:'auto',fontSize:11,color:'#334155',fontFamily:'monospace'}}>
          {weekRows.length} Wochen · Stand {data.generated}
        </div>
      </div>

      <div style={{marginBottom:10,fontSize:11,color:'#475569',fontFamily:'monospace'}}>
        Legende:&nbsp;
        <span className="dot" style={{background:'#4ade80',display:'inline-block',verticalAlign:'middle'}}/> = GWS gebrochen &nbsp;
        <span className="dot" style={{background:'#1e293b',border:'1px solid #334155',display:'inline-block',verticalAlign:'middle'}}/> = kein Bruch &nbsp;
        <span style={{color:'#94a3b8'}}>* = kein 4H-Daten für diese Woche</span>
      </div>

      {/* ── KPI-Boxen + Equity-Kurve ── */}
      {kpis && (
        <div style={{marginBottom:12}}>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(110px,1fr))',gap:6,marginBottom:8}}>
            {[
              ['Trades',        trades.length,                                                              '',  '#94a3b8'],
              ['Winrate',       kpis.winrate.toFixed(0),                                                    '%', kpis.winrate >= 50 ? '#4ade80' : '#f87171'],
              ['Profit Faktor', kpis.profitFactor != null ? kpis.profitFactor.toFixed(2) : '∞',             '',  kpis.profitFactor == null || kpis.profitFactor >= 1 ? '#4ade80' : '#f87171'],
              ['Max Drawdown',  kpis.maxDD.toFixed(1),                                                      '%', '#f87171'],
              ['Ø Win',         '+' + fmtK(kpis.avgWin) + '€',                                            '',  '#4ade80'],
              ['Ø Loss',        '−' + fmtK(kpis.avgLoss) + '€',                                           '',  '#f87171'],
              ['Gesamtgewinn',  (kpis.gesamtGewinn >= 0 ? '+' : '−') + fmtK(kpis.gesamtGewinn) + '€',   '', kpis.gesamtGewinn >= 0 ? '#4ade80' : '#f87171'],
            ].map(([label, val, unit, color]) => (
              <div key={label} style={{background:'#0a0f1e',border:'1px solid #1e293b',borderRadius:8,padding:'8px 10px',fontFamily:'monospace'}}>
                <div style={{fontSize:9,color:'#475569',marginBottom:3,letterSpacing:'0.04em'}}>{label}</div>
                <div style={{fontSize:17,fontWeight:800,color,lineHeight:1}}>
                  {val}<span style={{fontSize:10,fontWeight:400}}>{unit}</span>
                </div>
              </div>
            ))}
          </div>
          {kpis.equityCurve.length > 1 && <EquityCurve curve={kpis.equityCurve}/>}
        </div>
      )}
      {!kpis && weekRows.length > 0 && (
        <div style={{marginBottom:10,fontSize:11,color:'#475569',fontFamily:'monospace',
          background:'#0a0f1e',border:'1px solid #1e293b',borderRadius:8,padding:'10px 14px'}}>
          Keine abgeschlossenen Trades im Datenzeitraum
        </div>
      )}

      <div className="desktop-layout">

        {/* ── Linke Spalte: Trade-Liste + Tabelle ── */}
        <div className="desktop-left">

          {/* Trade-Liste */}
          {trades.length > 0 && (
            <div style={{marginBottom:10}}>
              <div style={{background:'#0a0f1e',border:'1px solid #1e293b',borderRadius:10,overflowX:'auto'}}>
                <div style={{minWidth:540}}>
                  <div style={{display:'grid',gridTemplateColumns:'80px 24px 72px 84px 72px 72px 62px 52px',
                    gap:0,background:'#0f172a',borderBottom:'1px solid #1e293b',padding:'6px 12px',
                    fontSize:10,fontWeight:700,color:'#475569',fontFamily:'monospace',letterSpacing:'0.04em'}}>
                    <span>Entry</span><span>TF</span>
                    <span style={{textAlign:'right'}}>Entry €</span>
                    <span style={{textAlign:'right'}}>Exit</span>
                    <span style={{textAlign:'right'}}>Exit €</span>
                    <span style={{textAlign:'right'}}>Gewinn</span>
                    <span style={{textAlign:'right'}}>Rendite</span>
                    <span style={{textAlign:'right'}}>W</span>
                  </div>
                  {[...trades].reverse().map((t, i) => (
                    <div key={i} onClick={() => handleTradeClick(t)}
                      style={{display:'grid',gridTemplateColumns:'80px 24px 72px 84px 72px 72px 62px 52px',
                      gap:0,padding:'5px 12px',borderBottom:'1px solid #0f172a',alignItems:'center',
                      cursor:'pointer',
                      background: t.isOpen ? '#0a1520' : t.isWin ? '#061206' : '#120606'}}>
                      <span style={{fontFamily:'monospace',fontSize:11,color:'#94a3b8'}}>{t.entryDate}</span>
                      <span style={{fontFamily:'monospace',fontSize:10,fontWeight:700,
                        color: t.trigger==='4H'?'#a78bfa':t.trigger==='D'?'#38bdf8':'#fbbf24'}}>{t.trigger}</span>
                      <span style={{textAlign:'right',fontFamily:'monospace',fontSize:11,color:'#cbd5e1'}}>{t.entryPrice.toFixed(2)}</span>
                      <span style={{textAlign:'right',fontFamily:'monospace',fontSize:11,color:t.isOpen?'#fbbf24':'#94a3b8'}}>
                        {t.isOpen ? 'offen ◆' : t.exitDate}
                      </span>
                      <span style={{textAlign:'right',fontFamily:'monospace',fontSize:11,color:t.isOpen?'#fbbf24':'#cbd5e1'}}>
                        {t.exitPrice.toFixed(2)}
                      </span>
                      <span style={{textAlign:'right',fontFamily:'monospace',fontSize:11,fontWeight:700,color:t.pnl>=0?'#4ade80':'#f87171'}}>
                        {t.pnl>=0?'+':'−'}{fmtK(t.pnl)}€
                      </span>
                      <span style={{textAlign:'right',fontFamily:'monospace',fontSize:11,color:t.pnlPct>=0?'#4ade80':'#f87171'}}>
                        {t.pnlPct>=0?'+':''}{t.pnlPct.toFixed(1)}%
                      </span>
                      <span style={{textAlign:'right',fontFamily:'monospace',fontSize:11,color:'#475569'}}>{t.holdingWeeks}W</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          <div style={{background:'#0a0f1e',border:'1px solid #1e293b',borderRadius:10,overflow:'hidden'}}>

            {/* Tabellen-Header */}
            <div style={{display:'grid',gridTemplateColumns:'72px 96px 72px 36px 36px 36px 40px',gap:0,
              background:'#0f172a',borderBottom:'1px solid #1e293b',padding:'7px 12px',
              fontSize:10,fontWeight:700,color:'#475569',fontFamily:'monospace',letterSpacing:'0.05em'}}>
              <span>KW</span><span>Datum</span><span style={{textAlign:'right'}}>Close</span>
              <span style={{textAlign:'center'}}>W</span>
              <span style={{textAlign:'center'}}>D</span>
              <span style={{textAlign:'center'}}>4H</span>
              <span style={{textAlign:'center'}}>T20</span>
            </div>

            {/* Scroll-Container */}
            <div ref={weekTableRef} style={{maxHeight:'75vh',overflowY:'auto',scrollbarGutter:'stable'}}>
              {tableRows.map(row => {
                const isSel = selectedIdx === row.i;
                const bgPts = row.pts >= 3 ? '#0a1a0a'
                            : row.pts === 2 && row.has4h ? '#1a1200'
                            : row.pts >= 2 ? '#1a1200'
                            : row.pts === 1 ? '#0f0f0f'
                            : '#060b14';
                const borderLeft = row.pts >= 3 ? '3px solid #4ade80'
                                 : row.pts >= 2 ? '3px solid #fbbf24'
                                 : row.pts >= 1 ? '3px solid #334155'
                                 : '3px solid transparent';
                const fri = new Date(row.weekEnd + 'T12:00:00Z');
                fri.setUTCDate(fri.getUTCDate() - 1);
                const friStr = fri.toISOString().slice(0,10);
                const isT20 = top20Hist ? (top20Hist[friStr] || []).includes(ticker) : null;
                return (
                  <div key={row.i}
                    ref={el => weekRowRefs.current[row.i] = el}
                    className="tbl-row"
                    onClick={() => handleRowClick(row.i)}
                    style={{
                      display:'grid', gridTemplateColumns:'72px 96px 72px 36px 36px 36px 40px',
                      gap:0, padding:'5px 12px',
                      background: isSel ? '#1a2f4a' : bgPts,
                      borderLeft: isSel ? '3px solid #3b82f6' : borderLeft,
                      borderBottom:'1px solid #0f172a',
                      alignItems:'center'
                    }}>
                    <span style={{fontFamily:'monospace',fontSize:11,color: isSel?'#93c5fd':'#64748b'}}
                      title={`W:${row.structW?.broken} D:${row.structD?.broken} 4H:${row.struct4H?.broken4h} | dSlice:${row.dSlice.length} gwsD:${row.structD?.gwsdHigh?.price}`}>
                      KW {row.kw} / {row.year}
                    </span>
                    <span style={{fontFamily:'monospace',fontSize:11,color: isSel?'#e2e8f0':'#94a3b8'}}>
                      {row.week.d}
                    </span>
                    <span style={{fontFamily:'monospace',fontSize:11,textAlign:'right',
                      color: isSel?'#e2e8f0':'#cbd5e1', fontWeight:600}}>
                      {row.week.c.toFixed(2)}
                    </span>
                    <span style={{textAlign:'center'}}><PktDot val={row.pW}  has={true}/></span>
                    <span style={{textAlign:'center'}}><PktDot val={row.pD}  has={row.dSlice.length >= 10}/></span>
                    <span style={{textAlign:'center'}}><PktDot val={row.p4H} has={row.has4h}/></span>
                    <span style={{textAlign:'center'}}>
                      {isT20 === null ? <span style={{color:'#334155',fontSize:9}}>–</span>
                        : isT20 ? <span style={{color:'#4ade80',fontSize:9,fontWeight:700,fontFamily:'monospace'}}>T20</span>
                        : <span style={{color:'#1e293b',fontSize:9}}>·</span>}
                    </span>
                  </div>
                );
              })}
            </div>
          </div>
        </div>

        {/* ── Rechte Spalte: Charts ── */}
        <div className="desktop-right" ref={chartRef}>
          {sel ? (
            <div>
              {/* Ausgewählte Woche Info */}
              <div style={{background:'#0f172a',border:'1px solid #1e293b',borderRadius:10,
                padding:'10px 14px',marginBottom:12,display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}>
                <span style={{fontFamily:'monospace',fontSize:14,fontWeight:800,color:'#f1f5f9'}}>
                  {ticker} · KW {sel.kw} / {sel.year}
                </span>
                <span style={{fontFamily:'monospace',fontSize:11,color:'#64748b'}}>{sel.week.d}</span>
                <span style={{fontFamily:'monospace',fontSize:12,color:'#cbd5e1',marginLeft:'auto'}}>
                  Close: <strong>{sel.week.c.toFixed(2)}</strong>
                </span>
                <div style={{display:'flex',gap:10,alignItems:'center'}}>
                  {[['W', sel.pW, true],['D', sel.pD, sel.dSlice.length >= 10],['4H', sel.p4H, sel.has4h]].map(([lbl,val,has]) => (
                    <span key={lbl} style={{fontFamily:'monospace',fontSize:11,
                      color: !has ? '#334155' : val ? '#4ade80' : '#ef4444'}}>
                      {lbl}: {!has ? '–' : val ? '✓' : '✗'}
                    </span>
                  ))}
                  <span style={{marginLeft:4}}><PktBadge pts={sel.pts} has4h={sel.has4h}/></span>
                </div>
              </div>

              <div className="charts-grid">
                {/* Weekly Chart */}
                {sel.wSlice.length >= 8 ? (
                  <ChartWeekly
                    ohlcvW={sel.wSlice}
                    structureW={sel.structW}
                    chartId={`bt_w_${sel.i}`}
                    benchOhlcv={benchData?.benchmark_ohlcv_w}
                    benchLabel={benchData?.benchmark}
                    tradeMarkers={tradeMarkers}/>
                ) : (
                  <div style={{background:'#07090f',borderRadius:8,border:'1px solid #1e293b',
                    padding:'20px',color:'#334155',fontSize:11,fontFamily:'monospace',textAlign:'center'}}>
                    Zu wenig Weekly-Daten
                  </div>
                )}

                {/* Daily Chart */}
                {sel.dSlice.length >= 10 ? (
                  <CandleChart
                    ohlcv={sel.dSlice}
                    structure={sel.structD}
                    chartId={`bt_d_${sel.i}`}
                    benchOhlcv={benchData?.benchmark_ohlcv}
                    benchLabel={benchData?.benchmark}
                    tradeMarkers={tradeMarkers}/>
                ) : (
                  <div style={{background:'#07090f',borderRadius:8,border:'1px solid #1e293b',
                    padding:'20px',color:'#334155',fontSize:11,fontFamily:'monospace',textAlign:'center'}}>
                    Keine Daily-Daten für diese Woche
                  </div>
                )}

                {/* 4H Chart – volle Breite */}
                {sel.has4h && sel.struct4H ? (
                  <div className="chart-full-width">
                    <Chart4H
                      ohlcv4h={sel.h4Slice}
                      structure4h={sel.struct4H}
                      chartId={`bt_4h_${sel.i}`}
                      tradeMarkers={tradeMarkers.filter(m => m.type === 'entry')}/>
                  </div>
                ) : (
                  <div className="chart-full-width" style={{background:'#07090f',borderRadius:8,
                    border:'1px solid #1e293b',padding:'14px',color:'#334155',
                    fontSize:11,fontFamily:'monospace',textAlign:'center'}}>
                    4H-Daten nur für die letzten ~730 Tage verfügbar
                  </div>
                )}
              </div>

              {/* Hinweis historische Simulation */}
              <p style={{fontSize:9,color:'#1e293b',marginTop:8,fontFamily:'monospace',textAlign:'center'}}>
                Historische Simulation · Daten geschnitten auf KW {sel.kw}/{sel.year} ({sel.weekEnd}) ·
                W: {sel.wSlice.length} Kerzen · D: {sel.dSlice.length} Kerzen · 4H: {sel.h4Slice.length} Kerzen
              </p>
            </div>
          ) : (
            <div style={{background:'#0a0f1e',border:'1px solid #1e293b',borderRadius:10,
              padding:'40px 24px',textAlign:'center',color:'#334155',fontFamily:'monospace',fontSize:13}}>
              ← Woche in der Tabelle anklicken<br/>
              <span style={{fontSize:11,color:'#1e293b',display:'block',marginTop:8}}>
                Charts zeigen den historisch korrekten Stand dieser KW
              </span>
            </div>
          )}
        </div>

      </div>{/* end desktop-layout */}

      <p style={{textAlign:'center',color:'#1e293b',fontSize:9,marginTop:16,fontFamily:'monospace'}}>
        Daten via yfinance · Kein Handelssignal · Backtest-Modus · Datenladen: python3 load_backtest.py
      </p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<BacktestApp/>);
</script>
</body>
</html>
